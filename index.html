<!DOCTYPE html>
<html lang="pt-PT">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Caroline Medeiros - Organizador Premium</title>
    
    <script src="https://unpkg.com/lucide@latest"></script>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@300;400;500;600;700;800;900&family=Playfair+Display:ital,wght@0,700;0,900;1,700&display=swap" rel="stylesheet">
    
    <style>
        :root {
            --chocolate: #3E2723;
            --chocolate-light: #5D4037;
            --off-white: #FDFBF7;
            --gold: #C5A059;
            --gold-light: #E0C080;
            --text-main: #3E2723;
            --bg-card: #FFFFFF;
            --transition: all 0.4s cubic-bezier(0.16, 1, 0.3, 1);
            --shadow-premium: 0 20px 40px rgba(62, 39, 35, 0.08);
            --shadow-elevated: 0 15px 45px rgba(62, 39, 35, 0.15);
            --danger: #A62121;
            --success: #3E6B27;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Montserrat', sans-serif; -webkit-font-smoothing: antialiased; }
        h1, h2, h3, .monogram, .huge-number { font-family: 'Playfair Display', serif; }

        body { background-color: var(--off-white); color: var(--text-main); min-height: 100vh; display: flex; flex-direction: column; overflow-x: hidden; padding-bottom: 100px; }

        /* --- Lock Screen Majestic --- */
        #lock-screen { position: fixed; inset: 0; background: var(--off-white); z-index: 5000; display: flex; flex-direction: column; justify-content: center; align-items: center; transition: all 0.6s ease; }
        .lock-container { text-align: center; width: 90%; max-width: 500px; }
        .lock-monogram { font-size: 10rem; color: var(--chocolate); font-weight: 900; line-height: 1; margin-bottom: 0px; }
        .lock-brand { font-size: 1.5rem; text-transform: uppercase; letter-spacing: 12px; color: var(--gold); font-weight: 800; margin-bottom: 60px; }
        .lock-input { width: 100%; text-align: center; font-size: 4.5rem; letter-spacing: 25px; border: none; border-bottom: 4px solid var(--gold); background: transparent; padding: 20px; outline: none; color: var(--chocolate); margin-bottom: 40px; font-weight: 900; }

        /* --- UI Framework --- */
        header { padding: 30px 20px; text-align: center; background: rgba(255, 255, 255, 0.85); backdrop-filter: blur(15px); border-bottom: 1px solid rgba(197, 160, 89, 0.1); position: sticky; top: 0; z-index: 100; }
        .header-monogram { font-size: 2.2rem; color: var(--chocolate); font-weight: 900; line-height: 1; }
        .header-brand { font-size: 0.6rem; text-transform: uppercase; letter-spacing: 5px; color: var(--gold); font-weight: 800; margin-top: 5px; }

        .navigation-bar { padding: 12px 5%; background: #fff; display: flex; align-items: center; gap: 8px; font-size: 0.75rem; border-bottom: 1px solid #f0f0f0; overflow-x: auto; white-space: nowrap; }
        .breadcrumb-item { cursor: pointer; color: var(--chocolate-light); font-weight: 700; opacity: 0.5; display: flex; align-items: center; gap: 4px; }
        .breadcrumb-item:last-child { opacity: 1; color: var(--gold); }

        .bottom-nav { position: fixed; bottom: 0; left: 0; right: 0; height: 75px; background: #fff; display: flex; justify-content: space-around; align-items: center; border-top: 1px solid #f0f0f0; z-index: 400; box-shadow: 0 -5px 25px rgba(0,0,0,0.03); }
        .nav-tab { display: flex; flex-direction: column; align-items: center; gap: 4px; color: var(--chocolate-light); cursor: pointer; transition: 0.3s; flex: 1; opacity: 0.4; }
        .nav-tab.active { opacity: 1; color: var(--gold); }
        .nav-tab span { font-size: 0.6rem; font-weight: 800; text-transform: uppercase; }

        main { flex: 1; padding: 25px 6%; max-width: 1200px; margin: 0 auto; width: 100%; animation: fadeIn 0.4s ease; }
        .grid-container { display: grid; grid-template-columns: repeat(auto-fill, minmax(300px, 1fr)); gap: 20px; }
        .card { background: var(--bg-card); padding: 25px; border-radius: 28px; box-shadow: var(--shadow-premium); border: 1px solid rgba(0,0,0,0.02); transition: var(--transition); position: relative; }

        /* --- Widgets --- */
        .hero-meta { background: var(--chocolate); color: white; padding: 40px 20px; border-radius: 35px; text-align: center; border: 1px solid var(--gold); margin-bottom: 25px; }
        .meta-val { font-size: 5.5rem; font-weight: 900; line-height: 1; color: #fff; }
        .stat-line { display: flex; justify-content: space-around; margin-top: 30px; padding-top: 25px; border-top: 1px solid rgba(255,255,255,0.1); }

        .info-pill { background: var(--off-white); padding: 15px; border-radius: 20px; margin-bottom: 12px; border-left: 5px solid var(--gold); }
        .info-pill b { display: block; font-size: 0.75rem; color: var(--gold); margin-bottom: 5px; text-transform: uppercase; font-weight: 800; }

        .cal-grid { display: grid; grid-template-columns: repeat(7, 1fr); gap: 5px; margin-top: 15px; }
        .cal-day { aspect-ratio: 1; display: flex; align-items: center; justify-content: center; border-radius: 50%; font-size: 0.85rem; font-weight: 800; cursor: pointer; color: var(--chocolate); }
        .cal-day.period { background: rgba(166, 33, 33, 0.15); color: var(--danger); }
        .cal-day.fertile { background: rgba(197, 160, 89, 0.15); color: var(--gold); }
        .cal-day.today { border: 2px solid var(--gold); }

        /* --- Tools --- */
        .tool-item { display: flex; justify-content: space-between; align-items: center; padding: 15px 0; border-bottom: 1px solid #f9f9f9; }
        .tool-item b { font-size: 1rem; color: var(--chocolate); }
        .tool-item small { font-weight: 700; color: var(--gold); }

        /* --- Form Elements --- */
        .form-group { margin-bottom: 20px; }
        .form-group label { display: block; font-size: 0.7rem; font-weight: 800; color: var(--gold); margin-bottom: 8px; text-transform: uppercase; letter-spacing: 1px; }
        .form-control { width: 100%; padding: 18px; border: 1px solid #eee; border-radius: 16px; font-size: 1rem; background: #fafafa; outline: none; transition: 0.3s; color: var(--chocolate); }
        .form-control:focus { border-color: var(--gold); background: #fff; }
        textarea.form-control { min-height: 80px; resize: none; overflow: hidden; line-height: 1.6; }

        .btn-primary { background: var(--chocolate); color: white; border: none; padding: 18px 30px; border-radius: 50px; font-weight: 800; font-size: 0.85rem; cursor: pointer; transition: 0.3s; box-shadow: 0 10px 20px rgba(62, 39, 35, 0.15); width: 100%; }
        .btn-mini { width: 32px; height: 32px; border-radius: 50%; background: var(--off-white); border: 1px solid #eee; display: flex; align-items: center; justify-content: center; cursor: pointer; color: var(--chocolate); }

        #modal-overlay { position: fixed; inset: 0; background: rgba(62, 39, 35, 0.6); backdrop-filter: blur(10px); z-index: 1000; display: none; justify-content: center; align-items: center; padding: 20px; }
        .modal { background: #fff; width: 100%; max-width: 500px; border-radius: 40px; padding: 35px; max-height: 85vh; overflow-y: auto; }

        .mural-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(140px, 1fr)); gap: 15px; }
        .mural-item { border-radius: 20px; overflow: hidden; position: relative; aspect-ratio: 3/4; background: #eee; }
        .mural-img { width: 100%; height: 100%; object-fit: cover; }
        .mural-cap { position: absolute; bottom: 0; width: 100%; padding: 10px; background: rgba(62, 39, 35, 0.8); color: white; font-size: 0.7rem; font-weight: 700; text-align: center; }

        @keyframes fadeIn { from { opacity: 0; transform: translateY(15px); } to { opacity: 1; transform: translateY(0); } }
    </style>
</head>
<body autocomplete="off">

<!-- Ecrã de Segurança -->
<div id="lock-screen">
    <div class="lock-container">
        <div class="lock-monogram">CM</div>
        <div class="lock-brand">Caroline Medeiros</div>
        <input type="password" id="pin-field" class="lock-input" placeholder="••••" maxlength="4" autocomplete="off">
        <div id="pin-err" style="color:var(--danger); font-size:0.8rem; font-weight:800; margin-bottom:25px; height:20px;"></div>
        <button onclick="checkPin()" class="btn-primary" style="font-size:1.1rem; letter-spacing:2px; padding: 22px;">ACEDER AO ORGANIZADOR</button>
    </div>
</div>

<header>
    <div class="header-monogram">CM</div>
    <div class="header-brand">Caroline Medeiros</div>
</header>

<div class="navigation-bar" id="breadcrumbs"></div>

<main id="app-view"></main>

<!-- Navegação Inferior -->
<nav class="bottom-nav">
    <div class="nav-tab active" id="tab-root" onclick="goBack(0)"><i data-lucide="home"></i><span>Home</span></div>
    <div class="nav-tab" id="tab-saude" onclick="navigate('saude')"><i data-lucide="heart-pulse"></i><span>Saúde</span></div>
    <div class="nav-tab" id="tab-financeiro" onclick="navigate('financeiro')"><i data-lucide="trending-up"></i><span>Finanças</span></div>
    <div class="nav-tab" id="tab-biblia" onclick="navigate('biblia')"><i data-lucide="book-marked"></i><span>Bíblia</span></div>
    <div class="nav-tab" onclick="toggleFabMenu(event)"><i data-lucide="plus-circle"></i><span>Menu</span></div>
</nav>

<!-- FAB Menu Integrado -->
<div id="fab-overlay" style="position:fixed; inset:0; z-index:350; display:none;" onclick="this.style.display='none'">
    <div id="fab-dropdown" style="position:absolute; bottom:90px; right:20px; background:#fff; border-radius:25px; box-shadow:0 20px 60px rgba(0,0,0,0.2); width:210px; overflow:hidden; border:1px solid #eee;">
        <div class="menu-option" style="padding:15px; font-size:0.8rem; font-weight:800; border-bottom:1px solid #f9f9f9; cursor:pointer;" onclick="openModal('folder')"><i data-lucide="folder" style="width:16px; margin-right:8px; vertical-align:middle;"></i> Pasta</div>
        <div class="menu-option" style="padding:15px; font-size:0.8rem; font-weight:800; border-bottom:1px solid #f9f9f9; cursor:pointer;" onclick="openModal('note')"><i data-lucide="file-text" style="width:16px; margin-right:8px; vertical-align:middle;"></i> Nota</div>
        <div class="menu-option" style="padding:15px; font-size:0.8rem; font-weight:800; border-bottom:1px solid #f9f9f9; cursor:pointer;" onclick="openModal('checklist')"><i data-lucide="check-square" style="width:16px; margin-right:8px; vertical-align:middle;"></i> Checklist</div>
        <div class="menu-option" style="padding:15px; font-size:0.8rem; font-weight:800; border-bottom:1px solid #f9f9f9; cursor:pointer;" onclick="openModal('visionboard')"><i data-lucide="image" style="width:16px; margin-right:8px; vertical-align:middle;"></i> Visionboard</div>
        <div class="menu-option" style="padding:15px; font-size:0.8rem; font-weight:800; border-bottom:1px solid #f9f9f9; cursor:pointer;" onclick="openModal('bank')"><i data-lucide="credit-card" style="width:16px; margin-right:8px; vertical-align:middle;"></i> Banco</div>
        <div class="menu-option" style="padding:15px; font-size:0.8rem; font-weight:800; border-bottom:1px solid #f9f9f9; cursor:pointer;" onclick="openModal('social')"><i data-lucide="user-lock" style="width:16px; margin-right:8px; vertical-align:middle;"></i> Login Social</div>
        <div class="menu-option" style="padding:15px; font-size:0.8rem; font-weight:800; cursor:pointer; color:var(--gold);" onclick="exportData()"><i data-lucide="download" style="width:16px; margin-right:8px; vertical-align:middle;"></i> Backup</div>
        <div class="menu-option" style="padding:15px; font-size:0.8rem; font-weight:800; cursor:pointer; color:var(--gold);" onclick="triggerImport()"><i data-lucide="upload" style="width:16px; margin-right:8px; vertical-align:middle;"></i> Restaurar</div>
    </div>
</div>

<div id="modal-overlay">
    <div class="modal">
        <h2 id="m-title" style="text-align:center; margin-bottom:25px; color:var(--chocolate)"></h2>
        <div id="m-body"></div>
        <div style="display:flex; gap:12px; margin-top:30px;">
            <button class="btn-primary" style="background:#f5f5f5; color:#888;" onclick="closeModal()">Sair</button>
            <button class="btn-primary" id="m-save">Guardar</button>
        </div>
    </div>
</div>

<div id="lightbox" onclick="this.style.display='none'" style="position:fixed; inset:0; background:rgba(0,0,0,0.9); z-index:2000; display:none; justify-content:center; align-items:center;"><img id="li-img" style="max-width:95%; max-height:85vh; border-radius:15px;"></div>
<input type="file" id="import-input" style="display:none" accept=".json">

<script>
    // --- Database Management ---
    const DB_KEY = "cm_luxury_v10_final";

    let state = {
        path: ['root'],
        items: JSON.parse(localStorage.getItem(DB_KEY + "_items")) || [],
        menstrual: JSON.parse(localStorage.getItem(DB_KEY + "_men")) || { last: "2024-01-01", cycle: 28, flow: 5 },
        bible: { book: "Gênesis", cap: 1 }
    };

    function sync() {
        localStorage.setItem(DB_KEY + "_items", JSON.stringify(state.items));
        localStorage.setItem(DB_KEY + "_men", JSON.stringify(state.menstrual));
        renderApp();
    }

    function checkPin() {
        if(document.getElementById('pin-field').value === "2405") {
            document.getElementById('lock-screen').style.opacity = '0';
            setTimeout(() => document.getElementById('lock-screen').style.display = 'none', 600);
        } else {
            document.getElementById('pin-err').innerText = "SENHA INCORRETA";
            document.getElementById('pin-field').value = "";
        }
    }

    // Auto-Resize para Textareas
    function autoGrow(el) {
        el.style.height = 'auto';
        el.style.height = el.scrollHeight + 'px';
    }
    document.addEventListener('input', e => { if(e.target.tagName === 'TEXTAREA') autoGrow(e.target); });

    // --- Core Navigation ---
    function navigate(id) { state.path.push(id); renderApp(); }
    function goBack(idx) { state.path = state.path.slice(0, idx + 1); renderApp(); }

    function renderApp() {
        const cur = state.path[state.path.length - 1];
        const view = document.getElementById('app-view');
        const bread = document.getElementById('breadcrumbs');

        document.querySelectorAll('.nav-tab').forEach(t => t.classList.remove('active'));
        const tab = document.getElementById('tab-' + cur); if(tab) tab.classList.add('active');

        bread.innerHTML = state.path.map((id, i) => {
            const label = id === 'root' ? 'Início' : (ROOT_CATS.find(c=>c.id===id)?.name || state.items.find(it=>it.id===id)?.name || "...");
            return `<span class="breadcrumb-item" onclick="goBack(${i})">${i>0?'<i data-lucide="chevron-right" style="width:12px"></i>':''} ${label}</span>`;
        }).join('');

        if (cur === 'root') renderHome(view);
        else if (cur === 'saude') renderSaude(view);
        else if (cur === 'financeiro') renderFinance(view);
        else if (cur === 'biblia') renderBible(view);
        else renderGeneral(view, cur);

        if(window.lucide) lucide.createIcons();
    }

    const ROOT_CATS = [
        { id: 'pessoal', name: 'Pessoal', icon: 'user' },
        { id: 'profissional', name: 'Profissional', icon: 'briefcase' },
        { id: 'financeiro', name: 'Finanças', icon: 'trending-up' },
        { id: 'saude', name: 'Saúde', icon: 'heart' },
        { id: 'biblia', name: 'Bíblia', icon: 'book-open' }
    ];

    function renderHome(el) {
        el.innerHTML = `<h1 style="font-size:2.2rem; margin-bottom:25px; color:var(--chocolate)">Boas-vindas</h1>
        <div class="grid-container">
            ${ROOT_CATS.map(c => `
                <div class="card" style="display:flex; align-items:center; cursor:pointer;" onclick="navigate('${c.id}')">
                    <div style="width:50px; height:50px; background:var(--off-white); border-radius:15px; display:flex; align-items:center; justify-content:center; color:var(--gold); margin-right:15px;"><i data-lucide="${c.icon}"></i></div>
                    <b style="font-size:1.1rem;">${c.name}</b>
                </div>`).join('')}
            ${state.items.filter(i => i.type === 'custom_area' && i.parentId === 'root').map(i => `
                <div class="card" style="display:flex; align-items:center; cursor:pointer;" onclick="navigate('${i.id}')">
                    <div style="width:50px; height:50px; background:var(--off-white); border-radius:15px; display:flex; align-items:center; justify-content:center; color:var(--gold); margin-right:15px;"><i data-lucide="star"></i></div>
                    <b style="font-size:1.1rem; flex:1;">${i.name}</b>
                    <i data-lucide="trash-2" style="width:14px; opacity:0.2; color:var(--danger)" onclick="deleteItem('${i.id}', event)"></i>
                </div>`).join('')}
        </div>`;
    }

    function calculateWeight() {
        const w = state.items.find(i => i.type === 'health_weight');
        if(!w || !w.content.target) return null;
        const hist = w.content.history || [];
        const curW = hist.length ? hist.sort((a,b)=>new Date(b.date)-new Date(a.date))[0].weight : w.content.startWeight;
        const left = curW - w.content.target;
        const end = new Date(w.content.startDate); end.setMonth(end.getMonth() + (parseInt(w.content.periodMonths) || 1));
        const monLeft = Math.max(1, Math.ceil((end - new Date()) / (86400000 * 30.41)));
        let h = parseFloat(w.content.height); if(h > 3) h /= 100;
        return { mma: left > 0 ? (left / monLeft).toFixed(2) : "0.00", current: curW, imc: h > 0 ? (curW/(h*h)).toFixed(1) : "--", water: (curW*0.035).toFixed(1) };
    }

    function renderSaude(el) {
        const s = calculateWeight();
        const w = state.items.find(i => i.type === 'health_weight');
        const d = state.items.find(i => i.type === 'health_food') || { content: {} };
        const m = state.items.filter(i => i.type === 'health_med');

        el.innerHTML = `
            <div class="hero-meta">
                <span class="meta-label">Meta Mensal de Perda</span>
                <div class="meta-val">${s ? s.mma : '--'}<small style="font-size:1.2rem; color:var(--gold-light)">kg</small></div>
                <div class="stat-line">
                    <div class="stat-box"><small>Peso Atual</small><b>${s ? s.current : '--'}kg</b></div>
                    <div class="stat-box"><small>IMC</small><b>${s ? s.imc : '--'}</b></div>
                    <div class="stat-box"><small>Água/Dia</small><b>${s ? s.water : '--'}L</b></div>
                </div>
            </div>

            <div class="grid-container">
                <div class="card" style="display:block;">
                    <div style="display:flex; justify-content:space-between; margin-bottom:15px;"><b>Dieta e Jejum</b> <i data-lucide="edit-3" onclick="openModal('health_food')" style="color:var(--gold); cursor:pointer; width:18px;"></i></div>
                    <div class="info-pill"><b>Café:</b> <p>${d.content.b || '-'}</p></div>
                    <div class="info-pill"><b>Almoço:</b> <p>${d.content.l || '-'}</p></div>
                    <div class="info-pill"><b>Jantar:</b> <p>${d.content.d || '-'}</p></div>
                </div>

                <div class="card" style="display:block;">
                    <div style="display:flex; justify-content:space-between; margin-bottom:15px;"><b>Medicamentos</b> <i data-lucide="plus" onclick="openModal('health_med')" style="color:var(--gold); cursor:pointer; width:18px;"></i></div>
                    ${m.map(med => `<div class="tool-item"><b>${med.name}</b><small>${med.content.time} — ${med.content.dose}</small><i data-lucide="trash-2" style="width:12px; opacity:0.3; color:var(--danger); cursor:pointer" onclick="deleteItem('${med.id}')"></i></div>`).join('')}
                </div>

                <div class="card" style="display:block;">
                    <div style="display:flex; justify-content:space-between; margin-bottom:15px;"><b>Ciclo</b> <i data-lucide="settings" onclick="openModal('menstrual_config')" style="color:var(--gold); cursor:pointer; width:18px;"></i></div>
                    ${renderMenstrualCal()}
                </div>
            </div>
            
            <button class="btn-primary" style="margin-top:20px; font-size:1rem; padding:22px" onclick="openModal('health_weight_register')">PESAR HOJE</button>
            <button class="btn-primary" style="margin-top:10px; background:#f0f0f0; color:#aaa; box-shadow:none;" onclick="openModal('health_weight_config')">CONFIGURAR METAS</button>
        `;
    }

    function renderMenstrualCal() {
        const now = new Date();
        const last = new Date(state.menstrual.last + 'T12:00:00');
        const cycle = parseInt(state.menstrual.cycle);
        const dur = parseInt(state.menstrual.flow);
        let html = `<div style="display:grid; grid-template-columns: repeat(7, 1fr); text-align:center; font-size:0.6rem; font-weight:900; color:var(--gold); margin-bottom:10px;">
            <div>D</div><div>S</div><div>T</div><div>Q</div><div>Q</div><div>S</div><div>S</div></div><div class="cal-grid">`;
        const startDay = new Date(now.getFullYear(), now.getMonth(), 1).getDay();
        const days = new Date(now.getFullYear(), now.getMonth() + 1, 0).getDate();
        for(let i=0; i<startDay; i++) html += `<div></div>`;
        for(let d=1; d<=days; d++) {
            const current = new Date(now.getFullYear(), now.getMonth(), d);
            const diff = Math.floor((current - last) / 86400000);
            const dayInCycle = ((diff % cycle) + cycle) % cycle;
            let cls = "cal-day";
            if(dayInCycle < dur) cls += " period";
            if(dayInCycle >= cycle - 16 && dayInCycle <= cycle - 11) cls += " fertile";
            if(d === now.getDate()) cls += " today";
            html += `<div class="${cls}">${d}</div>`;
        }
        return html + `</div>`;
    }

    function renderFinance(el) {
        const inc = state.items.filter(i => i.type === 'finance_in');
        const exp = state.items.filter(i => i.type === 'finance_out');
        const pig = state.items.filter(i => i.type === 'finance_pig');
        const sumIn = inc.reduce((a,b)=>a+parseFloat(b.content.value||0), 0);
        const sumOut = exp.reduce((a,b)=>a+parseFloat(b.content.value||0), 0);

        el.innerHTML = `
            <div class="hero-meta" style="background:#fff; color:var(--chocolate); border-color:#eee">
                <span class="label">Balanço do Mês</span>
                <div class="meta-val" style="color:var(--chocolate)">€ ${(sumIn-sumOut).toFixed(2)}</div>
                <div class="stat-line">
                    <div class="stat-box"><small style="color:var(--success)">Entradas</small><b style="color:var(--success)">€ ${sumIn.toFixed(2)}</b></div>
                    <div class="stat-box"><small style="color:var(--danger)">Saídas</small><b style="color:var(--danger)">€ ${sumOut.toFixed(2)}</b></div>
                </div>
            </div>
            <div class="grid-container">
                <div class="card" onclick="navigate('folder_in')"><b>Receitas</b></div>
                <div class="card" onclick="navigate('folder_out')"><b>Despesas</b></div>
                <div class="card" style="display:block;">
                    <div class="section-header"><b>Porquinhos</b> <i data-lucide="plus" onclick="openModal('finance_pig')" style="color:var(--gold); cursor:pointer; width:16px;"></i></div>
                    ${pig.map(p => `
                        <div class="piggy-card">
                            <div style="display:flex; justify-content:space-between; font-size:0.8rem;"><b>${p.name}</b> <span>€ ${p.content.saved} / ${p.content.target}</span></div>
                            <div class="progress-bar"><div class="progress-fill" style="width:${(p.content.saved/p.content.target)*100}%"></div></div>
                        </div>`).join('')}
                </div>
            </div>
        `;
    }

    async function renderBible(el) {
        el.innerHTML = `<h2 style="font-size:2rem; margin-bottom:25px; color:var(--chocolate);">Escrituras</h2>
        <div style="display:flex; gap:10px; margin-bottom:25px;">
            <select id="bib-b" class="form-control" style="flex:2;" onchange="state.bible.book=this.value; fetchBibleText();"></select>
            <input type="number" id="bib-c" class="form-control" style="flex:1;" value="${state.bible.cap}" onchange="state.bible.cap=this.value; fetchBibleText();">
        </div>
        <div id="bib-text" class="card" style="display:block; min-height:450px; line-height:2.2; font-size:1.1rem; color:#444;">Buscando Palavra...</div>`;
        const books = ["Gênesis", "Êxodo", "Levítico", "Números", "Deuteronômio", "Josué", "Juízes", "Rute", "1 Samuel", "2 Samuel", "1 Reis", "2 Reis", "1 Crônicas", "2 Crônicas", "Esdras", "Neemias", "Ester", "Jó", "Salmos", "Provérbios", "Eclesiastes", "Cânticos", "Isaías", "Jeremias", "Lamentações", "Ezequiel", "Daniel", "Oseias", "Joel", "Amós", "Obadias", "Jonas", "Miqueias", "Naum", "Habacuque", "Sofonias", "Ageu", "Zacarias", "Malaquias", "Mateus", "Marcos", "Lucas", "João", "Atos", "Romanos", "1 Coríntios", "2 Coríntios", "Gálatas", "Efésios", "Filipenses", "Colossenses", "1 Tessalonicenses", "2 Tessalonicenses", "1 Timóteo", "2 Timóteo", "Tito", "Filemom", "Hebreus", "Tiago", "1 Pedro", "2 Pedro", "1 João", "2 João", "3 João", "Judas", "Apocalipse"];
        const sel = document.getElementById('bib-b');
        books.forEach(b => {
            const opt = document.createElement('option'); opt.value = b; opt.innerText = b;
            if(b === state.bible.book) opt.selected = true;
            sel.appendChild(opt);
        });
        fetchBibleText();
    }

    async function fetchBibleText() {
        const target = document.getElementById('bib-text');
        try {
            const res = await fetch('https://raw.githubusercontent.com/thiagobodruk/bible/master/json/pt_nvi.json');
            const data = await res.json();
            const book = data.find(b => b.name === state.bible.book);
            const verses = book.chapters[state.bible.cap - 1];
            target.innerHTML = verses.map((v, i) => `<p style="margin-bottom:20px;"><sup style="color:var(--gold); font-weight:900; margin-right:10px;">${i+1}</sup>${v}</p>`).join('');
        } catch(e) { target.innerHTML = "Erro ao carregar Bíblia."; }
    }

    function renderGeneral(el, pid) {
        const f = state.items.find(i => i.id === pid);
        const children = state.items.filter(i => i.parentId === pid);
        if (f?.type === 'visionboard') {
            el.innerHTML = `<div class="section-header"><h2>${f.name}</h2><button class="btn-primary" style="width:auto; padding:10px 20px" onclick="openModal('vision_add', '${pid}')">ADICIONAR</button></div>
            <div class="mural-grid">${(f.content.images || []).map((img, idx) => `
                <div class="mural-item">
                    <img src="${img.data}" class="mural-img" onclick="showLb('${img.data}')">
                    <div class="mural-cap">${img.caption}</div>
                    <button style="position:absolute; top:8px; right:8px; border:none; background:white; border-radius:50%; width:24px; height:24px" onclick="deleteVisionImg('${pid}', ${idx})">×</button>
                </div>`).join('')}</div>`;
            return;
        }
        el.innerHTML = `<div class="section-header"><h2>${f?.name || "Pasta"}</h2></div><div class="grid-container">
            ${children.map(i => `
                <div class="card" style="display:flex; justify-content:space-between; align-items:center;">
                    <div onclick="navigate('${i.id}')" style="cursor:pointer; flex:1; display:flex; align-items:center;">
                        <i data-lucide="${i.type === 'folder' ? 'folder' : 'file-text'}" style="width:18px; margin-right:12px; color:var(--gold);"></i>
                        <b style="font-size:1.1rem;">${i.name}</b>
                    </div>
                    <i data-lucide="trash-2" style="width:16px; opacity:0.2; color:var(--danger); cursor:pointer" onclick="deleteItem('${i.id}')"></i>
                </div>`).join('')}
        </div>`;
    }

    // --- Modal System ---
    function openModal(type, extra = null) {
        const overlay = document.getElementById('modal-overlay');
        const body = document.getElementById('mb');
        const title = document.getElementById('m-title');
        overlay.style.display = 'flex';
        let html = '';

        if(type === 'note') {
            title.innerText = "Nova Nota";
            html = `<div class="form-group"><label>Título</label><input id="f-name" class="form-control"></div>
                    <div class="form-group"><label>Texto</label><textarea id="f-text" class="form-control"></textarea></div>`;
        }
        else if (type === 'health_food') {
            const d = state.items.find(i=>i.type === 'health_food') || {content:{}};
            title.innerText = "Dieta";
            html = `<div class="form-group"><label>Café</label><textarea id="f-b" class="form-control">${d.content.b||''}</textarea></div>
                    <div class="form-group"><label>Almoço</label><textarea id="f-l" class="form-control">${d.content.l||''}</textarea></div>
                    <div class="form-group"><label>Jantar</label><textarea id="f-d" class="form-control">${d.content.d||''}</textarea></div>
                    <div class="form-group"><label>Jejum (Início/Fim)</label><div style="display:flex;gap:5px;"><input type="time" id="f-fs" class="form-control" value="${d.content.fs||'20:00'}"><input type="time" id="f-fe" class="form-control" value="${d.content.fe||'08:00'}"></div></div>`;
        }
        else if (type === 'health_med') {
            title.innerText = "Remédio";
            html = `<div class="form-group"><label>Nome</label><input id="f-name" class="form-control"></div>
                    <div class="form-group"><label>Dose</label><input id="f-dose" class="form-control"></div>
                    <div class="form-group"><label>Hora</label><input type="time" id="f-time" class="form-control"></div>`;
        }
        else if (type === 'health_weight_config') {
            const w = state.items.find(i=>i.type === 'health_weight') || {content:{}};
            title.innerText = "Metas";
            html = `<div class="form-group"><label>Meta Final (kg)</label><input type="number" id="f-target" class="form-control" value="${w.content.target||''}"></div>
                    <div class="form-group"><label>Peso Inicial</label><input type="number" id="f-start" class="form-control" value="${w.content.startWeight||''}"></div>
                    <div class="form-group"><label>Altura (m)</label><input type="number" id="f-height" class="form-control" value="${w.content.height||''}" step="0.01"></div>
                    <div class="form-group"><label>Prazo (Meses)</label><input type="number" id="f-months" class="form-control" value="${w.content.periodMonths||''}"></div>
                    <div class="form-group"><label>Início</label><input type="date" id="f-date" class="form-control" value="${w.content.startDate||''}"></div>`;
        }
        else if (type === 'health_weight_register') {
            title.innerText = "Novo Peso";
            html = `<div class="form-group"><label>Peso Hoje (kg)</label><input type="number" id="f-weight" class="form-control" step="0.1" autofocus></div>
                    <div class="form-group"><label>Data</label><input type="date" id="f-date" class="form-control" value="${new Date().toISOString().split('T')[0]}"></div>`;
        }
        else if (type === 'vision_add') {
            title.innerText = "Foto Sonho";
            html = `<div class="form-group"><label>Foto</label><input type="file" id="f-img" class="form-control"></div>
                    <div class="form-group"><label>Legenda</label><textarea id="f-cap" class="form-control"></textarea></div>`;
        }
        else if (type === 'bank') {
            title.innerText = "Banco";
            html = `<div class="form-group"><label>Banco</label><input id="f-name" class="form-control"></div>
                    <div class="form-group"><label>Agência/Conta</label><input id="f-acc" class="form-control"></div>
                    <div class="form-group"><label>Titular/PIX</label><input id="f-pix" class="form-control"></div>`;
        }
        else if (type === 'menstrual_config') {
            title.innerText = "Ciclo";
            html = `<div class="form-group"><label>Ciclo (Dias)</label><input type="number" id="f-c" class="form-control" value="${state.menstrual.cycle}"></div>
                    <div class="form-group"><label>Fluxo (Dias)</label><input type="number" id="f-f" class="form-control" value="${state.menstrual.flow}"></div>
                    <div class="form-group"><label>Última Data</label><input type="date" id="f-l" class="form-control" value="${state.menstrual.last}"></div>`;
        }
        else {
            title.innerText = "Novo Item";
            html = `<div class="form-group"><label>Nome</label><input id="f-name" class="form-control"></div>`;
        }

        body.innerHTML = html;
        body.querySelectorAll('textarea').forEach(autoGrow);
        document.getElementById('modal-save').onclick = () => handleSave(type, extra);
    }

    async function handleSave(type, extra) {
        const getV = id => document.getElementById(id)?.value;
        const pid = state.path[state.path.length-1];

        if (type === 'note') {
            state.items.push({ id: 'n'+Date.now(), parentId: pid, type, name: getV('f-name'), content: { text: getV('f-text') } });
        }
        else if (type === 'health_food') {
            let hf = state.items.find(i=>i.type === 'health_food');
            const d = { b: getV('f-b'), l: getV('f-l'), d: getV('f-d'), fs: getV('f-fs'), fe: getV('f-fe') };
            if(!hf) state.items.push({ id: 'diet', type: 'health_food', parentId: 'saude', name: 'Dieta', content: d });
            else hf.content = d;
        }
        else if (type === 'health_med') {
            state.items.push({ id: 'med'+Date.now(), type: 'health_med', parentId: 'saude', name: getV('f-name'), content: { dose: getV('f-dose'), time: getV('f-time') } });
        }
        else if (type === 'health_weight_config') {
            let hw = state.items.find(i=>i.type === 'health_weight');
            const d = { startWeight: parseFloat(getV('f-start')), target: parseFloat(getV('f-target')), height: parseFloat(getV('f-height')), periodMonths: getV('f-months'), startDate: getV('f-date') };
            if(!hw) state.items.push({ id: 'hw', type: 'health_weight', parentId: 'saude', name: 'Peso', content: { ...d, history: [] } });
            else hw.content = { ...hw.content, ...d };
        }
        else if (type === 'health_weight_register') {
            const hw = state.items.find(i=>i.type === 'health_weight');
            if(!hw.content.history) hw.content.history = [];
            hw.content.history.push({ id: 'w'+Date.now(), date: getV('f-date'), weight: parseFloat(getV('f-weight')) });
        }
        else if (type === 'vision_add') {
            const f = document.getElementById('f-img').files[0];
            if(f) {
                const r = new FileReader();
                r.onload = e => {
                    const vb = state.items.find(i => i.id === extra);
                    if(!vb.content.images) vb.content.images = [];
                    vb.content.images.push({ data: e.target.result, caption: getV('f-cap') });
                    sync(); closeModal();
                };
                r.readAsDataURL(f); return;
            }
        }
        else if (type === 'menstrual_config') {
            state.menstrual = { cycle: getV('f-c'), flow: getV('f-f'), last: getV('f-l') };
        }
        else if (type === 'bank') {
            state.items.push({ id: 'b'+Date.now(), parentId: pid, type, name: getV('f-name'), content: { acc: getV('f-acc'), pix: getV('f-pix') } });
        }
        else {
            state.items.push({ id: 'i'+Date.now(), parentId: pid, type, name: getV('f-name'), content: {} });
        }
        sync(); closeModal();
    }

    // --- Helpers ---
    function closeModal() { document.getElementById('modal-overlay').style.display = 'none'; }
    function toggleFabMenu(e) { e.stopPropagation(); document.getElementById('fab-overlay').style.display = 'block'; }
    function deleteItem(id, e) { if(e) e.stopPropagation(); if(confirm("Apagar permanentemente?")) { state.items = state.items.filter(i=>i.id !== id); sync(); } }
    function deleteVisionImg(vid, idx) { if(confirm("Apagar?")) { state.items.find(i=>i.id===vid).content.images.splice(idx,1); sync(); } }
    function showLb(s) { document.getElementById('li-img').src=s; document.getElementById('lightbox').style.display='flex'; }
    function exportData() { const blob = new Blob([JSON.stringify(state)], {type: 'application/json'}); const a = document.createElement('a'); a.href = URL.createObjectURL(blob); a.download = 'organizador_backup.json'; a.click(); }
    function triggerImport() { document.getElementById('import-input').click(); }
    document.getElementById('import-input').onchange = e => {
        const r = new FileReader();
        r.onload = ev => { state = JSON.parse(ev.target.result); sync(); alert("Backup Restaurado!"); };
        r.readAsText(e.target.files[0]);
    };

    document.addEventListener('click', () => { document.getElementById('fab-overlay').style.display = 'none'; });

    // --- Boot ---
    renderApp();
</script>
</body>
</html>
