<!DOCTYPE html>
<html lang="pt-PT">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Caroline Medeiros - Organizador Premium</title>
    
    <script src="https://unpkg.com/lucide@latest"></script>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700&family=Playfair+Display:ital,wght@0,600;0,700;1,600&display=swap" rel="stylesheet">
    
    <style>
        :root {
            --chocolate: #3E2723;
            --chocolate-light: #5D4037;
            --off-white: #FDFBF7;
            --gold: #C5A059;
            --gold-light: #E0C080;
            --text-main: #3E2723;
            --success: #558B2F;
            --danger: #C62828;
            --bg-card: #FFFFFF;
            --transition: all 0.3s cubic-bezier(0.25, 0.8, 0.25, 1);
            --shadow: 0 10px 30px -5px rgba(62, 39, 35, 0.1);
            --shadow-hover: 0 15px 35px -5px rgba(197, 160, 89, 0.2);
            --period-line: #5D4037; 
            --heart-safe: #C5A059; 
            --heart-unsafe: #5D4037;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Montserrat', 'Segoe UI', sans-serif; }
        h1, h2, h3, .monogram { font-family: 'Playfair Display', 'Georgia', serif; }

        body { background-color: var(--off-white); color: var(--text-main); min-height: 100vh; display: flex; flex-direction: column; overflow-x: hidden; }

        /* --- Scrollbar --- */
        ::-webkit-scrollbar { width: 6px; height: 6px; }
        ::-webkit-scrollbar-track { background: transparent; }
        ::-webkit-scrollbar-thumb { background: rgba(62, 39, 35, 0.2); border-radius: 3px; }
        ::-webkit-scrollbar-thumb:hover { background: var(--gold); }

        /* --- Header --- */
        header { padding: 20px 20px 15px; text-align: center; background: rgba(255, 255, 255, 0.95); backdrop-filter: blur(10px); border-bottom: 1px solid rgba(197, 160, 89, 0.2); position: sticky; top: 0; z-index: 50; }
        .monogram { font-size: 2.2rem; letter-spacing: 2px; color: var(--chocolate); line-height: 1; }
        .brand-name { font-size: 0.7rem; text-transform: uppercase; letter-spacing: 3px; color: var(--gold); font-weight: 700; margin-top: 4px; }
        .date-time-display { font-size: 0.75rem; color: #8D6E63; margin-top: 8px; font-weight: 500; }

        /* --- Navigation --- */
        .navigation-bar { padding: 10px 5%; background: #fff; display: flex; align-items: center; gap: 10px; font-size: 0.9rem; border-bottom: 1px solid #f0f0f0; overflow-x: auto; white-space: nowrap; }
        .breadcrumb-item { cursor: pointer; color: var(--chocolate-light); font-weight: 600; display: flex; align-items: center; gap: 4px; padding: 4px 8px; border-radius: 6px; transition: var(--transition); }
        .breadcrumb-item:hover { background: #f5f5f5; color: var(--gold); }

        /* --- Main --- */
        main { flex: 1; padding: 25px 5%; max-width: 1200px; margin: 0 auto; width: 100%; position: relative; animation: fadeIn 0.4s ease-out; overflow: visible !important; }
        .section-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; flex-wrap: wrap; gap: 15px; position: relative; z-index: 20; }
        .section-header h2 { color: var(--chocolate); }

        /* --- Cards & Stacking Logic --- */
        .grid-container { display: grid; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); gap: 20px; overflow: visible !important; contain: none !important; }
        .card { background: var(--bg-card); padding: 25px; border-radius: 24px; border: 1px solid rgba(0,0,0,0.03); box-shadow: var(--shadow); cursor: pointer; transition: var(--transition); display: flex; align-items: center; gap: 15px; position: relative; overflow: visible !important; z-index: 1; }
        .card:hover { transform: translateY(-4px); box-shadow: var(--shadow-hover); border-color: rgba(197, 160, 89, 0.3); z-index: 10; }

        .card:has(.create-menu-dropdown.show), .finance-item:has(.create-menu-dropdown.show), .piggy-card:has(.create-menu-dropdown.show), div:has(> .create-menu-dropdown.show) { z-index: 2147483647 !important; transform: none !important; filter: none !important; opacity: 1 !important; perspective: none !important; clip-path: none !important; mask: none !important; position: relative !important; box-shadow: 0 20px 50px rgba(0,0,0,0.2) !important; overflow: visible !important; }
        
        .card.selected { border: 2px solid var(--success); background-color: rgba(85, 139, 47, 0.05); }
        .card.selection-mode { cursor: pointer; }
        .selection-check { position: absolute; top: 15px; right: 15px; color: var(--success); display: none; }
        .card.selected .selection-check { display: block; }

        /* --- Buttons --- */
        .btn-add { background: var(--chocolate); color: white; border: none; padding: 10px 24px; border-radius: 30px; cursor: pointer; font-size: 0.8rem; display: inline-flex; align-items: center; gap: 8px; font-weight: 600; box-shadow: 0 4px 12px rgba(62, 39, 35, 0.2); transition: 0.2s; }
        .btn-add:hover { background: var(--chocolate-light); transform: translateY(-1px); }
        .btn-cancel { background: #f5f5f5; color: #666; border: 1px solid #eee; padding: 10px 24px; border-radius: 30px; cursor: pointer; font-size: 0.8rem; font-weight: 600; transition: 0.2s; }
        .btn-cancel:hover { background: #e0e0e0; }
        .btn-check { width: 32px; height: 32px; border-radius: 50%; border: 2px solid #ddd; display: flex; align-items: center; justify-content: center; cursor: pointer; color: transparent; transition: 0.2s; }
        .btn-check.active { background: var(--success); border-color: var(--success); color: white; }
        
        /* --- Floating Dashboard Button --- */
        .floating-star-btn { position: fixed; bottom: 30px; right: 30px; width: 60px; height: 60px; background: var(--gold); border-radius: 50%; box-shadow: 0 10px 30px rgba(197, 160, 89, 0.5); display: flex; align-items: center; justify-content: center; cursor: pointer; z-index: 1000; animation: pulse-gold 3s infinite; transition: transform 0.3s; }
        .floating-star-btn:hover { transform: scale(1.1) rotate(15deg); }
        @keyframes pulse-gold { 0% { box-shadow: 0 0 0 0 rgba(197, 160, 89, 0.7); } 70% { box-shadow: 0 0 0 15px rgba(197, 160, 89, 0); } 100% { box-shadow: 0 0 0 0 rgba(197, 160, 89, 0); } }

        /* --- Lock Screen --- */
        #lock-screen { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: var(--off-white); z-index: 100000; display: flex; flex-direction: column; justify-content: center; align-items: center; transition: opacity 0.5s; }
        .lock-container { text-align: center; animation: fadeIn 0.5s ease-out; }
        .lock-input { margin-top: 20px; padding: 10px 15px; font-size: 1.2rem; letter-spacing: 5px; text-align: center; border: 1px solid var(--gold); border-radius: 30px; outline: none; width: 200px; background: white; color: var(--chocolate); }
        .lock-btn { margin-top: 15px; background: var(--chocolate); color: white; border: none; padding: 10px 30px; border-radius: 30px; cursor: pointer; font-weight: 600; transition: 0.2s; }
        .lock-btn:hover { background: var(--chocolate-light); }

        /* --- Modals --- */
        #modal-overlay, #delete-modal-overlay, #file-preview-modal, #share-modal { position: fixed; top:0; left:0; width:100%; height:100%; background: rgba(62, 39, 35, 0.4); backdrop-filter: blur(4px); display: none; justify-content: center; align-items: center; z-index: 99999; opacity: 0; transition: opacity 0.3s; }
        #modal-overlay.open, #delete-modal-overlay.open, #file-preview-modal.open, #share-modal.open { opacity: 1; }
        .modal { background: white; padding: 35px; border-radius: 24px; width: 90%; max-width: 480px; max-height: 90vh; overflow-y: auto; transform: scale(0.95); transition: transform 0.3s; }
        .modal.large { max-width: 800px; }
        #modal-overlay.open .modal, #delete-modal-overlay.open .modal, #file-preview-modal.open .modal, #share-modal.open .modal { transform: scale(1); }
        
        .form-group { margin-bottom: 20px; }
        .form-group label { display: block; font-size: 0.8rem; margin-bottom: 8px; color: var(--chocolate); font-weight: 700; text-transform: uppercase; letter-spacing: 0.5px; }
        .form-control { width: 100%; padding: 14px; border: 1px solid #eee; border-radius: 12px; font-size: 0.95rem; background: #fafafa; outline: none; }
        .form-control:focus { border-color: var(--gold); background: #fff; box-shadow: 0 0 0 3px rgba(197, 160, 89, 0.1); }
        textarea.form-control { min-height: 60px; resize: none; overflow-y: hidden; transition: border-color 0.3s, box-shadow 0.3s; }

        /* --- Menus --- */
        .create-menu-container { position: relative; overflow: visible !important; }
        .create-menu-container:has(.create-menu-dropdown.show) { z-index: 2147483647 !important; }
        .create-menu-dropdown { position: absolute; top: 110%; right: 0; background: white; border: 1px solid #f0f0f0; border-radius: 16px; box-shadow: 0 10px 40px rgba(0,0,0,0.3) !important; width: 240px; display: none; z-index: 2147483647 !important; overflow: hidden; animation: fadeIn 0.1s ease; }
        .create-menu-dropdown.show { display: block; }
        .create-menu-item { padding: 12px 20px; cursor: pointer; display: flex; align-items: center; gap: 12px; font-size: 0.9rem; color: #555; transition: 0.2s; }
        .create-menu-item:hover { background: #fdfaf5; color: var(--chocolate); padding-left: 25px; }

        /* --- Toasts --- */
        #toast-container { position: fixed; top: 20px; right: 20px; z-index: 99999; display: flex; flex-direction: column; gap: 10px; }
        .toast { background: white; padding: 15px 25px; border-radius: 50px; box-shadow: 0 10px 30px rgba(0,0,0,0.15); display: flex; align-items: center; gap: 10px; font-size: 0.9rem; font-weight: 600; border-left: 4px solid #333; animation: slideInRight 0.3s; }
        .toast.success { border-color: var(--success); color: var(--success); }
        .toast.error { border-color: var(--danger); color: var(--danger); }

        /* --- Module Specifics --- */
        .summary-card { background: linear-gradient(135deg, var(--chocolate), #2D1B18); color: white; padding: 25px; border-radius: 16px; margin-bottom: 25px; display: flex; justify-content: space-around; text-align: center; }
        .summary-item b { display: block; font-size: 1.4rem; color: var(--gold); margin-top: 5px; }
        .finance-list { background: #fff; border-radius: 16px; overflow: visible !important; border: 1px solid #f9f9f9; }
        .finance-item { display: grid; grid-template-columns: 50px 1fr auto 40px; padding: 20px; border-bottom: 1px solid #f0f0f0; align-items: center; position: relative; overflow: visible !important; }
        .finance-item.paid { background-color: #fafafa; }
        .finance-item.paid .item-text, .finance-item.paid .amount { opacity: 0.4; text-decoration: line-through; }
        .piggy-card { background: white; border-radius: 20px; padding: 25px; box-shadow: var(--shadow); position: relative; overflow: visible !important; }
        .progress-grid { display: grid; grid-template-columns: repeat(20, 1fr); gap: 3px; margin: 15px 0; }
        .progress-block { height: 8px; background: #f0f0f0; border-radius: 2px; }
        .progress-block.filled { background: var(--gold); }
        
        .weight-progress-bar { width: 100%; height: 8px; background: #eee; border-radius: 4px; overflow: hidden; margin-top: 8px; }
        .weight-progress-fill { height: 100%; background: var(--gold); width: 0%; transition: width 0.5s ease; }
        .weight-detail-table { width: 100%; border-collapse: collapse; font-size: 0.9rem; margin: 15px 0; }
        .weight-detail-table td { padding: 8px 0; border-bottom: 1px solid #f5f5f5; color: #555; }
        .weight-detail-table td:last-child { text-align: right; font-weight: 600; color: var(--chocolate); }
        .history-list { max-height: 200px; overflow-y: auto; margin-top: 15px; border-top: 1px solid #eee; }
        .history-item { display: flex; justify-content: space-between; padding: 10px; border-bottom: 1px solid #f9f9f9; font-size: 0.9rem; }
        
        /* Updated Minimalist Calendar Styles */
        .cal-grid { display: grid; grid-template-columns: repeat(7, 1fr); gap: 4px; margin-top: 10px; }
        .cal-header { display: grid; grid-template-columns: repeat(7, 1fr); gap: 4px; text-align: center; font-size: 0.65rem; font-weight: 700; color: var(--chocolate); margin-bottom: 5px; opacity: 0.8; }
        .cal-day { aspect-ratio: 1/1; display: flex; flex-direction: column; align-items: center; justify-content: center; border-radius: 50%; font-size: 0.85rem; color: #555; cursor: pointer; position: relative; border: 1px solid transparent; transition: 0.2s; margin: 2px; box-sizing: border-box; }
        .cal-day:hover { background: #fDFBF7; border-color: rgba(197, 160, 89, 0.3); }
        .cal-day.today { font-weight: 800; border: 2px solid var(--chocolate); }
        
        .cal-day.period { background-color: rgba(198, 40, 40, 0.1); border: 1px solid rgba(198, 40, 40, 0.3); color: var(--danger); font-weight: bold; }
        .cal-day.fertile { background-color: rgba(85, 139, 47, 0.1); border: 1px solid rgba(85, 139, 47, 0.3); color: var(--success); font-weight: bold; }
        .cal-day.contra-active { border: 2px dashed var(--gold); }
        
        .cal-legend { display: flex; gap: 15px; justify-content: center; margin-top: 15px; font-size: 0.75rem; color: #666; flex-wrap: wrap; }
        .leg-item { display: flex; align-items: center; gap: 5px; }
        .leg-color { width: 12px; height: 12px; border-radius: 50%; }

        .flow-opt { transition: 0.2s; }
        .flow-opt:hover { background: #fafafa; }
        .flow-opt.active { background: rgba(198, 40, 40, 0.1); border-color: var(--danger); color: var(--danger); font-weight: bold; }

        .cal-top-zone { position: absolute; top: 4px; width: 100%; display: flex; justify-content: center; align-items: center; gap: 2px; height: 6px; }
        .cal-heart { width: 8px; height: 8px; }
        .cal-heart.safe { color: var(--gold); fill: var(--gold); }
        .cal-heart.unsafe { color: var(--heart-unsafe); fill: var(--heart-unsafe); }
        
        .verse-card { background: transparent; border: 1px solid rgba(197, 160, 89, 0.2); padding: 12px 15px; margin-bottom: 20px; border-radius: 12px; font-size: 0.85rem; color: #666; display: flex; flex-direction: column; gap: 4px; }
        .verse-text { font-family: 'Georgia', serif; font-style: italic; color: var(--chocolate); line-height: 1.4; }
        .verse-ref { font-weight: 700; font-size: 0.7rem; color: var(--gold); text-transform: uppercase; text-align: right; }
        
        #file-preview-content iframe { width: 100%; height: 500px; border: none; background: #eee; }
        #file-preview-content img { max-width: 100%; height: auto; display: block; margin: 0 auto; }
        
        .time-navigator { display: flex; align-items: center; justify-content: center; gap: 15px; margin-bottom: 20px; }
        .nav-btn { background: white; border: 1px solid #eee; width: 32px; height: 32px; border-radius: 50%; display: flex; align-items: center; justify-content: center; cursor: pointer; color: var(--chocolate); }
        .nav-btn:hover { background: var(--gold); color: white; border-color: var(--gold); }
        .current-date-label { font-family: 'Playfair Display', serif; font-size: 1.2rem; color: var(--chocolate); min-width: 180px; text-align: center; }

        .icon-grid-selector { display: grid; grid-template-columns: repeat(5, 1fr); gap: 8px; margin-top: 10px; }
        .icon-option { width: 40px; height: 40px; display: flex; align-items: center; justify-content: center; border: 1px solid #eee; border-radius: 8px; cursor: pointer; transition: 0.2s; color: var(--gold); }
        .icon-option:hover, .icon-option.selected { background: var(--off-white); border-color: var(--gold); transform: scale(1.1); }

        .file-card-image-container { width: 100%; aspect-ratio: 4/5; overflow: hidden; border-radius: 12px 12px 0 0; background: #eee; position: relative; }
        .file-card-image { width: 100%; height: 100%; object-fit: cover; transition: transform 0.3s; }
        .file-card-image:hover { transform: scale(1.05); }

        /* Visionboard Specifics Updated */
        .vision-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 15px; margin-top: 15px; }
        .vision-item { display: flex; flex-direction: column; gap: 8px; transition: transform 0.3s; cursor: pointer; position: relative; }
        .vision-item:hover { transform: scale(1.02); }
        .vision-img { width: 100%; aspect-ratio: 3/4; object-fit: cover; border-radius: 16px; box-shadow: var(--shadow); }
        .vision-caption { font-size: 0.75rem; text-align: center; color: var(--chocolate); font-weight: 600; min-height: 1rem; }
        
        .vision-actions { display: flex; gap: 5px; position: absolute; top: 5px; right: 5px; background: rgba(255,255,255,0.9); padding: 5px; border-radius: 8px; opacity: 0; transition: 0.3s; box-shadow: 0 2px 5px rgba(0,0,0,0.1); }
        .vision-item:hover .vision-actions { opacity: 1; }
        .vision-actions i { cursor: pointer; width: 16px; color: var(--chocolate); transition: 0.2s; }
        .vision-actions i:hover { color: var(--gold); }

        @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
        @keyframes slideInRight { from { opacity: 0; transform: translateX(50px); } to { opacity: 1; transform: translateX(0); } }

        #batch-actions-bar { position: fixed; bottom: 30px; left: 50%; transform: translate(-50%, 150px); background: var(--chocolate); color: white; padding: 15px 30px; border-radius: 40px; display: flex; align-items: center; gap: 20px; z-index: 5000; box-shadow: 0 10px 30px rgba(0,0,0,0.3); transition: transform 0.3s; }
    </style>
</head>
<body>

<div id="lock-screen">
    <div class="monogram" style="font-size: 3rem; margin-bottom: 20px;">CM</div>
    <div style="font-family: 'Playfair Display', serif; color: var(--chocolate); margin-bottom: 10px;">Caroline Medeiros</div>
    <input type="password" id="lock-pass" class="lock-input" placeholder="Senha" maxlength="4" autocomplete="off" />
    <button class="lock-btn" onclick="checkAccess()">Entrar</button>
    <div id="lock-msg" style="color: var(--danger); margin-top: 10px; height: 20px; font-size: 0.8rem;"></div>
</div>

<div id="loading-screen" style="position:fixed; top:0; left:0; width:100%; height:100%; background:var(--off-white); z-index:9999; display:none; flex-direction:column; justify-content:center; align-items:center;">
    <div class="monogram" style="font-size: 2rem;">CM</div>
    <div class="brand-name" style="margin-top:10px; opacity:0.6">A Iniciar Sistema...</div>
</div>

<div id="toast-container"></div>

<header>
    <div class="monogram">CM</div>
    <div class="brand-name">Caroline Medeiros</div>
    <div class="date-time-display" id="clock-display">...</div>
</header>

<div class="navigation-bar" id="breadcrumb-container"></div>

<main id="main-content"></main>

<div id="modal-overlay">
    <div class="modal">
        <h3 id="modal-title" style="text-align:center; margin-bottom: 25px; color: var(--chocolate); font-family: 'Playfair Display', serif;">Adicionar</h3>
        <div id="modal-form"></div>
        <div id="modal-actions" style="margin-top: 30px; display: flex; gap: 12px; justify-content: flex-end;"></div>
    </div>
</div>

<div id="file-preview-modal">
    <div class="modal large">
        <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:20px">
            <h3 style="color:var(--chocolate); font-family: 'Playfair Display', serif;" id="preview-filename">Ficheiro</h3>
            <div style="display:flex; gap:10px">
                <a id="preview-download-btn" class="btn-add" style="padding:6px 12px; font-size:0.8rem; text-decoration:none"><i data-lucide="download" style="width:16px"></i> Download</a>
                <button onclick="window.closePreviewModal()" style="background:none; border:none; cursor:pointer"><i data-lucide="x"></i></button>
            </div>
        </div>
        <div id="file-preview-content" style="max-height:60vh; overflow-y:auto; text-align:center; display:flex; justify-content:center;"></div>
        <div id="preview-caption" style="margin-top:15px; font-style:italic; color:#666; text-align:center;"></div>
    </div>
</div>

<div id="share-modal">
    <div class="modal">
        <h3 style="text-align:center; color:var(--chocolate); font-family:'Playfair Display',serif; margin-bottom:20px">Partilhar Item</h3>
        <div style="background:#f9f9f9; padding:15px; border-radius:12px; border:1px solid #eee; margin-bottom:20px; font-size:0.9rem; word-break:break-all; color:#666" id="share-link-display"></div>
        <div style="display:grid; grid-template-columns:1fr 1fr; gap:10px">
            <button class="btn-add" style="justify-content:center" onclick="window.copyShareLink()"><i data-lucide="copy"></i> Copiar Link</button>
            <button class="btn-add" style="justify-content:center; background:var(--gold)" onclick="window.shareDirectly()"><i data-lucide="share-2"></i> Enviar</button>
        </div>
        <button class="btn-cancel" style="width:100%; margin-top:15px" onclick="document.getElementById('share-modal').classList.remove('open'); setTimeout(()=>document.getElementById('share-modal').style.display='none',300)">Fechar</button>
    </div>
</div>

<div id="delete-modal-overlay">
    <div class="modal" style="text-align: center;">
        <div style="display:flex; justify-content:center; margin-bottom:15px">
            <div style="width:60px; height:60px; background:rgba(198, 40, 40, 0.1); border-radius:50%; display:flex; align-items:center; justify-content:center; color:var(--danger)">
                <i data-lucide="alert-triangle" style="width:30px; height:30px"></i>
            </div>
        </div>
        <h3 style="color: var(--danger); margin-bottom: 10px;">Exclusão</h3>
        <p id="delete-modal-text" style="margin-bottom: 25px; color: #666; line-height: 1.5;">Tem a certeza que deseja apagar este item?</p>
        <div style="display: flex; gap: 10px; justify-content: center;">
            <button class="btn-cancel" onclick="window.closeDeleteModal()">Cancelar</button>
            <button class="btn-add" style="background:var(--danger)" id="confirm-delete-btn" onclick="window.confirmDelete()">Confirmar</button>
        </div>
    </div>
</div>

<div id="batch-actions-bar">
    <span id="selected-count" style="font-weight:600">0 selecionados</span>
    <button onclick="window.promptChangeIconBatch()" style="background:rgba(255,255,255,0.2); border:none; color:white; padding:8px 16px; border-radius:20px; cursor:pointer; font-size:0.85rem">Ícone</button>
    <button onclick="window.confirmBatchDelete()" style="background:rgba(255,255,255,0.2); border:none; color:white; padding:8px 16px; border-radius:20px; cursor:pointer; font-size:0.85rem">Excluir</button>
    <button onclick="window.toggleSelectionMode()" style="background:white; border:none; color:var(--chocolate); padding:8px 16px; border-radius:20px; cursor:pointer; font-size:0.85rem; font-weight:bold">Cancelar</button>
</div>

<div style="position:fixed; bottom:10px; right:10px; opacity:0.3; font-size:0.7rem; pointer-events:none" id="sys-status">OFFLINE FIRST (GitHub)</div>

<script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-app.js";
    import { getAuth, signInAnonymously, onAuthStateChanged, signInWithCustomToken } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-auth.js";
    import { getFirestore, collection, doc, setDoc, addDoc, updateDoc, deleteDoc, onSnapshot, getDocs } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-firestore.js";

    // --- Access Control (Simulated Hash as requested) ---
    const _0x5a1b = (s) => s.split('').reduce((a,b)=>{a=((a<<5)-a)+b.charCodeAt(0);return a&a},0);
    const _0x1c8a = 1541063; // Password is "1234"

    window.checkAccess = () => {
        const inp = document.getElementById('lock-pass');
        const msg = document.getElementById('lock-msg');
        if (_0x5a1b(inp.value) === _0x1c8a) {
            document.getElementById('lock-screen').style.opacity = '0';
            setTimeout(() => {
                document.getElementById('lock-screen').style.display = 'none';
                localStorage.setItem('cm_access', 'granted');
                if (typeof state !== 'undefined' && state.items.length === 0) initApp();
            }, 500);
        } else {
            msg.innerText = "Palavra-passe incorreta";
            inp.value = '';
            setTimeout(() => msg.innerText = '', 2000);
        }
    };
    
    // Check session on load
    if (localStorage.getItem('cm_access') === 'granted') {
        document.getElementById('lock-screen').style.display = 'none';
    }

    // Enter key support
    document.getElementById('lock-pass').addEventListener('keypress', function (e) {
        if (e.key === 'Enter') window.checkAccess();

    // --- State & Config ---
    let app, auth, db, appId;

    // --- Auto-Resize Global para Caixas de Texto ---

    // --- Helper Functions attached to Window for HTML access ---

    window.toggleMenstrualFields = () => {
        const type = document.getElementById('f-prof-hormonal').value;

    // --- Setup ---
    try {
        if(typeof __firebase_config !== 'undefined' && __firebase_config) {
            const firebaseConfig = JSON.parse(__firebase_config);

    // --- Toast System ---
    window.showToast = (msg, type = 'success') => {

    // --- Data Handlers ---
    const _addDoc = async (coll, data) => {
        if(isOffline) {
            const newItem = { id: 'loc_' + Date.now() + Math.random().toString(36).substr(2,9), ...data };
            state.items.push(newItem);
            saveLocal(); render(); return;
        }
        await addDoc(coll, data);
    };

    const _updateDoc = async (ref, data) => {
        if(isOffline) {
            const idx = state.items.findIndex(i => i.id === ref.id);
            if(idx > -1) {
                const merge = (target, source) => {
                    for (const key in source) {
                        if (source[key] instanceof Object && key in target) {
                            Object.assign(source[key], merge(target[key], source[key]));
                        }
                    }
                    Object.assign(target || {}, source);
                    return target;
                };
                Object.keys(data).forEach(key => {
                    if (key.includes('.')) {
                        const [root, child] = key.split('.');
                        if (!state.items[idx][root]) state.items[idx][root] = {};
                        state.items[idx][root][child] = data[key];
                    } else {
                        state.items[idx][key] = data[key];
                    }
                });
                saveLocal(); render();
            }
            return;
        }
        await updateDoc(ref, data);
    };

    const _deleteDoc = async (ref) => {
        if(isOffline) {
            state.items = state.items.filter(i => i.id !== ref.id);
            saveLocal(); render(); return;
        }
        await deleteDoc(ref);
    };

    const saveLocal = () => localStorage.setItem('cm_premium_data', JSON.stringify(state.items));

    // --- Initialization ---
    const initApp = async () => {
        setTimeout(() => {
            const loader = document.getElementById('loading-screen');
            if(loader && loader.style.display !== 'none') {
                console.warn("Loading timeout - forcing offline");
                loader.style.display = 'none';
                isOffline = true;
                ensureBaseFolders();
                render();
            }
        }, 5000);

        setInterval(() => {
            const now = new Date();
            const el = document.getElementById('clock-display');
            if(el) el.innerText = now.toLocaleDateString('pt-BR', { weekday: 'long', day: 'numeric', month: 'long', hour: '2-digit', minute: '2-digit' });
        }, 1000);

        if(isOffline) {
            state.user = { uid: 'offline_user', isAnonymous: true };
            const stored = localStorage.getItem('cm_premium_data');
            if(stored) state.items = JSON.parse(stored);
            ensureBaseFolders();
            document.getElementById('loading-screen').style.display = 'none';
            render();
        } else {
            onAuthStateChanged(auth, (user) => {
                state.user = user;
                if (user) {
                    document.getElementById('user-badge').innerText = user.uid.substring(0,8);
                    setupDataListener();
                }
            });
            if (typeof __initial_auth_token !== 'undefined' && __initial_auth_token) {
                await signInWithCustomToken(auth, __initial_auth_token);
            } else {
                await signInAnonymously(auth);
            }
        }
    };

    const setupDataListener = () => {
        const itemsCol = collection(db, 'artifacts', appId, 'users', state.user.uid, 'items');
        onSnapshot(itemsCol, (snap) => {
            state.items = snap.docs.map(d => ({ id: d.id, ...d.data() }));
            document.getElementById('loading-screen').style.display = 'none';
            ensureBaseFolders();
            render();
        }, (err) => {
            console.error(err);
            window.showToast("Erro de conexão. Mudando para Offline.", "error");
            isOffline = true;
            document.getElementById('loading-screen').style.display = 'none';
            initApp();
        });

        const folders = [
            { id: 'f_pendencias', name: 'Pendências', parentId: 'financeiro', type: 'folder' },
            { id: 'f_despesas', name: 'Despesas', parentId: 'financeiro', type: 'folder' },
            { id: 'f_entradas', name: 'Entradas', parentId: 'financeiro', type: 'folder' },
            { id: 'f_investimentos', name: 'Investimentos', parentId: 'financeiro', type: 'folder' },
            { id: 'saude', name: 'Saúde', type: 'root_area' },
            { id: 'financeiro', name: 'Financeiro', type: 'root_area' }
        ];
        if (isOffline) {
            folders.forEach(f => {
                if(!state.items.find(i => i.id === f.id)) state.items.push(f);
            });
        } else {
            try {
                for (const f of folders) {
                    if (!state.items.find(i => i.id === f.id)) {
                        await setDoc(doc(db, 'artifacts', appId, 'users', state.user.uid, 'items', f.id), {

    // --- Navigation & Routing ---

        { id: 'financeiro', name: 'Financeiro', icon: 'trending-up' },
        { id: 'lifestyle', name: 'Lifestyle', icon: 'sparkles' },

    window.navigate = async (id) => { 
        if(state.selectionMode) return;
        state.path.push(id); 
        localStorage.setItem('cm_path', JSON.stringify(state.path));
        render(); 
    };
    
    window.goBack = (idx) => { 
        if(state.selectionMode) window.toggleSelectionMode();
        if(idx === undefined) state.path.pop();

    // --- Render Logic ---
    window.render = () => {
        const main = document.getElementById('main-content');
        const bread = document.getElementById('breadcrumb-container');

        bread.innerHTML = state.path.map((id, i) => {

        }).join('<i data-lucide="chevron-right" style="width:14px; opacity:0.3"></i>');

        main.innerHTML = '';
        
        const folder = state.items.find(i => i.id === currentId) || ROOT_AREAS.find(a => a.id === currentId);
        
        if (currentId === 'root') renderDashboard(main);
        else if (currentId === 'financeiro') renderFinanceRoot(main);

        else if (folder?.name === 'Despesas') renderFinance(main, currentId, 'expense', 'Despesas');
        else if (folder?.name === 'Pendências') renderFinance(main, currentId, 'pendency', 'Pendências');
        else if (folder?.name === 'Entradas') renderFinance(main, currentId, 'income', 'Entradas');
        else {
            const item = state.items.find(i => i.id === currentId);
            if(item && item.type !== 'folder' && item.type !== 'custom_area') renderToolItem(main, item);
            else renderGeneralFolder(main, currentId);

        document.querySelectorAll('input, textarea, select').forEach(el => {

    // --- Bible Module ---

    window.fetchBibleText = async () => {
        state.bible.loading = true;
        render();
        try {
            if (!state.bible.fullData) {
                const res = await fetch('https://raw.githubusercontent.com/thiagobodruk/bible/master/json/pt_aa.json');
                if(!res.ok) throw new Error("Erro ao baixar base de dados.");
                state.bible.fullData = await res.json();
                window.showToast("Bíblia carregada com sucesso!");
            }

            const bookData = state.bible.fullData.find(b => b.name === state.bible.book || b.name.includes(state.bible.book));
            
            if (bookData) {
                const chapterIndex = parseInt(state.bible.chapter) - 1;
                if (chapterIndex >= 0 && chapterIndex < bookData.chapters.length) {
                    const verses = bookData.chapters[chapterIndex];
                    let html = `<h3 style="text-align:center; margin-bottom:20px; color:var(--chocolate)">${bookData.name} ${state.bible.chapter}</h3>`;

                state.bible.text = `<div style="text-align:center; padding:20px; color:var(--danger)">Livro não encontrado na base de dados.</div>`;

        } catch(e) {
            console.error(e);
            state.bible.text = `<div style="color:var(--danger); text-align:center; padding:20px">Erro ao carregar a Bíblia.<br><small>Detalhe: ${e.message}</small></div>`;
        }
        state.bible.loading = false;
        render();
    };

    // --- Health Module ---
    const calculateHealthStats = (weightItem) => {
        if(!weightItem) return null;
        const { current, target, startDate, periodMonths, history, startWeight } = weightItem.content;
        const monthsPassed = Math.max(0, (new Date().getFullYear() - new Date(startDate).getFullYear()) * 12 + (new Date().getMonth() - new Date(startDate).getMonth()));
        const monthsRemaining = Math.max(1, periodMonths - monthsPassed);
        
        const currentWeight = parseFloat(current);
        const weightToLose = currentWeight - parseFloat(target);
        const mma = (monthsRemaining > 0 && weightToLose > 0) ? (weightToLose / monthsRemaining).toFixed(2) : 0;
        
        let height = parseFloat(weightItem.content.height) || 0;
        // Correção inteligente: se a pessoa digitar 170 ou 175 em vez de 1.70, converte automaticamente
        if (height > 3) height = height / 100; 

        let imc = '--';
        let imcColor = '#999';
        let imcText = '';
        
        if (height > 0) {
            const imcVal = (currentWeight / (height * height));
            imc = imcVal.toFixed(1);
            if (imcVal < 18.5) { imcColor = 'var(--gold)'; imcText = 'Abaixo do Peso'; }
            else if (imcVal < 24.9) { imcColor = 'var(--success)'; imcText = 'Peso Normal'; }
            else if (imcVal < 29.9) { imcColor = 'var(--chocolate-light)'; imcText = 'Sobrepeso'; }
            else { imcColor = 'var(--danger)'; imcText = 'Obesidade'; }
        }

        // Meta de Água Diária: 35ml por cada kg do corpo
        const waterMl = currentWeight * 35;
        const waterLiters = (waterMl / 1000).toFixed(1);

        const sortedHistory = [...(history || [])].sort((a,b) => new Date(b.date) - new Date(a.date));
        
        const totalLossRequired = parseFloat(startWeight) - parseFloat(target);
        const progress = totalLossRequired > 0 ? ((parseFloat(startWeight) - currentWeight) / totalLossRequired * 100) : 0;
        
        return { current: currentWeight, target, startWeight, mma, imc, imcColor, imcText, waterLiters, progress: Math.min(100, Math.max(0, progress)), monthsRemaining, weightToLose, history: sortedHistory };
    };

    const renderHealth = (el) => {
        const weightItem = state.items.find(i => i.type === 'health_weight');
        const stats = calculateHealthStats(weightItem);
        const meds = state.items.filter(i => i.type === 'health_med');
        const diet = state.items.find(i => i.type === 'health_food');

        const genericItems = state.items.filter(i => i.parentId === 'saude' && !['menstrual_profile', 'menstrual_cycle', 'health_weight', 'health_med', 'health_food'].includes(i.type));

        const dietContent = diet && (diet.content.breakfast || diet.content.lunch || diet.content.dinner) ? `

                    </div>

            </div>
            </div>

            <div class="card" style="display:block; margin:20px 0">
                <div style="display:flex; justify-content:space-between; align-items:center">
                    <div style="display:flex; align-items:center; gap:10px">
                        <div style="width:40px; height:40px; background:var(--off-white); border: 1px solid rgba(197, 160, 89, 0.2); border-radius:50%; display:flex; align-items:center; justify-content:center; color:var(--chocolate)"><i data-lucide="scale"></i></div>
                        <div>
                            <div style="font-weight:700; color:var(--chocolate)">Controle de Peso</div>
                            <div style="font-size:0.8rem; color:var(--chocolate-light)">${stats ? `Inicial: ${stats.startWeight}kg | Meta Final: ${stats.target}kg` : 'Configure sua meta'}</div>
                        </div>
                    </div>
                    ${stats ? `
                    <div style="display:flex; gap:5px;">
                        <button class="btn-add" style="padding:5px 15px; font-size:0.7rem" onclick="window.openModal('health_weight_register')">Pesar</button>
                        <button class="btn-cancel" style="padding:5px 8px; font-size:0.7rem" onclick="window.openModal('health_weight_config', '${weightItem.id}')"><i data-lucide="settings" style="width:14px"></i></button>
                    </div>
                    ` : `<button class="btn-add" onclick="window.openModal('health_weight_config')">Configurar</button>`}
                </div>
                ${stats ? `
                    <div style="margin-top:20px; display:grid; grid-template-columns:1fr 1fr; gap:15px;">
                        <div style="background:var(--bg-card); border:1px solid #eee; border-radius:12px; padding:15px; text-align:center; position:relative;">

                        <div style="background:var(--bg-card); border:1px solid #eee; border-radius:12px; padding:15px; text-align:center; position:relative;">
                            <div style="font-size:0.75rem; text-transform:uppercase; color:var(--chocolate-light); font-weight:700; margin-bottom:5px">IMC</div>

                    <div style="background:var(--off-white); border:1px solid rgba(197, 160, 89, 0.3); border-radius:12px; padding:12px 15px; margin-top:15px; display:flex; justify-content:space-between; align-items:center;">
                        <div style="display:flex; align-items:center; gap:10px;">
                            <div style="width:36px; height:36px; background:var(--bg-card); border-radius:50%; display:flex; justify-content:center; align-items:center; color:var(--gold); border: 1px solid rgba(197, 160, 89, 0.2);"><i data-lucide="droplet" style="width:18px"></i></div>
                            <div>
                                <div style="font-weight:700; color:var(--chocolate); font-size:0.9rem">Meta Diária de Água</div>

                            <span>Progresso do Peso</span>
                            <span style="color:var(--gold)">${stats.progress.toFixed(0)}%</span>
                        </div>

                    </div>

            </div>

            <div class="grid-container">
                <div class="card" style="display:block">
                    <div style="display:flex; justify-content:space-between; margin-bottom:15px"><b>Medicamentos</b><button class="btn-add" style="padding:4px 8px" onclick="window.openModal('health_med')">+</button></div>
                    ${meds.length ? meds.map(m => `<div style="padding:10px; border-bottom:1px solid #eee; display:flex; justify-content:space-between; align-items:center"><div><b>${m.name}</b><br><small>${m.content.time} - ${m.content.instructions}</small></div><i data-lucide="trash-2" style="width:14px; cursor:pointer; color:var(--chocolate-light)" onclick="window.openDeleteModal('${m.id}','${m.name}')"></i></div>`).join('') : '<div style="opacity:0.5; font-size:0.8rem">Nenhum medicamento.</div>'}
                </div>
                <div class="card" style="display:block">
                    <div style="display:flex; justify-content:space-between; margin-bottom:15px"><b>Dieta e Jejum</b><button class="btn-add" style="padding:4px 8px" onclick="window.openModal('health_food')"><i data-lucide="edit-2" style="width:14px"></i></button></div>
                    ${dietContent}
                </div>
            </div>

            <div class="grid-container" style="margin-top:20px">
                ${genericItems.map(i => {
                    const isSelected = state.selectedIds.includes(i.id);
                    const icon = i.icon || ({folder:'folder', note:'file-text', checklist:'list-checks', checklist_sum:'calculator', bank:'credit-card', social:'at-sign', file:'paperclip', visionboard:'image'}[i.type] || 'file');
                    if (i.type === 'file') {
                        const isImg = i.content.fileType.startsWith('image') || /\.(jpg|jpeg|png|gif|bmp|webp|heic)$/i.test(i.name);
                        return `<div class="card ${state.selectionMode?'selection-mode':''} ${isSelected?'selected':''}" style="display:block; padding:0; overflow:visible; position:relative;" onclick="${state.selectionMode ? `window.toggleSelectItem('${i.id}')` : `window.openFilePreview('${i.id}')`}">
                            ${isImg ? `<div class="file-card-image-container"><img src="${i.content.data}" class="file-card-image" onerror="this.style.display='none'"></div>` : `<div style="padding:30px; text-align:center"><i data-lucide="${icon}" style="color:var(--chocolate-light); width:40px; height:40px"></i></div>`}
                            <div style="padding:15px">
                                ${i.content.caption ? `<div style="font-weight:600; color:var(--chocolate); font-size:0.9rem; margin-bottom:4px">${i.content.caption}</div>` : ''}
                                <div style="font-size:0.75rem; color:var(--chocolate-light); white-space:nowrap; text-overflow:ellipsis; overflow:hidden">${i.type === 'file' ? '' : i.name}</div>

                    return `<div class="card ${state.selectionMode?'selection-mode':''} ${isSelected?'selected':''}" onclick="${state.selectionMode ? `window.toggleSelectItem('${i.id}')` : `window.navigate('${i.id}')`}"><i data-lucide="${icon}" style="color:${i.type==='folder'?'var(--gold)':'var(--chocolate-light)'}"></i><span style="flex:1; font-weight:600; color:var(--chocolate)">${i.name}</span><i data-lucide="check-circle" class="selection-check"></i>${renderActionMenu(i.id, i.type, i.name)}</div>`;
                }).join('')}
            </div>
        `;
    };

    const renderCalendar = () => {
        const today = new Date();
        const viewDate = state.menstrualView || today;
        const year = viewDate.getFullYear();
        const month = viewDate.getMonth();
        const daysInMonth = new Date(year, month + 1, 0).getDate();
        const firstDay = new Date(year, month, 1).getDay();

        const profile = state.items.find(i => i.type === 'menstrual_profile');
        const logs = state.items.filter(i => i.type === 'menstrual_cycle');
        
        const flowDuration = profile && profile.content.flowDuration ? parseInt(profile.content.flowDuration) : 5;
        const cycleDuration = profile && profile.content.cycleDuration ? parseInt(profile.content.cycleDuration) : 28;
        const contraType = profile && profile.content.contraceptiveType ? profile.content.contraceptiveType : 'Nenhum';
        const isHormonal = contraType !== 'Nenhum';

        const periodDays = new Set();
        const fertileDays = new Set();
        const contraDays = new Set();
        
        logs.forEach(l => {
            if (l.content.flow) { 
                const [y, m, d] = l.content.date.split('-').map(Number);
                const startDate = new Date(y, m - 1, d);
                for(let i=0; i<flowDuration; i++) {
                    const d = new Date(startDate); 
                    d.setDate(startDate.getDate() + i);
                    periodDays.add(window.toLocalDateStr(d));
                }
            }
        });

        let baseDate = null;
        const periodLogs = logs.filter(l => l.content.flow).sort((a,b) => new Date(b.content.date) - new Date(a.content.date));
        if (periodLogs.length > 0) {
            const [y, m, d] = periodLogs[0].content.date.split('-').map(Number);
            baseDate = new Date(y, m - 1, d);
        } else if (profile?.content?.lastPeriodDate) {
            const [y, m, d] = profile.content.lastPeriodDate.split('-').map(Number);
            baseDate = new Date(y, m - 1, d);
        }

        if (baseDate && !isHormonal) {
            for(let k=0; k<36; k++) {
                const cycleStart = new Date(baseDate);
                cycleStart.setDate(baseDate.getDate() + (cycleDuration * k));
                const nextPeriodStart = new Date(cycleStart);
                nextPeriodStart.setDate(cycleStart.getDate() + cycleDuration);
                const ovulation = new Date(nextPeriodStart);
                ovulation.setDate(nextPeriodStart.getDate() - 14);
                for(let f=-5; f<=0; f++) {
                    const d = new Date(ovulation); 
                    d.setDate(ovulation.getDate() + f);
                    fertileDays.add(toLocalDateStr(d));
                }
            }
        }

        if (profile?.content?.contraceptiveStartDate && isHormonal) {
            const [y, m, d] = profile.content.contraceptiveStartDate.split('-').map(Number);
            const contraStart = new Date(y, m - 1, d);
            for(let k=0; k<36; k++) {
                const cycleStart = new Date(contraStart);
                cycleStart.setDate(contraStart.getDate() + (28 * k));
                for(let j=0; j<21; j++) {
                    const activeDay = new Date(cycleStart);
                    activeDay.setDate(cycleStart.getDate() + j);
                    contraDays.add(toLocalDateStr(activeDay));
                }
            }
        }

        let html = `
            <div style="display:flex; justify-content:center; align-items:center; gap:15px; margin-bottom:10px">
                <button class="nav-btn" onclick="window.changeCalMonth(-1)" style="width:24px; height:24px"><i data-lucide="chevron-left" style="width:14px"></i></button>
                <span style="font-weight:700; color:var(--chocolate); font-size:0.85rem">${viewDate.toLocaleDateString('pt-BR',{month:'long', year:'numeric'})}</span>
                <button class="nav-btn" onclick="window.changeCalMonth(1)" style="width:24px; height:24px"><i data-lucide="chevron-right" style="width:14px"></i></button>
            </div>
            <div class="cal-header"><div>D</div><div>S</div><div>T</div><div>Q</div><div>Q</div><div>S</div><div>S</div></div>
            <div class="cal-grid">
        `;

        for(let i=0; i<firstDay; i++) html += `<div></div>`;

        for(let d=1; d<=daysInMonth; d++) {
            const dateStr = `${year}-${String(month+1).padStart(2,'0')}-${String(d).padStart(2,'0')}`;
            const isToday = d === today.getDate() && month === today.getMonth() && year === today.getFullYear();
            
            const isPeriod = periodDays.has(dateStr);
            const isFertile = fertileDays.has(dateStr);
            const isContra = contraDays.has(dateStr);
            
            const log = logs.find(l => l.content.date === dateStr);

            let classes = `cal-day ${isToday ? 'today' : ''}`;
            if (isPeriod) classes += ' period';
            else if (isFertile) classes += ' fertile';

            if (isContra) classes += ' contra-active';

            html += `
                <div class="${classes}" onclick="window.openModal('menstrual_log', '${dateStr}')">
                    <div class="cal-top-zone">
                        ${log && log.content.sex && !log.content.protection ? `<i data-lucide="heart" class="cal-heart unsafe" stroke="none" fill="currentColor"></i>` : ''}
                        ${log && log.content.sex && log.content.protection ? `<i data-lucide="heart" class="cal-heart safe" stroke="none" fill="currentColor"></i>` : ''}
                    </div>
                    ${d}
                </div>
            `;
        }
        html += `</div>
        <div class="cal-legend">
            <div class="leg-item"><div class="leg-color" style="background:rgba(198, 40, 40, 0.1); border:1px solid rgba(198, 40, 40, 0.3)"></div> Menstruação</div>
            ${!isHormonal ? `<div class="leg-item"><div class="leg-color" style="background:rgba(85, 139, 47, 0.1); border:1px solid rgba(85, 139, 47, 0.3)"></div> Período Fértil</div>` : ''}
            <div class="leg-item"><i data-lucide="heart" class="cal-heart unsafe" fill="currentColor"></i> Relação Desprotegida</div>
            <div class="leg-item"><i data-lucide="heart" class="cal-heart safe" fill="currentColor"></i> Relação Protegida</div>
        </div>
        `;
        
        if (isHormonal) {
            html += `<div style="margin-top:10px; padding:10px; background:#f9f9f9; border-radius:8px; font-size:0.75rem; color:var(--chocolate-light); text-align:center;">
                <i data-lucide="info" style="width:12px; vertical-align:text-bottom"></i> 
                Você utiliza método hormonal. A ovulação é inibida.
            </div>`;
        }

        return html;
    };

    // --- Action Functions ---
    window.renameItem = (id, name) => { window.openModal('rename', id); };
    window.replaceItem = (id, type) => { window.openModal(type, id); };
    window.moveItem = async (id) => {
        const newParent = prompt("Digite o ID da pasta de destino:");
        if(newParent) {
             const ref = isOffline ? {id} : doc(db, 'artifacts', appId, 'users', state.user.uid, 'items', id);
             await _updateDoc(ref, { parentId: newParent });
             window.showToast("Item movido.");
             render();
        }
    };
    
    window.openDeleteModal = (id, name) => {
        state.itemToDelete = id;
        document.getElementById('delete-modal-text').innerText = `Tem certeza que deseja apagar "${name}"?`;
        const m = document.getElementById('delete-modal-overlay');
        m.style.display = 'flex'; setTimeout(() => m.classList.add('open'), 10);
    };
    window.closeDeleteModal = () => {
        const m = document.getElementById('delete-modal-overlay');
        m.classList.remove('open'); setTimeout(() => m.style.display = 'none', 300);
        state.itemToDelete = null;
    };
    window.confirmDelete = async () => {
        if(state.itemToDelete) {
            await _deleteDoc(isOffline ? {id: state.itemToDelete} : doc(db, 'artifacts', appId, 'users', state.user.uid, 'items', state.itemToDelete));
            window.closeDeleteModal();
            window.showToast("Item excluído.");
        }
    };

    window.toggleSelectionMode = () => {
        state.selectionMode = !state.selectionMode;
        state.selectedIds = [];
        const bar = document.getElementById('batch-actions-bar');
        bar.style.transform = state.selectionMode ? "translate(-50%, 0)" : "translate(-50%, 150px)";
        render();
    };
    window.toggleSelectItem = (id) => {
        if(state.selectedIds.includes(id)) state.selectedIds = state.selectedIds.filter(i => i !== id);
        else state.selectedIds.push(id);
        document.getElementById('selected-count').innerText = `${state.selectedIds.length} selecionados`;
        render();
    };
    window.confirmBatchDelete = async () => {
        if(confirm(`Excluir ${state.selectedIds.length} itens?`)) {
            for(const id of state.selectedIds) {
                await _deleteDoc(isOffline ? {id} : doc(db, 'artifacts', appId, 'users', state.user.uid, 'items', id));
            }
            window.toggleSelectionMode();
            window.showToast("Itens excluídos.");
        }
    };
    window.promptChangeIconBatch = async () => {
        if (!state.selectedIds.length) return;
        window.openModal('icon_selector');
    };

    window.addCLItem = async (id) => {
        const item = state.items.find(i => i.id === id);
        const newItems = [...(item.content.items || []), { text: '', checked: false, val: 0 }];
        await _updateDoc(isOffline ? {id} : doc(db, 'artifacts', appId, 'users', state.user.uid, 'items', id), { 'content.items': newItems });
    };
    window.toggleCLItem = async (id, idx) => {
        const item = state.items.find(i => i.id === id);
        const newItems = [...item.content.items];
        newItems[idx].checked = !newItems[idx].checked;
        await _updateDoc(isOffline ? {id} : doc(db, 'artifacts', appId, 'users', state.user.uid, 'items', id), { 'content.items': newItems });
    };
    window.deleteCLItem = async (id, idx) => {
        const item = state.items.find(i => i.id === id);
        const newItems = item.content.items.filter((_, i) => i !== idx);
        await _updateDoc(isOffline ? {id} : doc(db, 'artifacts', appId, 'users', state.user.uid, 'items', id), { 'content.items': newItems });
    };
    window.updateCL = async (id, idx, field, val) => {
        const item = state.items.find(i => i.id === id);
        const newItems = [...item.content.items];
        newItems[idx][field] = val;
        await _updateDoc(isOffline ? {id} : doc(db, 'artifacts', appId, 'users', state.user.uid, 'items', id), { 'content.items': newItems });
    };

    window.togglePaid = async (id) => {
        const item = state.items.find(i => i.id === id);
        await _updateDoc(isOffline ? {id} : doc(db, 'artifacts', appId, 'users', state.user.uid, 'items', id), { 'content.paid': !item.content.paid });
    };
    window.makeDeposit = async (id) => {
        const val = parseFloat(document.getElementById(`dep-${id}`).value);
        if(!val) return;
        const item = state.items.find(i => i.id === id);
        await _updateDoc(isOffline ? {id} : doc(db, 'artifacts', appId, 'users', state.user.uid, 'items', id), { 'content.saved': (parseFloat(item.content.saved)||0) + val });
    };
    
    window.copyBankData = (bank, holder, ag, cc, pix) => {
        const text = `Banco: ${bank}\nTitular: ${holder}\nAg: ${ag}\nCC: ${cc}\nPIX: ${pix}`;
        window.copyToClipboard(text);
    };
    window.copyToClipboard = (text) => {
        const ta = document.createElement('textarea');
        ta.value = text;
        document.body.appendChild(ta);
        ta.select();
        document.execCommand('copy');
        document.body.removeChild(ta);
        window.showToast("Copiado!");
    };
    
    window.shareItem = (id) => {
        state.shareItemId = id;
        const link = `https://organizer-premium.app/share/${id}`;
        if (navigator.share) {
            navigator.share({ title: 'Organizer Premium', text: 'Confira este item:', url: link }).catch(console.error);
        } else {
            document.getElementById('share-link-display').innerText = link;
            const m = document.getElementById('share-modal');
            m.style.display = 'flex'; setTimeout(()=>m.classList.add('open'), 10);
        }
    };
    window.shareDirectly = () => { window.open(`whatsapp://send?text=${encodeURIComponent(document.getElementById('share-link-display').innerText)}`); };
    window.copyShareLink = () => { window.copyToClipboard(document.getElementById('share-link-display').innerText); };
    window.downloadItem = (id) => {
        const item = state.items.find(i => i.id === id);
        if(!item) return;
        if (item.type === 'file') {
            const link = document.createElement("a"); link.href = item.content.data; link.download = item.name;
            document.body.appendChild(link); link.click(); document.body.removeChild(link);
        } else {
            const text = JSON.stringify(item.content, null, 2);
            const blob = new Blob([text], {type: 'text/plain'});
            const link = document.createElement("a"); link.href = URL.createObjectURL(blob); link.download = `${item.name}.txt`;
            document.body.appendChild(link); link.click(); document.body.removeChild(link);
        }
    };
    window.editItem = (id, type) => {
        if(type === 'health_weight') return window.openModal('health_weight_config', id);
        window.openModal(type, id);
    };

    window.editVisionCaption = async (id, idx) => {
        const item = state.items.find(i => i.id === id);
        if(!item) return;
        const currentCaption = item.content.images[idx].caption || '';
        const newCaption = prompt("Legenda:", currentCaption);

    window.saveItem = async (type) => {

        const getCheck = (id) => { const el = document.getElementById(id); return el ? el.checked : false; };
        let data = { parentId, type, createdAt: Date.now() };
        if (state.selectedIcon) data.icon = state.selectedIcon;

        try {
            if (type === 'create_area') {
                data = { type: 'custom_area', name: getVal('f-name'), parentId: 'root', createdAt: Date.now(), icon: state.selectedIcon };
                await _addDoc(coll, data);

                const ref = isOffline ? {id: state.editingId} : doc(db, 'artifacts', appId, 'users', state.user.uid, 'items', state.editingId);

                if (state.editingId) await _updateDoc(isOffline ? {id: state.editingId} : doc(db, 'artifacts', appId, 'users', state.user.uid, 'items', state.editingId), data);
                else await _addDoc(coll, data);
            } else if (type === 'add_vision_image') {
                const file = document.getElementById('f-vision-img').files[0];
                const cap = getVal('f-vision-cap');
                if (file && state.editingId) {
                    const reader = new FileReader();
                    reader.onload = async (e) => {
                        const item = state.items.find(i => i.id === state.editingId);
                        const newImages = [...(item.content.images || []), { data: e.target.result, caption: cap }];
                        await _updateDoc(isOffline ? {id: state.editingId} : doc(db, 'artifacts', appId, 'users', state.user.uid, 'items', state.editingId), { 'content.images': newImages });
                        window.closeModal(); window.showToast("Imagem adicionada!");
                    };
                    reader.readAsDataURL(file);
                    return; // Async handler handles closing
                }
            }
            else if (type === 'file') {
                 const f = document.getElementById('f-file').files[0];
                 const caption = getVal('f-caption');
                 const name = getVal('f-name');
                 
                 if(f) {
                    const reader = new FileReader();
                    reader.onload = async (e) => {
                        const fileData = { name: name || f.name, type: 'file', content: {data:e.target.result, fileType:f.type, caption: caption}, createdAt: Date.now(), parentId };
                        if (state.editingId) await _updateDoc(isOffline ? {id: state.editingId} : doc(db, 'artifacts', appId, 'users', state.user.uid, 'items', state.editingId), fileData);
                        else await _addDoc(coll, fileData);
                        state.editingId = null; window.closeModal(); window.showToast("Arquivo salvo!");
                    };
                    reader.readAsDataURL(f); return;
                 } else if (state.editingId) {
                      const ref = isOffline ? {id: state.editingId} : doc(db, 'artifacts', appId, 'users', state.user.uid, 'items', state.editingId);
                      await _updateDoc(ref, { name: name, 'content.caption': caption });
                 }
            } 
            else if (type === 'folder') { data.name = getVal('f-name'); await _addDoc(coll, data); }
            else if (type === 'note') { data.name = getVal('f-name'); data.content = {text: getVal('f-text')}; if(state.editingId) await _updateDoc(isOffline?{id:state.editingId}:doc(db,'artifacts',appId,'users',state.user.uid,'items',state.editingId), data); else await _addDoc(coll, data); }
            else if (type.includes('checklist')) { data.name = getVal('f-name'); if(!state.editingId) data.content = { items: [] }; if(state.editingId) { const docRef = isOffline ? {id: state.editingId} : doc(db, 'artifacts', appId, 'users', state.user.uid, 'items', state.editingId); delete data.content; await _updateDoc(docRef, data); } else await _addDoc(coll, data); }
            else if (type === 'bank') { data.name = getVal('f-name'); data.content = { holder: getVal('f-holder'), agency: getVal('f-ag'), account: getVal('f-cc'), pix: getVal('f-pix'), pass: getVal('f-pass') }; if(state.editingId) { const docRef = isOffline ? {id: state.editingId} : doc(db, 'artifacts', appId, 'users', state.user.uid, 'items', state.editingId); await _updateDoc(docRef, data); } else await _addDoc(coll, data); }
            else if (type === 'social') { data.name = getVal('f-name'); data.content = { login: getVal('f-login'), pass: getVal('f-pass') }; if(state.editingId) { const docRef = isOffline ? {id: state.editingId} : doc(db, 'artifacts', appId, 'users', state.user.uid, 'items', state.editingId); await _updateDoc(docRef, data); } else await _addDoc(coll, data); }
            else if (type === 'expense' || type === 'pendency' || type === 'income') {
                const name = getVal('f-name');
                const totalVal = parseFloat(getVal('f-val'));
                const parcels = parseInt(getVal('f-par')) || 1;
                const dueStr = getVal('f-due');
                const parcelVal = totalVal / parcels;
                for(let i=0; i<parcels; i++) {
                    const date = new Date(dueStr + 'T12:00:00');
                    date.setMonth(date.getMonth() + i);
                    await _addDoc(coll, { parentId, type, name: parcels > 1 ? `${name} (${i+1}/${parcels})` : name, createdAt: Date.now() + i, content: { value: parcelVal, due: date.toISOString().split('T')[0], paid: false } });
                }
            }
            else if (type === 'piggy') {
                data.name = getVal('f-name');
                data.content = { target: getVal('f-target'), months: getVal('f-months'), saved: state.editingId ? state.items.find(i=>i.id===state.editingId).content.saved : 0 };
                if(state.editingId) await _updateDoc(isOffline?{id:state.editingId}:doc(db,'artifacts',appId,'users',state.user.uid,'items',state.editingId), data); else await _addDoc(coll, data);
            }
            else if(type === 'health_weight_config') {
                 const startW = parseFloat(getVal('f-w-start').replace(',', '.')) || 0;
                 const targetW = parseFloat(getVal('f-w-target').replace(',', '.')) || 0;
                 const heightW = parseFloat(getVal('f-w-height').replace(',', '.')) || 0;
                 const periodM = parseInt(getVal('f-w-period')) || 1;

                 if(state.editingId) await _updateDoc(isOffline?{id:state.editingId}:doc(db,'artifacts',appId,'users',state.user.uid,'items',state.editingId), { 'content.startWeight': startW, 'content.target': targetW, 'content.startDate': getVal('f-w-date'), 'content.periodMonths': periodM, 'content.height': heightW });
                 else await _addDoc(coll, { parentId: 'saude', type: 'health_weight', name: 'Peso', content: { current: startW, startWeight: startW, target: targetW, startDate: getVal('f-w-date'), periodMonths: periodM, height: heightW, history: [] } });
            }
            else if(type === 'add_weight_entry') { 
                const regW = parseFloat(getVal('f-reg-weight').replace(',', '.'));
                if(regW) {
                    const wItem = state.items.find(i => i.type === 'health_weight');
                    const newHistory = [...(wItem.content.history||[]), { date: getVal('f-reg-date'), weight: regW }];
                    await _updateDoc(isOffline?{id:wItem.id}:doc(db,'artifacts',appId,'users',state.user.uid,'items',wItem.id), { 'content.current': regW, 'content.history': newHistory });
                    window.openModal('health_weight_register');
                    return;
                } else {
                    window.showToast("Informe o peso", "error");
                    return;
                }
            }
            else if(type === 'weight_history_edit') {
                const wItem = state.items.find(i => i.type === 'health_weight');
                let history = [...(wItem.content.history||[])].sort((a,b) => new Date(b.date) - new Date(a.date));
                history[state.editingHistoryIndex] = { date: getVal('f-reg-date'), weight: parseFloat(getVal('f-reg-weight').replace(',', '.')) };
                history.sort((a,b) => new Date(b.date) - new Date(a.date));
                const newCurrent = history.length > 0 ? history[0].weight : wItem.content.startWeight;
                await _updateDoc(isOffline?{id:wItem.id}:doc(db,'artifacts',appId,'users',state.user.uid,'items',wItem.id), { 'content.history': history, 'content.current': newCurrent });
                window.openModal('health_weight_register');
                return;
            }
            else if(type === 'health_med') { data.name = getVal('f-name'); data.content = { time: getVal('f-time'), instructions: getVal('f-inst') }; if(state.editingId) await _updateDoc(isOffline?{id:state.editingId}:doc(db,'artifacts',appId,'users',state.user.uid,'items',state.editingId), data); else await _addDoc(coll, data); }
            else if(type === 'health_food') { 
                const content = {
                    breakfastTime: getVal('f-d-bt'), breakfast: getVal('f-d-b'),
                    lunchTime: getVal('f-d-lt'), lunch: getVal('f-d-l'),
                    dinnerTime: getVal('f-d-dt'), dinner: getVal('f-d-d'),
                    fastingStart: getVal('f-d-fs'), fastingEnd: getVal('f-d-fe')
                };
                const ex = state.items.find(i=>i.type==='health_food');
                if(ex) await _updateDoc(isOffline?{id:ex.id}:doc(db,'artifacts',appId,'users',state.user.uid,'items',ex.id), {'content': content});
                else await _addDoc(coll, {parentId:'saude', type:'health_food', name:'Dieta', content: content});
            }
            else if(type === 'menstrual_log') {
                const dateKey = getVal('f-mens-date');
                const content = { date: dateKey, flow: getVal('f-mens-flow'), sex: getCheck('f-mens-sex'), protection: getCheck('f-mens-prot'), notes: getVal('f-mens-notes') };
                const existing = state.items.find(i => i.type === 'menstrual_cycle' && i.content.date === dateKey);
                if (existing) await _updateDoc(isOffline ? {id: existing.id} : doc(db, 'artifacts', appId, 'users', state.user.uid, 'items', existing.id), {content});
                else await _addDoc(coll, { parentId: 'saude', type: 'menstrual_cycle', name: 'Ciclo', content });
                render();
            }
            else if(type === 'menstrual_settings') {
                const contraType = getVal('f-prof-hormonal');
                const content = { 
                    name: getVal('f-prof-name'), 
                    age: getVal('f-prof-age'), 
                    cycleDuration: getVal('f-prof-dur'), 
                    flowDuration: getVal('f-prof-flowdur'), 
                    contraceptiveType: contraType,
                    lastPeriodDate: getVal('f-prof-last'), 
                    contraceptiveStartDate: getVal('f-prof-contradate') 
                };
                const existing = state.items.find(i => i.type === 'menstrual_profile');
                if(existing) await _updateDoc(isOffline ? {id: existing.id} : doc(db, 'artifacts', appId, 'users', state.user.uid, 'items', existing.id), {content});
                else await _addDoc(coll, { parentId: 'saude', type: 'menstrual_profile', name: 'Perfil Mulher', content });
                render();
            }

            window.showToast("Salvo!"); window.closeModal();
        } catch(e) { console.error(e); window.showToast("Erro: " + e.message, "error"); }
    };

    initApp();
</script>
</body>
</html>
