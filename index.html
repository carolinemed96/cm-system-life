<!DOCTYPE html>
<html lang="pt-PT">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Caroline Medeiros - Organizador Premium</title>
    
    <script src="https://unpkg.com/lucide@latest"></script>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700&family=Playfair+Display:ital,wght@0,600;0,700;1,600&display=swap" rel="stylesheet">
    
    <style>
        :root {
            --chocolate: #3E2723;
            --chocolate-light: #5D4037;
            --off-white: #FDFBF7;
            --gold: #C5A059;
            --gold-light: #E0C080;
            --text-main: #3E2723;
            --success: #558B2F;
            --danger: #C62828;
            --bg-card: #FFFFFF;
            --transition: all 0.3s cubic-bezier(0.25, 0.8, 0.25, 1);
            --shadow: 0 10px 30px -5px rgba(62, 39, 35, 0.1);
            --shadow-hover: 0 15px 35px -5px rgba(197, 160, 89, 0.2);
            --period-line: #3E2723; 
        }

        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Montserrat', sans-serif; -webkit-tap-highlight-color: transparent; }
        h1, h2, h3, .monogram { font-family: 'Playfair Display', serif; }

        body { background-color: var(--off-white); color: var(--text-main); min-height: 100vh; display: flex; flex-direction: column; overflow-x: hidden; }

        /* --- Header & Nav --- */
        header { padding: 25px 20px; text-align: center; background: #fff; border-bottom: 1px solid rgba(197, 160, 89, 0.2); position: sticky; top: 0; z-index: 100; }
        .monogram { font-size: 2.5rem; color: var(--chocolate); line-height: 1; margin-bottom: 5px; }
        .brand-name { font-size: 0.75rem; text-transform: uppercase; letter-spacing: 4px; color: var(--gold); font-weight: 700; }
        
        .navigation-bar { padding: 12px 5%; background: #fff; display: flex; align-items: center; gap: 10px; font-size: 0.85rem; border-bottom: 1px solid #f0f0f0; overflow-x: auto; }
        .breadcrumb-item { cursor: pointer; color: var(--chocolate-light); font-weight: 600; display: flex; align-items: center; gap: 4px; white-space: nowrap; }

        /* --- UI Components --- */
        main { flex: 1; padding: 20px 5%; max-width: 1000px; margin: 0 auto; width: 100%; animation: fadeIn 0.4s ease; }
        .section-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 25px; }
        
        .grid-container { display: grid; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); gap: 20px; }
        .card { background: var(--bg-card); padding: 20px; border-radius: 20px; box-shadow: var(--shadow); transition: var(--transition); border: 1px solid rgba(0,0,0,0.02); position: relative; }
        .card:hover { transform: translateY(-3px); box-shadow: var(--shadow-hover); }

        /* --- Weight Monitor Custom Styles --- */
        .highlight-card { background: var(--chocolate); color: white; padding: 25px; border-radius: 24px; text-align: center; margin-bottom: 20px; border: 2px solid var(--gold); }
        .meta-label { font-size: 0.8rem; text-transform: uppercase; letter-spacing: 2px; color: var(--gold-light); font-weight: 700; margin-bottom: 10px; }
        .meta-value { font-size: 3.5rem; font-weight: 900; line-height: 1; color: #fff; }
        .meta-unit { font-size: 1.2rem; color: var(--gold); }

        .stat-grid { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 10px; margin-top: 20px; }
        .stat-item { background: rgba(255,255,255,0.05); padding: 12px; border-radius: 15px; }
        .stat-label { font-size: 0.65rem; text-transform: uppercase; color: var(--gold-light); font-weight: 700; }
        .stat-num { font-size: 1.1rem; font-weight: 800; color: #fff; display: block; margin-top: 4px; }

        .water-card { background: #fff; border: 1px solid rgba(197, 160, 89, 0.2); padding: 15px; border-radius: 18px; display: flex; justify-content: space-between; align-items: center; margin-top: 15px; }

        /* --- Vision Board Mural --- */
        .vision-mural { display: grid; grid-template-columns: repeat(auto-fill, minmax(160px, 1fr)); gap: 15px; margin-top: 10px; }
        .vision-item { position: relative; border-radius: 15px; overflow: hidden; aspect-ratio: 3/4; box-shadow: var(--shadow); cursor: pointer; background: #eee; }
        .vision-img { width: 100%; height: 100%; object-fit: cover; transition: 0.5s; }
        .vision-item:hover .vision-img { transform: scale(1.08); }
        .vision-overlay { position: absolute; bottom: 0; left: 0; right: 0; padding: 15px 10px; background: linear-gradient(transparent, rgba(62, 39, 35, 0.9)); color: white; font-size: 0.75rem; font-weight: 600; text-align: center; }
        .vision-btn-group { position: absolute; top: 10px; right: 10px; display: flex; gap: 5px; opacity: 0; transition: 0.3s; }
        .vision-item:hover .vision-btn-group { opacity: 1; }
        .mini-btn { width: 28px; height: 28px; border-radius: 50%; background: #fff; display: flex; align-items: center; justify-content: center; color: var(--chocolate); border: none; cursor: pointer; box-shadow: 0 2px 5px rgba(0,0,0,0.2); }

        /* --- Form Elements --- */
        .form-group { margin-bottom: 20px; }
        .form-group label { display: block; font-size: 0.75rem; font-weight: 700; text-transform: uppercase; color: var(--chocolate); margin-bottom: 8px; letter-spacing: 1px; }
        .form-control { width: 100%; padding: 14px; border: 1px solid #eee; border-radius: 12px; font-size: 1rem; background: #fcfcfc; outline: none; transition: 0.3s; }
        .form-control:focus { border-color: var(--gold); background: #fff; box-shadow: 0 0 0 3px rgba(197,160,89,0.1); }
        textarea.form-control { min-height: 60px; resize: none; overflow: hidden; }

        /* --- Modals --- */
        #modal-overlay { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.5); backdrop-filter: blur(5px); z-index: 200; display: none; justify-content: center; align-items: center; padding: 20px; }
        .modal { background: #fff; width: 100%; max-width: 500px; border-radius: 24px; padding: 30px; max-height: 90vh; overflow-y: auto; position: relative; animation: slideUp 0.3s ease; }
        .modal-title { text-align: center; margin-bottom: 25px; font-size: 1.5rem; color: var(--chocolate); }
        
        /* Lightbox */
        #lightbox { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.9); z-index: 500; display: none; justify-content: center; align-items: center; cursor: zoom-out; }
        #lightbox img { max-width: 95%; max-height: 90vh; border-radius: 10px; box-shadow: 0 0 30px rgba(0,0,0,0.5); }

        /* --- Calendar --- */
        .cal-grid { display: grid; grid-template-columns: repeat(7, 1fr); gap: 5px; margin-top: 15px; }
        .cal-day { aspect-ratio: 1; display: flex; align-items: center; justify-content: center; border-radius: 50%; font-size: 0.9rem; font-weight: 600; cursor: pointer; transition: 0.2s; position: relative; color: #555; }
        .cal-day.today { border: 2px solid var(--chocolate); }
        .cal-day.period { background: rgba(198, 40, 40, 0.1); color: var(--danger); }
        .cal-day.fertile { background: rgba(85, 139, 47, 0.1); color: var(--success); }
        .cal-legend { display: flex; justify-content: center; gap: 15px; margin-top: 20px; font-size: 0.7rem; color: #777; font-weight: 700; text-transform: uppercase; }
        .legend-dot { width: 10px; height: 10px; border-radius: 50%; display: inline-block; margin-right: 4px; }

        @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
        @keyframes slideUp { from { transform: translateY(20px); opacity: 0; } to { transform: translateY(0); opacity: 1; } }

        /* --- Floating Actions --- */
        .fab { position: fixed; bottom: 30px; right: 30px; width: 60px; height: 60px; background: var(--gold); border-radius: 50%; display: flex; align-items: center; justify-content: center; color: white; box-shadow: 0 10px 25px rgba(197,160,89,0.5); cursor: pointer; z-index: 150; }

        .create-menu-dropdown { position: absolute; bottom: 80px; right: 0; background: #fff; border-radius: 18px; box-shadow: var(--shadow); width: 220px; display: none; overflow: hidden; z-index: 160; border: 1px solid #eee; }
        .create-menu-item { padding: 15px 20px; display: flex; align-items: center; gap: 12px; font-size: 0.85rem; color: var(--chocolate); font-weight: 600; cursor: pointer; }
        .create-menu-item:hover { background: var(--off-white); color: var(--gold); }
    </style>
</head>
<body autocomplete="off">

<div id="lock-screen" style="position:fixed; inset:0; background:var(--off-white); z-index:1000; display:flex; flex-direction:column; justify-content:center; align-items:center;">
    <div class="monogram">CM</div>
    <div class="brand-name" style="margin-bottom:30px;">Caroline Medeiros</div>
    <input type="password" id="lock-input" class="lock-input" placeholder="PALAVRA-PASSE" maxlength="4" style="text-align:center; font-size:1.5rem; letter-spacing:8px; border-radius:50px; border:2px solid var(--gold); padding:15px; width:200px; outline:none;" autocomplete="off">
    <button onclick="checkAccess()" class="btn-add" style="margin-top:20px; padding:15px 40px; font-size:1rem;">ENTRAR</button>
</div>

<header>
    <div class="monogram">CM</div>
    <div class="brand-name">Caroline Medeiros</div>
    <div id="clock" style="font-size:0.7rem; color:#8D6E63; margin-top:10px; font-weight:600;"></div>
</header>

<div class="navigation-bar" id="breadcrumbs"></div>

<main id="app-content"></main>

<!-- Floating Menu -->
<div class="fab" onclick="toggleMenu()">
    <i data-lucide="plus" id="fab-icon"></i>
    <div class="create-menu-dropdown" id="create-menu">
        <div class="create-menu-item" onclick="openModal('custom_area')"><i data-lucide="layout-grid"></i> Nova Área</div>
        <div class="create-menu-item" onclick="openModal('visionboard')"><i data-lucide="image"></i> Visionboard</div>
        <div class="create-menu-item" onclick="exportData()"><i data-lucide="download"></i> Backup Dados</div>
        <div class="create-menu-item" onclick="importData()"><i data-lucide="upload"></i> Restaurar</div>
    </div>
</div>

<div id="modal-overlay">
    <div class="modal">
        <h3 id="modal-title" class="modal-title"></h3>
        <div id="modal-body"></div>
        <div style="display:flex; gap:10px; justify-content:flex-end; margin-top:25px;">
            <button class="btn-cancel" onclick="closeModal()">Cancelar</button>
            <button class="btn-add" id="modal-save-btn">Guardar</button>
        </div>
    </div>
</div>

<div id="lightbox" onclick="this.style.display='none'">
    <img id="lightbox-img" src="">
</div>

<script>
    // --- State & Core ---
    let state = {
        path: ['root'],
        items: JSON.parse(localStorage.getItem('cm_premium_data')) || [],
        selectedIcon: null,
        editingId: null
    };

    const COLORS = { chocolate: '#3E2723', gold: '#C5A059' };

    function checkAccess() {
        if(document.getElementById('lock-input').value === "1234") { // Pass padrão para exemplo
            document.getElementById('lock-screen').style.opacity = '0';
            setTimeout(() => document.getElementById('lock-screen').style.display = 'none', 400);
        }
    }

    function save() {
        localStorage.setItem('cm_premium_data', JSON.stringify(state.items));
        render();
    }

    // --- Navigation ---
    const ROOT_AREAS = [
        { id: 'pessoal', name: 'Pessoal', icon: 'user' },
        { id: 'profissional', name: 'Profissional', icon: 'briefcase' },
        { id: 'financeiro', name: 'Financeiro', icon: 'trending-up' },
        { id: 'saude', name: 'Saúde', icon: 'heart' },
        { id: 'biblia', name: 'Bíblia', icon: 'book-open' }
    ];

    function navigate(id) {
        state.path.push(id);
        render();
    }

    function goBack(idx) {
        state.path = state.path.slice(0, idx + 1);
        render();
    }

    // --- Renderers ---
    function render() {
        const currentId = state.path[state.path.length - 1];
        const container = document.getElementById('app-content');
        const bread = document.getElementById('breadcrumbs');
        
        // Breadcrumbs
        bread.innerHTML = state.path.map((id, i) => {
            const label = id === 'root' ? 'Início' : (ROOT_AREAS.find(a=>a.id===id)?.name || state.items.find(it=>it.id===id)?.name || id);
            return `<span class="breadcrumb-item" onclick="goBack(${i})">${i>0?'<i data-lucide="chevron-right" style="width:12px;opacity:0.3"></i>':''} ${label}</span>`;
        }).join('');

        if (currentId === 'root') renderDashboard(container);
        else if (currentId === 'saude') renderHealth(container);
        else renderFolder(container, currentId);

        if(window.lucide) lucide.createIcons();
    }

    function renderDashboard(el) {
        el.innerHTML = `<h2 style="margin-bottom:20px;">Minhas Áreas</h2><div class="grid-container" id="dash-grid"></div>`;
        const grid = el.querySelector('#dash-grid');
        
        ROOT_AREAS.forEach(area => {
            const card = document.createElement('div');
            card.className = 'card';
            card.innerHTML = `<i data-lucide="${area.icon}" style="color:var(--gold); margin-right:15px;"></i><b style="font-size:1.1rem;">${area.name}</b>`;
            card.onclick = () => navigate(area.id);
            grid.appendChild(card);
        });

        state.items.filter(i => i.type === 'custom_area' && i.parentId === 'root').forEach(item => {
            const card = document.createElement('div');
            card.className = 'card';
            card.innerHTML = `<i data-lucide="${item.icon || 'star'}" style="color:var(--gold); margin-right:15px;"></i><b style="font-size:1.1rem; flex:1;">${item.name}</b><i data-lucide="trash-2" onclick="deleteItem('${item.id}', event)" style="width:16px; opacity:0.3;"></i>`;
            card.onclick = () => navigate(item.id);
            grid.appendChild(card);
        });
    }

    function renderHealth(el) {
        const weightItem = state.items.find(i => i.type === 'health_weight') || { content: { history: [] } };
        const diet = state.items.find(i => i.type === 'health_food') || { content: {} };
        const stats = calculateStats(weightItem);

        el.innerHTML = `
            <div class="section-header"><h2>Monitor de Saúde</h2></div>
            
            ${stats ? `
            <div class="highlight-card">
                <div class="meta-label">Meta Mensal de Perda</div>
                <div class="meta-value">${stats.mma} <span class="meta-unit">kg</span></div>
                <div class="stat-grid">
                    <div class="stat-item"><span class="stat-label">Peso Inicial</span><span class="stat-num">${weightItem.content.startWeight}kg</span></div>
                    <div class="stat-item"><span class="stat-label">Peso Atual</span><span class="stat-num">${stats.current}kg</span></div>
                    <div class="stat-item"><span class="stat-label">IMC</span><span class="stat-num">${stats.imc}</span><small style="font-size:0.6rem;color:var(--gold-light)">${stats.imcClass}</small></div>
                </div>
            </div>

            <div class="water-card">
                <div style="display:flex; align-items:center; gap:12px;">
                    <div style="color:var(--gold)"><i data-lucide="droplet"></i></div>
                    <div><b style="font-size:0.9rem; color:var(--chocolate)">Meta Diária de Água</b><br><small style="color:#888;">Baseada no seu peso</small></div>
                </div>
                <b style="font-size:1.4rem; color:var(--gold)">${stats.water}L</b>
            </div>
            ` : `<div class="card" style="text-align:center; padding:40px; color:#aaa;" onclick="openModal('health_weight_config')">Clique para configurar o monitor de peso</div>`}

            <div class="grid-container" style="margin-top:20px;">
                <div class="card" style="display:block;">
                    <div style="display:flex; justify-content:space-between; margin-bottom:15px;">
                        <b>Registo de Peso</b>
                        <button class="btn-add" style="padding:5px 12px; font-size:0.7rem;" onclick="openModal('health_weight_register')">Pesar</button>
                    </div>
                    <div style="max-height:150px; overflow-y:auto; font-size:0.85rem;">
                        ${(weightItem.content.history || []).sort((a,b)=>new Date(b.date)-new Date(a.date)).map((h,idx) => `
                            <div style="display:flex; justify-content:space-between; padding:8px 0; border-bottom:1px solid #eee;">
                                <span>${new Date(h.date).toLocaleDateString()}</span>
                                <div>
                                    <b style="margin-right:10px;">${h.weight}kg</b>
                                    <i data-lucide="edit-2" style="width:12px; cursor:pointer;" onclick="editWeightEntry('${h.id}')"></i>
                                    <i data-lucide="trash-2" style="width:12px; cursor:pointer; margin-left:8px; color:var(--danger);" onclick="deleteWeightEntry('${h.id}')"></i>
                                </div>
                            </div>
                        `).join('')}
                    </div>
                    ${stats ? `<button class="btn-cancel" style="width:100%; margin-top:10px; font-size:0.7rem;" onclick="openModal('health_weight_config', '${weightItem.id}')">Configurar Monitor</button>` : ''}
                </div>

                <div class="card" style="display:block;">
                    <div style="display:flex; justify-content:space-between; margin-bottom:15px;"><b>Plano Alimentar</b> <i data-lucide="edit" style="width:16px; cursor:pointer" onclick="openModal('health_food')"></i></div>
                    <div style="display:flex; flex-direction:column; gap:12px; font-size:0.8rem;">
                        <div style="background:var(--off-white); padding:8px; border-radius:8px;">
                            <b style="color:var(--gold)">Café (${diet.content.bt || '08:00'})</b><div style="margin-top:2px;">${diet.content.b || '-'}</div>
                        </div>
                        <div style="background:var(--off-white); padding:8px; border-radius:8px;">
                            <b style="color:var(--gold)">Almoço (${diet.content.lt || '12:30'})</b><div style="margin-top:2px;">${diet.content.l || '-'}</div>
                        </div>
                        <div style="background:var(--off-white); padding:8px; border-radius:8px;">
                            <b style="color:var(--gold)">Jantar (${diet.content.dt || '19:30'})</b><div style="margin-top:2px;">${diet.content.d || '-'}</div>
                        </div>
                        <div style="background:var(--chocolate); color:#fff; padding:8px; border-radius:8px;">
                            <b>Jejum: ${diet.content.fs || '20:00'} às ${diet.content.fe || '08:00'}</b>
                        </div>
                    </div>
                </div>
            </div>

            <div class="card" style="margin-top:20px; display:block;">
                <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:15px;">
                    <b>Ciclo Menstrual</b>
                    <button class="btn-cancel" style="padding:5px 12px; font-size:0.7rem;" onclick="openModal('menstrual_settings')">Configurar</button>
                </div>
                ${renderCalendar()}
                <div class="cal-legend">
                    <span><span class="legend-dot" style="background:var(--danger); opacity:0.4"></span> Menstruação</span>
                    <span><span class="legend-dot" style="background:var(--success); opacity:0.4"></span> Fértil</span>
                </div>
            </div>
        `;
    }

    function renderFolder(el, pid) {
        const items = state.items.filter(i => i.parentId === pid);
        const folder = state.items.find(i => i.id === pid);

        if (folder?.type === 'visionboard') {
            el.innerHTML = `
                <div class="section-header">
                    <h2>${folder.name}</h2>
                    <button class="btn-add" onclick="openModal('vision_add', '${pid}')"><i data-lucide="camera"></i> Adicionar Foto</button>
                </div>
                <div class="vision-mural">
                    ${(folder.content.images || []).map((img, idx) => `
                        <div class="vision-item">
                            <img src="${img.data}" class="vision-img" onclick="showLightbox('${img.data}')">
                            <div class="vision-overlay">${img.caption}</div>
                            <div class="vision-btn-group">
                                <button class="mini-btn" onclick="editVisionCaption('${pid}', ${idx})"><i data-lucide="type" style="width:14px"></i></button>
                                <button class="mini-btn" style="color:var(--danger)" onclick="deleteVisionImg('${pid}', ${idx})"><i data-lucide="trash-2" style="width:14px"></i></button>
                            </div>
                        </div>
                    `).join('')}
                </div>
            `;
            return;
        }

        el.innerHTML = `<div class="section-header"><h2>Conteúdo</h2></div><div class="grid-container" id="folder-grid"></div>`;
        const grid = el.querySelector('#folder-grid');
        
        items.forEach(i => {
            const card = document.createElement('div');
            card.className = 'card';
            card.innerHTML = `<i data-lucide="image" style="color:var(--gold); margin-right:15px;"></i><b style="flex:1;">${i.name}</b>`;
            card.onclick = () => navigate(i.id);
            grid.appendChild(card);
        });
    }

    // --- Calendar Logic ---
    function renderCalendar() {
        const now = new Date();
        const daysInMonth = new Date(now.getFullYear(), now.getMonth() + 1, 0).getDate();
        const firstDay = new Date(now.getFullYear(), now.getMonth(), 1).getDay();
        
        let html = `<div class="cal-grid">`;
        for(let i=0; i<firstDay; i++) html += `<div></div>`;
        for(let d=1; d<=daysInMonth; d++) {
            const isToday = d === now.getDate();
            const dateStr = `${now.getFullYear()}-${now.getMonth()+1}-${d}`;
            // Simulação simples de ciclo para visual
            const isPeriod = d >= 1 && d <= 5;
            const isFertile = d >= 12 && d <= 16;

            html += `<div class="cal-day ${isToday?'today':''} ${isPeriod?'period':''} ${isFertile?'fertile':''}" onclick="showToast('Registo para dia ${d}')">${d}</div>`;
        }
        html += `</div>`;
        return html;
    }

    // --- Calculations ---
    function calculateStats(w) {
        if(!w.content.target) return null;
        const current = w.content.history.length ? w.content.history.sort((a,b)=>new Date(b.date)-new Date(a.date))[0].weight : w.content.startWeight;
        const remainingWeight = current - w.content.target;
        
        const start = new Date(w.content.startDate);
        const end = new Date(start); 
        end.setMonth(start.getMonth() + parseInt(w.content.periodMonths));
        
        const diffDays = Math.ceil((end - new Date()) / (1000 * 60 * 60 * 24));
        const monthsRem = Math.max(1, Math.ceil(diffDays / 30.41));
        
        const mma = remainingWeight > 0 ? (remainingWeight / monthsRem).toFixed(1) : 0;
        
        let h = parseFloat(w.content.height);
        if(h > 3) h = h/100;
        const imc = (current / (h * h)).toFixed(1);
        let imcClass = "Normal";
        if(imc > 25) imcClass = "Sobrepeso";
        if(imc > 30) imcClass = "Obesidade";

        return { mma, current, imc, imcClass, water: (current * 0.035).toFixed(1), monthsRemaining: monthsRem };
    }

    // --- Modal System ---
    function openModal(type, extra = null) {
        state.editingId = extra;
        const modal = document.getElementById('modal-overlay');
        const body = document.getElementById('modal-body');
        const title = document.getElementById('modal-title');
        const saveBtn = document.getElementById('modal-save-btn');
        
        modal.style.display = 'flex';
        let html = '';

        if (type === 'custom_area') {
            title.innerText = "Nova Área";
            html = `<div class="form-group"><label>Nome</label><input id="f-name" class="form-control" autocomplete="off"></div>`;
        } 
        else if (type === 'visionboard') {
            title.innerText = "Novo Visionboard";
            html = `<div class="form-group"><label>Título</label><input id="f-name" class="form-control" autocomplete="off"></div>`;
        }
        else if (type === 'vision_add') {
            title.innerText = "Adicionar ao Mural";
            html = `
                <div class="form-group"><label>Imagem</label><input type="file" id="f-img" class="form-control" accept="image/*"></div>
                <div class="form-group"><label>Legenda</label><input id="f-cap" class="form-control" placeholder="Descreva esta meta..." autocomplete="off"></div>
            `;
        }
        else if (type === 'health_weight_config') {
            const w = state.items.find(i=>i.type === 'health_weight') || {content:{}};
            title.innerText = "Configurar Monitor";
            html = `
                <div class="form-group"><label>Peso Inicial (kg)</label><input type="number" id="f-start" class="form-control" value="${w.content.startWeight||''}" step="0.1"></div>
                <div class="form-group"><label>Meta Final (kg)</label><input type="number" id="f-target" class="form-control" value="${w.content.target||''}" step="0.1"></div>
                <div class="form-group"><label>Altura (m ou cm)</label><input type="number" id="f-height" class="form-control" value="${w.content.height||''}" step="0.01"></div>
                <div class="form-group"><label>Prazo (Meses)</label><input type="number" id="f-months" class="form-control" value="${w.content.periodMonths||''}"></div>
                <div class="form-group"><label>Data Início</label><input type="date" id="f-date" class="form-control" value="${w.content.startDate||new Date().toISOString().split('T')[0]}"></div>
            `;
        }
        else if (type === 'health_weight_register') {
            title.innerText = "Novo Registo de Peso";
            html = `
                <div class="form-group"><label>Peso Hoje (kg)</label><input type="number" id="f-weight" class="form-control" step="0.1" autofocus></div>
                <div class="form-group"><label>Data</label><input type="date" id="f-date" class="form-control" value="${new Date().toISOString().split('T')[0]}"></div>
            `;
        }
        else if (type === 'health_food') {
            const d = state.items.find(i=>i.type === 'health_food') || {content:{}};
            title.innerText = "Plano Alimentar";
            html = `
                <div style="display:grid; grid-template-columns:1fr 2fr; gap:10px; margin-bottom:15px;">
                    <input type="time" id="f-bt" class="form-control" value="${d.content.bt||'08:00'}">
                    <textarea id="f-b" class="form-control" placeholder="Café da Manhã">${d.content.b||''}</textarea>
                </div>
                <div style="display:grid; grid-template-columns:1fr 2fr; gap:10px; margin-bottom:15px;">
                    <input type="time" id="f-lt" class="form-control" value="${d.content.lt||'12:30'}">
                    <textarea id="f-l" class="form-control" placeholder="Almoço">${d.content.l||''}</textarea>
                </div>
                <div style="display:grid; grid-template-columns:1fr 2fr; gap:10px; margin-bottom:15px;">
                    <input type="time" id="f-dt" class="form-control" value="${d.content.dt||'19:30'}">
                    <textarea id="f-d" class="form-control" placeholder="Jantar">${d.content.d||''}</textarea>
                </div>
                <div style="display:flex; gap:10px; align-items:center; background:var(--off-white); padding:10px; border-radius:12px;">
                    <b>Jejum:</b>
                    <input type="time" id="f-fs" class="form-control" value="${d.content.fs||'20:00'}">
                    <span>até</span>
                    <input type="time" id="f-fe" class="form-control" value="${d.content.fe||'08:00'}">
                </div>
            `;
        }

        body.innerHTML = html;
        saveBtn.onclick = () => handleSave(type, extra);
    }

    async function handleSave(type, extra) {
        const getVal = id => document.getElementById(id).value;
        
        if (type === 'custom_area') {
            state.items.push({ id: 'area_'+Date.now(), parentId: 'root', type: 'custom_area', name: getVal('f-name'), icon: 'layout' });
        }
        else if (type === 'visionboard') {
            state.items.push({ id: 'vb_'+Date.now(), parentId: state.path[state.path.length-1], type: 'visionboard', name: getVal('f-name'), content: { images: [] } });
        }
        else if (type === 'vision_add') {
            const file = document.getElementById('f-img').files[0];
            const caption = getVal('f-cap');
            if(!file) return alert("Selecione uma imagem");
            const reader = new FileReader();
            reader.onload = (e) => {
                const vb = state.items.find(i => i.id === extra);
                vb.content.images.push({ data: e.target.result, caption: caption });
                save();
                closeModal();
            };
            reader.readAsDataURL(file);
            return;
        }
        else if (type === 'health_weight_config') {
            let hw = state.items.find(i=>i.type === 'health_weight');
            const data = { startWeight: getVal('f-start'), target: getVal('f-target'), height: getVal('f-height'), periodMonths: getVal('f-months'), startDate: getVal('f-date') };
            if(!hw) state.items.push({ id: 'hw_1', type: 'health_weight', parentId: 'saude', name: 'Peso', content: { ...data, history: [] } });
            else hw.content = { ...hw.content, ...data };
        }
        else if (type === 'health_weight_register') {
            const hw = state.items.find(i=>i.type === 'health_weight');
            hw.content.history.push({ id: 'w_'+Date.now(), date: getVal('f-date'), weight: getVal('f-weight') });
        }
        else if (type === 'health_food') {
            let hf = state.items.find(i=>i.type === 'health_food');
            const data = { bt: getVal('f-bt'), b: getVal('f-b'), lt: getVal('f-lt'), l: getVal('f-l'), dt: getVal('f-dt'), d: getVal('f-d'), fs: getVal('f-fs'), fe: getVal('f-fe') };
            if(!hf) state.items.push({ id: 'hf_1', type: 'health_food', parentId: 'saude', name: 'Dieta', content: data });
            else hf.content = data;
        }

        save();
        closeModal();
    }

    function closeModal() {
        document.getElementById('modal-overlay').style.display = 'none';
    }

    function showLightbox(src) {
        const lb = document.getElementById('lightbox');
        document.getElementById('lightbox-img').src = src;
        lb.style.display = 'flex';
    }

    function editWeightEntry(id) {
        const hw = state.items.find(i=>i.type==='health_weight');
        const entry = hw.content.history.find(h=>h.id===id);
        const newW = prompt("Novo peso:", entry.weight);
        if(newW) {
            entry.weight = newW;
            save();
        }
    }

    function deleteWeightEntry(id) {
        if(!confirm("Apagar registo?")) return;
        const hw = state.items.find(i=>i.type==='health_weight');
        hw.content.history = hw.content.history.filter(h=>h.id !== id);
        save();
    }

    function deleteVisionImg(vbId, idx) {
        if(!confirm("Apagar imagem?")) return;
        const vb = state.items.find(i=>i.id===vbId);
        vb.content.images.splice(idx, 1);
        save();
    }

    function deleteItem(id, e) {
        e.stopPropagation();
        if(!confirm("Eliminar esta área permanentES?")) return;
        state.items = state.items.filter(i=>i.id !== id);
        save();
    }

    function toggleMenu() {
        const menu = document.getElementById('create-menu');
        const icon = document.getElementById('fab-icon');
        const isOpen = menu.style.display === 'block';
        menu.style.display = isOpen ? 'none' : 'block';
        icon.style.transform = isOpen ? 'rotate(0deg)' : 'rotate(45deg)';
    }

    function exportData() {
        const blob = new Blob([JSON.stringify(state.items)], {type: 'application/json'});
        const a = document.createElement('a');
        a.href = URL.createObjectURL(blob);
        a.download = `backup_organizer_${new Date().toISOString().slice(0,10)}.json`;
        a.click();
    }

    function importData() {
        const input = document.createElement('input');
        input.type = 'file';
        input.onchange = (e) => {
            const reader = new FileReader();
            reader.onload = (ev) => {
                state.items = JSON.parse(ev.target.result);
                save();
            };
            reader.readAsText(e.target.files[0]);
        };
        input.click();
    }

    function showToast(msg) {
        alert(msg); // Placeholder para sistema de toasts premium
    }

    // --- Clock ---
    setInterval(() => {
        const now = new Date();
        document.getElementById('clock').innerText = now.toLocaleDateString('pt-PT', { weekday: 'long', day: 'numeric', month: 'long', year: 'numeric', hour: '2-digit', minute: '2-digit' });
    }, 1000);

    // Init
    render();
</script>
</body>
</html>
