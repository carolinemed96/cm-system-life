<!DOCTYPE html>
<html lang="pt-PT">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Caroline Medeiros - Organizador Premium</title>
    
    <script src="https://unpkg.com/lucide@latest"></script>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@300;400;500;600;700;800;900&family=Playfair+Display:ital,wght@0,700;0,900;1,700&display=swap" rel="stylesheet">
    
    <style>
        :root {
            --chocolate: #3E2723;
            --chocolate-light: #5D4037;
            --off-white: #FDFBF7;
            --gold: #C5A059;
            --gold-light: #E0C080;
            --text-main: #3E2723;
            --bg-card: #FFFFFF;
            --transition: all 0.4s cubic-bezier(0.16, 1, 0.3, 1);
            --shadow-premium: 0 20px 40px rgba(62, 39, 35, 0.08);
            --danger: #A62121;
            --success: #3E6B27;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Montserrat', sans-serif; -webkit-font-smoothing: antialiased; }
        h1, h2, h3, .monogram, .huge-number { font-family: 'Playfair Display', serif; }

        body { 
            background-color: var(--off-white); 
            color: var(--text-main); 
            min-height: 100vh; 
            display: flex; 
            flex-direction: column;
            padding-bottom: 100px;
        }

        /* --- Access Control --- */
        #lock-screen { 
            position: fixed; inset: 0; background: var(--off-white); z-index: 9999; 
            display: flex; flex-direction: column; justify-content: center; align-items: center;
            transition: all 0.8s cubic-bezier(0.16, 1, 0.3, 1);
        }
        .lock-container { text-align: center; width: 80%; max-width: 320px; }
        .lock-input { 
            width: 100%; text-align: center; font-size: 2rem; letter-spacing: 15px; 
            border: none; border-bottom: 2px solid var(--gold); background: transparent;
            padding: 15px; outline: none; color: var(--chocolate); margin-bottom: 30px;
        }

        /* --- Navigation --- */
        header { 
            padding: 40px 20px; text-align: center; background: #fff; 
            border-bottom: 1px solid rgba(197, 160, 89, 0.1); position: sticky; top: 0; z-index: 100;
        }
        .monogram { font-size: 3rem; color: var(--chocolate); font-weight: 900; line-height: 0.8; }
        .brand-name { font-size: 0.7rem; text-transform: uppercase; letter-spacing: 6px; color: var(--gold); font-weight: 800; margin-top: 10px; }

        .bottom-nav {
            position: fixed; bottom: 20px; left: 20px; right: 20px; height: 70px;
            background: rgba(62, 39, 35, 0.98); backdrop-filter: blur(10px);
            border-radius: 25px; display: flex; justify-content: space-around; align-items: center;
            z-index: 500; box-shadow: 0 15px 35px rgba(0,0,0,0.2);
        }
        .nav-item { color: #fff; opacity: 0.4; display: flex; flex-direction: column; align-items: center; gap: 4px; cursor: pointer; transition: 0.3s; }
        .nav-item.active { opacity: 1; color: var(--gold); }
        .nav-item span { font-size: 0.55rem; font-weight: 800; text-transform: uppercase; letter-spacing: 1px; }

        /* --- Main Content --- */
        main { flex: 1; padding: 30px 6%; max-width: 1200px; margin: 0 auto; width: 100%; animation: fadeIn 0.6s ease; }
        .page-title { font-size: 2.2rem; font-weight: 900; color: var(--chocolate); margin-bottom: 30px; }
        
        .card { 
            background: var(--bg-card); border-radius: 30px; padding: 25px; 
            box-shadow: var(--shadow-premium); border: 1px solid rgba(0,0,0,0.02);
            margin-bottom: 20px; transition: var(--transition);
        }

        /* --- Module: Weight Focus --- */
        .hero-meta { 
            background: var(--chocolate); color: #fff; padding: 40px 20px; border-radius: 35px;
            text-align: center; border: 1px solid var(--gold); position: relative; overflow: hidden;
        }
        .hero-meta .label { font-size: 0.8rem; font-weight: 800; text-transform: uppercase; color: var(--gold); letter-spacing: 2px; }
        .hero-meta .huge-number { font-size: 5.5rem; font-weight: 900; margin: 10px 0; line-height: 1; }
        .hero-meta .unit { font-size: 1.5rem; color: var(--gold-light); }

        .stat-line { 
            display: flex; justify-content: space-around; margin-top: 30px; 
            padding-top: 25px; border-top: 1px solid rgba(255,255,255,0.1); 
        }
        .stat-box { text-align: center; }
        .stat-box small { font-size: 0.6rem; font-weight: 800; color: var(--gold-light); text-transform: uppercase; display: block; }
        .stat-box b { font-size: 1.3rem; font-weight: 700; }

        /* --- Dieta & Saúde --- */
        .info-pill { 
            background: var(--off-white); padding: 15px; border-radius: 20px; margin-bottom: 12px;
            border-left: 4px solid var(--gold);
        }
        .info-pill b { display: block; font-size: 0.75rem; color: var(--gold); margin-bottom: 5px; text-transform: uppercase; font-weight: 800; }
        .info-pill p { font-size: 0.95rem; line-height: 1.5; color: var(--chocolate-light); white-space: pre-wrap; }

        /* --- Forms & Buttons --- */
        .form-group { margin-bottom: 20px; }
        .form-group label { display: block; font-size: 0.7rem; font-weight: 800; color: var(--gold); margin-bottom: 8px; text-transform: uppercase; }
        .form-control { 
            width: 100%; padding: 16px; border: 1px solid #eee; border-radius: 16px;
            font-size: 1rem; background: #fafafa; outline: none; color: var(--chocolate);
        }
        textarea.form-control { min-height: 60px; resize: none; overflow: hidden; }

        .btn-main { 
            background: var(--chocolate); color: white; border: none; padding: 16px 30px;
            border-radius: 50px; font-weight: 800; font-size: 0.85rem; cursor: pointer; width: 100%;
            transition: 0.3s; letter-spacing: 1px;
        }

        /* --- Menstrual --- */
        .cal-grid { display: grid; grid-template-columns: repeat(7, 1fr); gap: 10px; margin-top: 20px; }
        .cal-day { aspect-ratio: 1; display: flex; align-items: center; justify-content: center; font-weight: 800; font-size: 0.8rem; border-radius: 50%; cursor: pointer; color: var(--chocolate); }
        .cal-day.period { background: rgba(166, 33, 33, 0.1); color: var(--danger); border: 1px solid rgba(166, 33, 33, 0.2); }
        .cal-day.fertile { background: rgba(197, 160, 89, 0.15); color: var(--gold); }
        .cal-day.today { border: 2px solid var(--chocolate); }

        @keyframes fadeIn { from { opacity: 0; transform: translateY(15px); } to { opacity: 1; transform: translateY(0); } }
        
        #modal-overlay { position: fixed; inset: 0; background: rgba(62, 39, 35, 0.7); backdrop-filter: blur(10px); z-index: 1000; display: none; justify-content: center; align-items: center; padding: 20px; }
        .modal { background: #fff; width: 100%; max-width: 480px; border-radius: 40px; padding: 35px; max-height: 85vh; overflow-y: auto; }
    </style>
</head>
<body>

<div id="lock-screen">
    <div class="lock-container">
        <div class="monogram">CM</div>
        <div class="brand-name" style="margin-bottom:50px;">Private Organizer</div>
        <input type="password" id="pin" class="lock-input" placeholder="••••" maxlength="4" autocomplete="off">
        <button onclick="access()" class="btn-main">ENTRAR NO SISTEMA</button>
    </div>
</div>

<header>
    <div class="monogram">CM</div>
    <div class="brand-name">Caroline Medeiros</div>
</header>

<div class="navigation-bar" id="breadcrumbs"></div>

<main id="view"></main>

<nav class="bottom-nav">
    <div class="nav-item active" onclick="goBack(0)"><i data-lucide="layout"></i><span>Home</span></div>
    <div class="nav-item" onclick="navigate('saude')"><i data-lucide="heart-pulse"></i><span>Health</span></div>
    <div class="nav-item" onclick="navigate('financeiro')"><i data-lucide="wallet"></i><span>Money</span></div>
    <div class="nav-item" onclick="navigate('biblia')"><i data-lucide="book-marked"></i><span>Bible</span></div>
    <div class="nav-item" onclick="toggleFab()"><i data-lucide="plus-circle"></i><span>Novo</span></div>
</nav>

<!-- FAB Menu -->
<div id="fab-overlay" style="position:fixed; inset:0; z-index:450; display:none;" onclick="this.style.display='none'">
    <div style="position:absolute; bottom:100px; right:30px; background:#fff; border-radius:25px; box-shadow:var(--shadow-elevated); width:200px; overflow:hidden;">
        <div style="padding:18px; font-size:0.8rem; font-weight:800; border-bottom:1px solid #f5f5f5;" onclick="openModal('custom_area')">Nova Área</div>
        <div style="padding:18px; font-size:0.8rem; font-weight:800; border-bottom:1px solid #f5f5f5;" onclick="openModal('visionboard')">Visionboard</div>
        <div style="padding:18px; font-size:0.8rem; font-weight:800; border-bottom:1px solid #f5f5f5;" onclick="exportData()">Exportar Backup</div>
        <div style="padding:18px; font-size:0.8rem; font-weight:800;" onclick="importData()">Importar Dados</div>
    </div>
</div>

<div id="modal-overlay">
    <div class="modal">
        <h2 id="modal-title" style="margin-bottom:25px; color:var(--chocolate); text-align:center;"></h2>
        <div id="modal-body"></div>
        <div style="display:flex; gap:12px; margin-top:30px;">
            <button class="btn-main" style="background:#f0f0f0; color:#888;" onclick="closeModal()">Sair</button>
            <button class="btn-main" id="modal-save">Salvar</button>
        </div>
    </div>
</div>

<div id="lightbox" onclick="this.style.display='none'" style="position:fixed; inset:0; background:rgba(0,0,0,0.95); z-index:2000; display:none; justify-content:center; align-items:center;">
    <img id="lb-img" style="max-width:90%; max-height:85vh; border-radius:15px;">
</div>

<script>
    // --- State ---
    let state = {
        path: ['root'],
        items: JSON.parse(localStorage.getItem('cm_db_v8')) || [],
        menstrual: JSON.parse(localStorage.getItem('cm_men_v8')) || { cycle: 28, flow: 5, last: "" }
    };

    function save() {
        localStorage.setItem('cm_db_v8', JSON.stringify(state.items));
        localStorage.setItem('cm_men_v8', JSON.stringify(state.menstrual));
        render();
    }

    function access() {
        if(document.getElementById('pin').value === "2405") {
            document.getElementById('lock-screen').style.transform = 'scale(1.1)';
            document.getElementById('lock-screen').style.opacity = '0';
            setTimeout(() => document.getElementById('lock-screen').style.display = 'none', 600);
        }
    }

    function navigate(id) { state.path.push(id); render(); }
    function goBack(idx) { state.path = state.path.slice(0, idx + 1); render(); }

    // --- Core Logic ---
    function getWeightStats() {
        const w = state.items.find(i => i.type === 'health_weight');
        if(!w || !w.content.target) return null;
        const current = w.content.history?.length ? w.content.history.sort((a,b)=>new Date(b.date)-new Date(a.date))[0].weight : w.content.startWeight;
        const diff = current - w.content.target;
        const start = new Date(w.content.startDate);
        const end = new Date(start); end.setMonth(start.getMonth() + (parseInt(w.content.periodMonths) || 1));
        const monthsRem = Math.max(1, Math.ceil((end - new Date()) / (86400000 * 30.41)));
        let h = parseFloat(w.content.height); if(h > 3) h /= 100;
        return { 
            mma: diff > 0 ? (diff / monthsRem).toFixed(2) : "0.00", 
            current, imc: h > 0 ? (current / (h * h)).toFixed(1) : "--", 
            water: (current * 0.035).toFixed(1) 
        };
    }

    // --- Renderers ---
    function render() {
        const cur = state.path[state.path.length - 1];
        const main = document.getElementById('view');
        const bread = document.getElementById('breadcrumbs');

        document.querySelectorAll('.nav-item').forEach(n => n.classList.remove('active'));
        const tab = document.querySelector(`.nav-item[onclick*="${cur}"]`);
        if(tab) tab.classList.add('active');

        bread.innerHTML = state.path.map((id, i) => {
            const label = id === 'root' ? 'Início' : (CATEGORIES.find(c=>c.id===id)?.name || state.items.find(it=>it.id===id)?.name || id);
            return `<span class="breadcrumb-item" onclick="goBack(${i})">${i>0?'<i data-lucide="chevron-right" style="width:12px"></i>':''} ${label}</span>`;
        }).join('');

        if (cur === 'root') renderHome(main);
        else if (cur === 'saude') renderSaude(main);
        else if (cur === 'financeiro') renderFinanceiro(main);
        else if (cur === 'biblia') renderBiblia(main);
        else renderGeneralFolder(main, cur);

        if(window.lucide) lucide.createIcons();
    }

    function renderHome(el) {
        el.innerHTML = `
            <div class="page-title">Bem-vinda, Caroline</div>
            <div class="grid-container">
                ${CATEGORIES.map(c => `
                    <div class="card" style="display:flex; align-items:center; cursor:pointer;" onclick="navigate('${c.id}')">
                        <div style="width:50px; height:50px; background:var(--off-white); border-radius:15px; display:flex; align-items:center; justify-content:center; color:var(--gold); margin-right:15px;"><i data-lucide="${c.icon}"></i></div>
                        <b style="font-size:1.1rem; color:var(--chocolate)">${c.name}</b>
                    </div>
                `).join('')}
                ${state.items.filter(i => i.type === 'custom_area' && i.parentId === 'root').map(i => `
                    <div class="card" style="display:flex; align-items:center; cursor:pointer;" onclick="navigate('${i.id}')">
                        <div style="width:50px; height:50px; background:var(--off-white); border-radius:15px; display:flex; align-items:center; justify-content:center; color:var(--gold); margin-right:15px;"><i data-lucide="star"></i></div>
                        <b style="font-size:1.1rem; color:var(--chocolate); flex:1">${i.name}</b>
                        <i data-lucide="trash-2" style="width:16px; opacity:0.2;" onclick="deleteItem('${i.id}', event)"></i>
                    </div>
                `).join('')}
            </div>
        `;
    }

    function renderSaude(el) {
        const stats = getWeightStats();
        const weightItem = state.items.find(i => i.type === 'health_weight');
        const diet = state.items.find(i => i.type === 'health_food') || { content: {} };
        const meds = state.items.filter(i => i.type === 'health_med');

        el.innerHTML = `
            <div class="hero-meta">
                <span class="label">Meta Mensal Restante</span>
                <div class="huge-number">${stats ? stats.mma : '--'}<small class="unit">kg</small></div>
                <div class="stat-line">
                    <div class="stat-box"><small>Peso Atual</small><b>${stats ? stats.current : '--'}kg</b></div>
                    <div class="stat-box"><small>IMC Corporal</small><b>${stats ? stats.imc : '--'}</b></div>
                    <div class="stat-box"><small>Meta Água</small><b>${stats ? stats.water : '--'}L</b></div>
                </div>
            </div>

            <div class="grid-container" style="margin-top:20px;">
                <div class="card" style="display:block;">
                    <div class="section-header"><h2>Alimentação</h2><i data-lucide="utensils" onclick="openModal('health_food')" style="color:var(--gold); cursor:pointer;"></i></div>
                    <div class="info-pill"><b>Café (${diet.content.bt||'--'})</b><p>${diet.content.b||'Nenhum plano'}</p></div>
                    <div class="info-pill"><b>Almoço (${diet.content.lt||'--'})</b><p>${diet.content.l||'Nenhum plano'}</p></div>
                    <div class="info-pill"><b>Jantar (${diet.content.dt||'--'})</b><p>${diet.content.d||'Nenhum plano'}</p></div>
                    <div style="background:var(--chocolate); color:#fff; padding:15px; border-radius:15px; text-align:center; font-weight:700; font-size:0.8rem;">JEJUM: ${diet.content.fs||'00:00'} às ${diet.content.fe||'00:00'}</div>
                </div>

                <div class="card" style="display:block;">
                    <div class="section-header"><h2>Medicamentos</h2><i data-lucide="plus-circle" onclick="openModal('health_med')" style="color:var(--gold); cursor:pointer;"></i></div>
                    ${meds.length ? meds.map(m => `
                        <div style="display:flex; justify-content:space-between; align-items:center; padding:12px 0; border-bottom:1px solid #f5f5f5;">
                            <div><b style="font-size:0.9rem;">${m.name}</b><br><small style="color:var(--gold); font-weight:700;">${m.content.time} - ${m.content.dose}</small></div>
                            <i data-lucide="trash-2" style="width:14px; color:var(--danger); opacity:0.3; cursor:pointer" onclick="deleteItem('${m.id}')"></i>
                        </div>
                    `).join('') : '<p style="font-size:0.8rem; opacity:0.5;">Nenhum medicamento listado.</p>'}
                </div>

                <div class="card" style="display:block;">
                    <div class="section-header"><h2>Ciclo Menstrual</h2><i data-lucide="settings" onclick="openModal('menstrual_config')" style="color:var(--gold); cursor:pointer;"></i></div>
                    ${renderMenstrualCalendar()}
                </div>
            </div>

            <button class="btn-main" style="margin-top:20px;" onclick="openModal('health_weight_register')">REGISTAR NOVO PESO</button>
            ${weightItem ? `<button class="btn-main" style="margin-top:10px; background:#f0f0f0; color:#888;" onclick="openModal('health_weight_config')">CONFIGURAR METAS</button>` : ''}
        `;
    }

    function renderMenstrualCalendar() {
        const now = new Date();
        const last = new Date(state.menstrual.last + 'T12:00:00');
        const cycle = parseInt(state.menstrual.cycle);
        const dur = parseInt(state.menstrual.flow);
        
        let html = `<div style="display:grid; grid-template-columns: repeat(7, 1fr); text-align:center; font-size:0.6rem; font-weight:900; color:var(--gold); margin-bottom:10px;">
            <div>D</div><div>S</div><div>T</div><div>Q</div><div>Q</div><div>S</div><div>S</div></div><div class="cal-grid">`;
        
        const startDay = new Date(now.getFullYear(), now.getMonth(), 1).getDay();
        const days = new Date(now.getFullYear(), now.getMonth() + 1, 0).getDate();

        for(let i=0; i<startDay; i++) html += `<div></div>`;
        for(let d=1; d<=days; d++) {
            const current = new Date(now.getFullYear(), now.getMonth(), d);
            const diff = Math.floor((current - last) / (86400000));
            const dayInCycle = ((diff % cycle) + cycle) % cycle;
            
            let cls = "cal-day";
            if(dayInCycle < dur) cls += " period";
            if(dayInCycle >= cycle - 16 && dayInCycle <= cycle - 11) cls += " fertile";
            if(d === now.getDate()) cls += " today";

            html += `<div class="${cls}">${d}</div>`;
        }
        return html + `</div>`;
    }

    function renderFinanceiro(el) {
        const income = state.items.filter(i => i.type === 'finance_in');
        const expense = state.items.filter(i => i.type === 'finance_out');
        const totalIn = income.reduce((a,b)=>a+parseFloat(b.content.value||0), 0);
        const totalOut = expense.reduce((a,b)=>a+parseFloat(b.content.value||0), 0);

        el.innerHTML = `
            <div class="hero-meta" style="background:#fff; border-color:#eee; color:var(--chocolate);">
                <span class="label" style="color:var(--gold)">Balanço Mensal</span>
                <div class="huge-number" style="color:var(--chocolate)">€ ${(totalIn - totalOut).toFixed(2)}</div>
                <div class="stat-line">
                    <div class="stat-box"><small>Entradas</small><b style="color:var(--success)">€ ${totalIn.toFixed(2)}</b></div>
                    <div class="stat-box"><small>Saídas</small><b style="color:var(--danger)">€ ${totalOut.toFixed(2)}</b></div>
                </div>
            </div>
            <div class="grid-container">
                <div class="card" onclick="navigate('folder_in')"><b style="font-size:1.1rem; color:var(--chocolate)">Receitas</b></div>
                <div class="card" onclick="navigate('folder_out')"><b style="font-size:1.1rem; color:var(--chocolate)">Despesas</b></div>
                <div class="card" onclick="navigate('folder_invest')"><b style="font-size:1.1rem; color:var(--chocolate)">Investimentos</b></div>
            </div>
        `;
    }

    async function renderBiblia(el) {
        el.innerHTML = `<h2 class="page-title">Bíblia NVI</h2>
        <div style="display:flex; gap:10px; margin-bottom:20px;">
            <select id="b-book" class="form-control" style="flex:2;" onchange="state.bible.book=this.value; fetchBible();"></select>
            <input type="number" id="b-cap" class="form-control" style="flex:1;" value="${state.bible.chapter}" onchange="state.bible.chapter=this.value; fetchBible();">
        </div>
        <div id="bib-text" class="card" style="display:block; min-height:400px; line-height:1.8; font-size:1rem; color:#444;">Buscando Escrituras...</div>`;
        
        const books = ["Gênesis", "Êxodo", "Levítico", "Números", "Deuteronômio", "Josué", "Juízes", "Rute", "1 Samuel", "2 Samuel", "1 Reis", "2 Reis", "1 Crônicas", "2 Crônicas", "Esdras", "Neemias", "Ester", "Jó", "Salmos", "Provérbios", "Eclesiastes", "Cânticos", "Isaías", "Jeremias", "Lamentações", "Ezequiel", "Daniel", "Oseias", "Joel", "Amós", "Obadias", "Jonas", "Miqueias", "Naum", "Habacuque", "Sofonias", "Ageu", "Zacarias", "Malaquias", "Mateus", "Marcos", "Lucas", "João", "Atos", "Romanos", "1 Coríntios", "2 Coríntios", "Gálatas", "Efésios", "Filipenses", "Colossenses", "1 Tessalonicenses", "2 Tessalonicenses", "1 Timóteo", "2 Timóteo", "Tito", "Filemom", "Hebreus", "Tiago", "1 Pedro", "2 Pedro", "1 João", "2 João", "3 João", "Judas", "Apocalipse"];
        const sel = document.getElementById('b-book');
        books.forEach(b => {
            const opt = document.createElement('option'); opt.value = b; opt.innerText = b;
            if(b === state.bible.book) opt.selected = true;
            sel.appendChild(opt);
        });
        fetchBible();
    }

    async function fetchBible() {
        const el = document.getElementById('bib-text');
        try {
            const res = await fetch('https://raw.githubusercontent.com/thiagobodruk/bible/master/json/pt_nvi.json');
            const data = await res.json();
            const book = data.find(b => b.name === state.bible.book);
            const verses = book.chapters[state.bible.chapter - 1];
            el.innerHTML = verses.map((v, i) => `<p style="margin-bottom:15px;"><sup style="color:var(--gold); font-weight:900; margin-right:8px;">${i+1}</sup>${v}</p>`).join('');
        } catch(e) { el.innerHTML = "Escrituras não encontradas no momento."; }
    }

    function renderGeneralFolder(el, pid) {
        const folder = state.items.find(i => i.id === pid);
        const items = state.items.filter(i => i.parentId === pid);
        
        if (folder?.type === 'visionboard') {
            el.innerHTML = `<div class="section-header"><h2>Mural</h2><button class="btn-main" style="width:auto; padding:10px 20px" onclick="openModal('vision_add', '${pid}')">Adicionar</button></div>
            <div class="mural-grid">${(folder.content.images || []).map((img, idx) => `
                <div class="mural-item">
                    <img src="${img.data}" class="mural-img" onclick="showLightbox('${img.data}')">
                    <div class="mural-cap">${img.caption}</div>
                    <button class="btn-mini" style="position:absolute; top:8px; right:8px; background:rgba(255,255,255,0.8)" onclick="deleteVisionImg('${pid}', ${idx})"><i data-lucide="x" style="width:14px"></i></button>
                </div>`).join('')}</div>`;
            return;
        }

        el.innerHTML = `<div class="section-header"><h2>Conteúdo</h2><i data-lucide="plus-circle" onclick="openModal('item_add', '${pid}')" style="color:var(--gold); cursor:pointer"></i></div><div class="grid-container">${items.map(i => `
            <div class="card" style="display:flex; justify-content:space-between; align-items:center;">
                <b onclick="navigate('${i.id}')" style="cursor:pointer; flex:1;">${i.name}</b>
                <i data-lucide="trash-2" style="width:14px; opacity:0.2; color:var(--danger); cursor:pointer" onclick="deleteItem('${i.id}')"></i>
            </div>`).join('')}</div>`;
    }

    // --- Modal Logic ---
    function openModal(type, extra = null) {
        const modal = document.getElementById('modal-overlay');
        const body = document.getElementById('mb');
        const title = document.getElementById('mt');
        const saveBtn = document.getElementById('modal-save');
        modal.style.display = 'flex';
        
        let html = '';
        if(type === 'health_food') {
            const d = state.items.find(i=>i.type === 'health_food') || {content:{}};
            title.innerText = "Dieta e Jejum";
            html = `<div class="form-group"><label>Café</label><input type="time" id="f-bt" class="form-control" value="${d.content.bt||'08:00'}"><textarea id="f-b" class="form-control">${d.content.b||''}</textarea></div>
                    <div class="form-group"><label>Almoço</label><input type="time" id="f-lt" class="form-control" value="${d.content.lt||'12:30'}"><textarea id="f-l" class="form-control">${d.content.l||''}</textarea></div>
                    <div class="form-group"><label>Jantar</label><input type="time" id="f-dt" class="form-control" value="${d.content.dt||'19:30'}"><textarea id="f-d" class="form-control">${d.content.d||''}</textarea></div>
                    <div class="form-group"><label>Jejum (Início/Fim)</label><div style="display:flex;gap:5px;"><input type="time" id="f-fs" class="form-control" value="${d.content.fs||'20:00'}"><input type="time" id="f-fe" class="form-control" value="${d.content.fe||'08:00'}"></div></div>`;
        }
        else if (type === 'health_med') {
            title.innerText = "Novo Medicamento";
            html = `<div class="form-group"><label>Nome</label><input id="f-name" class="form-control"></div>
                    <div class="form-group"><label>Dose</label><input id="f-dose" class="form-control" placeholder="ex: 500mg"></div>
                    <div class="form-group"><label>Horário</label><input type="time" id="f-time" class="form-control"></div>`;
        }
        else if (type === 'health_weight_config') {
            const w = state.items.find(i=>i.type === 'health_weight') || {content:{}};
            title.innerText = "Ajustar Metas";
            html = `<div class="form-group"><label>Peso Inicial (kg)</label><input type="number" id="f-start" class="form-control" value="${w.content.startWeight||''}"></div>
                    <div class="form-group"><label>Meta Final (kg)</label><input type="number" id="f-target" class="form-control" value="${w.content.target||''}"></div>
                    <div class="form-group"><label>Altura (m)</label><input type="number" id="f-height" class="form-control" value="${w.content.height||''}" step="0.01"></div>
                    <div class="form-group"><label>Prazo (Meses)</label><input type="number" id="f-months" class="form-control" value="${w.content.periodMonths||''}"></div>
                    <div class="form-group"><label>Data Início</label><input type="date" id="f-date" class="form-control" value="${w.content.startDate||''}"></div>`;
        }
        else if (type === 'health_weight_register') {
            title.innerText = "Novo Peso";
            html = `<div class="form-group"><label>Peso (kg)</label><input type="number" id="f-weight" class="form-control" step="0.1" autofocus></div>
                    <div class="form-group"><label>Data</label><input type="date" id="f-date" class="form-control" value="${new Date().toISOString().split('T')[0]}"></div>`;
        }
        else if (type === 'menstrual_config') {
            title.innerText = "Ciclo";
            html = `<div class="form-group"><label>Ciclo (Dias)</label><input type="number" id="f-c" class="form-control" value="${state.menstrual.cycle}"></div>
                    <div class="form-group"><label>Fluxo (Dias)</label><input type="number" id="f-f" class="form-control" value="${state.menstrual.flow}"></div>
                    <div class="form-group"><label>Última Menstruação</label><input type="date" id="f-l" class="form-control" value="${state.menstrual.last}"></div>`;
        }
        else if (type === 'custom_area') {
            title.innerText = "Nova Área";
            html = `<div class="form-group"><label>Nome</label><input id="f-name" class="form-control"></div>`;
        }
        else if (type === 'visionboard') {
            title.innerText = "Mural";
            html = `<div class="form-group"><label>Título</label><input id="f-name" class="form-control"></div>`;
        }
        else if (type === 'vision_add') {
            title.innerText = "Nova Meta";
            html = `<div class="form-group"><label>Foto</label><input type="file" id="f-img" class="form-control"></div>
                    <div class="form-group"><label>Legenda</label><textarea id="f-cap" class="form-control"></textarea></div>`;
        }

        body.innerHTML = html;
        saveBtn.onclick = () => handleSave(type, extra);
    }

    async function handleSave(type, extra) {
        const val = id => document.getElementById(id)?.value;
        if(type === 'health_food') {
            let hf = state.items.find(i=>i.type === 'health_food');
            const data = { bt: val('f-bt'), b: val('f-b'), lt: val('f-lt'), l: val('f-l'), dt: val('f-dt'), d: val('f-d'), fs: val('f-fs'), fe: val('f-fe') };
            if(!hf) state.items.push({ id: 'diet', type: 'health_food', parentId: 'saude', name: 'Dieta', content: data });
            else hf.content = data;
        }
        else if(type === 'health_med') {
            state.items.push({ id: 'med'+Date.now(), type: 'health_med', parentId: 'saude', name: val('f-name'), content: { dose: val('f-dose'), time: val('f-time') } });
        }
        else if (type === 'health_weight_config') {
            let hw = state.items.find(i=>i.type === 'health_weight');
            const data = { startWeight: parseFloat(val('f-start')), target: parseFloat(val('f-target')), height: parseFloat(val('f-height')), periodMonths: val('f-months'), startDate: val('f-date') };
            if(!hw) state.items.push({ id: 'hw', type: 'health_weight', parentId: 'saude', name: 'Peso', content: { ...data, history: [] } });
            else hw.content = { ...hw.content, ...data };
        }
        else if (type === 'health_weight_register') {
            const hw = state.items.find(i=>i.type === 'health_weight');
            if(!hw.content.history) hw.content.history = [];
            hw.content.history.push({ id: 'w'+Date.now(), date: val('f-date'), weight: parseFloat(val('f-weight')) });
        }
        else if (type === 'menstrual_config') {
            state.menstrual = { cycle: val('f-c'), flow: val('f-f'), last: val('f-l') };
        }
        else if (type === 'custom_area') {
            state.items.push({ id: 'a'+Date.now(), parentId: 'root', type: 'custom_area', name: val('f-name') });
        }
        else if (type === 'visionboard') {
            state.items.push({ id: 'vb'+Date.now(), parentId: state.path[state.path.length-1], type: 'visionboard', name: val('f-name'), content: { images: [] } });
        }
        else if (type === 'vision_add') {
            const f = document.getElementById('f-img').files[0];
            const r = new FileReader();
            r.onload = (e) => {
                const vb = state.items.find(i => i.id === extra);
                if(!vb.content.images) vb.content.images = [];
                vb.content.images.push({ data: e.target.result, caption: val('f-cap') });
                sync(); closeModal();
            };
            if(f) r.readAsDataURL(f); return;
        }

        sync(); closeModal();
    }

    // --- Helpers ---
    function closeModal() { document.getElementById('modal-overlay').style.display = 'none'; }
    function showLightbox(src) { document.getElementById('li').src = src; document.getElementById('lightbox').style.display = 'flex'; }
    function toggleFab() { document.getElementById('fab-overlay').style.display = 'block'; }
    function deleteItem(id, e) { if(e) e.stopPropagation(); if(confirm("Apagar?")) { state.items = state.items.filter(i=>i.id !== id); sync(); } }
    function deleteVisionImg(vid, idx) { if(confirm("Apagar?")) { state.items.find(i=>i.id===vid).content.images.splice(idx,1); sync(); } }
    function editWeight(hid) { const hw = state.items.find(i=>i.type==='health_weight'); const h = hw.content.history.find(x=>x.id===hid); const nw = prompt("Peso (kg):", h.weight); if(nw){ h.weight=parseFloat(nw); sync(); } }
    function deleteWeight(hid) { if(confirm("Apagar?")) { const hw = state.items.find(i=>i.type==='health_weight'); hw.content.history = hw.content.history.filter(x=>x.id!==hid); sync(); } }
    function exportData() { const blob = new Blob([JSON.stringify(state)], {type: 'application/json'}); const a = document.createElement('a'); a.href = URL.createObjectURL(blob); a.download = 'organizador_caroline.json'; a.click(); }
    function importData() { const input = document.createElement('input'); input.type = 'file'; input.onchange = e => { const r = new FileReader(); r.onload = ev => { state = JSON.parse(ev.target.result); sync(); }; r.readAsText(e.target.files[0]); }; input.click(); }

    render();
</script>
</body>
</html>
