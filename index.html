<!DOCTYPE html>
<html lang="pt-PT">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Caroline Medeiros - Organizador Premium</title>
    
    <script src="https://unpkg.com/lucide@latest"></script>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@300;400;500;600;700;800&family=Playfair+Display:ital,wght@0,600;0,700;1,600&display=swap" rel="stylesheet">
    
    <style>
        :root {
            --chocolate: #3E2723;
            --chocolate-light: #5D4037;
            --off-white: #FDFBF7;
            --gold: #C5A059;
            --gold-light: #E0C080;
            --text-main: #3E2723;
            --bg-card: #FFFFFF;
            --transition: all 0.3s cubic-bezier(0.25, 0.8, 0.25, 1);
            --shadow-soft: 0 8px 30px rgba(62, 39, 35, 0.05);
            --shadow-elevated: 0 15px 45px rgba(62, 39, 35, 0.12);
            --danger: #A62121;
            --success: #3E6B27;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Montserrat', sans-serif; -webkit-font-smoothing: antialiased; }
        h1, h2, h3, .monogram { font-family: 'Playfair Display', serif; }

        body { background-color: var(--off-white); color: var(--text-main); min-height: 100vh; display: flex; flex-direction: column; overflow-x: hidden; padding-bottom: 90px; }

        /* --- Lock Screen --- */
        #lock-screen { position: fixed; inset: 0; background: var(--off-white); z-index: 5000; display: flex; flex-direction: column; justify-content: center; align-items: center; transition: transform 0.6s cubic-bezier(0.8, 0, 0.2, 1); }
        .lock-input { text-align: center; font-size: 1.8rem; letter-spacing: 12px; border-radius: 16px; border: 2px solid var(--gold); padding: 18px; width: 220px; outline: none; background: #fff; color: var(--chocolate); margin-bottom: 20px; box-shadow: var(--shadow-soft); }

        /* --- Header --- */
        header { padding: 25px 20px; text-align: center; background: rgba(255, 255, 255, 0.8); backdrop-filter: blur(15px); border-bottom: 1px solid rgba(197, 160, 89, 0.1); position: sticky; top: 0; z-index: 100; }
        .monogram { font-size: 2.2rem; color: var(--chocolate); line-height: 1; }
        .brand-name { font-size: 0.65rem; text-transform: uppercase; letter-spacing: 5px; color: var(--gold); font-weight: 800; }

        .navigation-bar { padding: 12px 5%; background: #fff; display: flex; align-items: center; gap: 8px; font-size: 0.75rem; border-bottom: 1px solid #f0f0f0; overflow-x: auto; white-space: nowrap; }
        .breadcrumb-item { cursor: pointer; color: var(--chocolate-light); font-weight: 700; opacity: 0.6; display: flex; align-items: center; gap: 4px; }
        .breadcrumb-item:last-child { opacity: 1; color: var(--gold); }

        /* --- Bottom Nav --- */
        .bottom-nav { position: fixed; bottom: 0; left: 0; right: 0; height: 75px; background: #fff; display: flex; justify-content: space-around; align-items: center; border-top: 1px solid #f0f0f0; z-index: 400; box-shadow: 0 -5px 25px rgba(0,0,0,0.03); }
        .nav-tab { display: flex; flex-direction: column; align-items: center; gap: 4px; color: var(--chocolate-light); cursor: pointer; transition: 0.3s; flex: 1; opacity: 0.4; }
        .nav-tab.active { opacity: 1; color: var(--gold); }
        .nav-tab span { font-size: 0.6rem; font-weight: 800; text-transform: uppercase; }

        /* --- Layout --- */
        main { flex: 1; padding: 20px 5%; max-width: 1100px; margin: 0 auto; width: 100%; animation: fadeIn 0.4s ease; }
        .grid-container { display: grid; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); gap: 20px; }
        .card { background: var(--bg-card); padding: 22px; border-radius: 24px; box-shadow: var(--shadow-soft); border: 1px solid rgba(0,0,0,0.02); position: relative; }
        
        /* --- Widgets --- */
        .weight-hero { background: var(--chocolate); color: white; padding: 30px 20px; border-radius: 28px; text-align: center; border: 2px solid var(--gold); margin-bottom: 20px; }
        .meta-val { font-size: 4rem; font-weight: 900; color: #fff; line-height: 1; }
        
        .cal-grid { display: grid; grid-template-columns: repeat(7, 1fr); gap: 5px; margin-top: 15px; }
        .cal-day { aspect-ratio: 1; display: flex; align-items: center; justify-content: center; border-radius: 50%; font-size: 0.85rem; font-weight: 700; cursor: pointer; color: var(--chocolate); position: relative; }
        .cal-day.period { background: rgba(166, 33, 33, 0.15); color: var(--danger); }
        .cal-day.fertile { background: rgba(197, 160, 89, 0.15); color: var(--gold); }
        .cal-day.today { border: 2px solid var(--gold); }

        .mural-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(140px, 1fr)); gap: 12px; }
        .mural-item { border-radius: 18px; overflow: hidden; position: relative; aspect-ratio: 3/4; background: #eee; }
        .mural-img { width: 100%; height: 100%; object-fit: cover; }
        .mural-cap { position: absolute; bottom: 0; width: 100%; padding: 8px; background: rgba(62, 39, 35, 0.8); color: white; font-size: 0.7rem; text-align: center; font-weight: 600; }

        /* --- Forms --- */
        .form-group { margin-bottom: 18px; }
        .form-group label { display: block; font-size: 0.7rem; font-weight: 800; text-transform: uppercase; color: var(--gold); margin-bottom: 6px; letter-spacing: 1px; }
        .form-control { width: 100%; padding: 14px; border: 1px solid #eee; border-radius: 12px; font-size: 1rem; background: #fafafa; outline: none; transition: 0.3s; }
        .form-control:focus { border-color: var(--gold); background: #fff; }
        textarea.form-control { min-height: 50px; resize: none; overflow: hidden; }

        .btn-primary { background: var(--chocolate); color: white; border: none; padding: 14px 28px; border-radius: 50px; font-weight: 800; font-size: 0.8rem; cursor: pointer; width: 100%; box-shadow: 0 8px 20px rgba(62, 39, 35, 0.15); }
        .btn-mini { width: 32px; height: 32px; border-radius: 50%; background: var(--off-white); border: 1px solid #eee; display: flex; align-items: center; justify-content: center; cursor: pointer; color: var(--chocolate); }

        #modal-overlay { position: fixed; inset: 0; background: rgba(62, 39, 35, 0.5); backdrop-filter: blur(8px); z-index: 1000; display: none; justify-content: center; align-items: center; padding: 20px; }
        .modal-content { background: #fff; width: 100%; max-width: 450px; border-radius: 32px; padding: 25px; max-height: 90vh; overflow-y: auto; position: relative; }

        @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
    </style>
</head>
<body autocomplete="off">

<div id="lock-screen">
    <div class="monogram">CM</div>
    <div class="brand-name" style="margin-bottom:40px;">Segurança Premium</div>
    <input type="password" id="pin-input" class="lock-input" placeholder="••••" maxlength="4" autocomplete="off">
    <div id="pin-error" style="color:var(--danger); font-size:0.75rem; font-weight:800; margin-top:-10px; margin-bottom:15px;"></div>
    <button onclick="unlock()" class="btn-primary" style="width:220px">ENTRAR</button>
</div>

<header>
    <div class="monogram">CM</div>
    <div class="brand-name">Caroline Medeiros</div>
</header>

<div class="navigation-bar" id="breadcrumbs"></div>

<main id="main-content"></main>

<nav class="bottom-nav">
    <div class="nav-tab" id="tab-root" onclick="goBack(0)"><i data-lucide="home"></i><span>Início</span></div>
    <div class="nav-tab" id="tab-saude" onclick="navigate('saude')"><i data-lucide="heart"></i><span>Saúde</span></div>
    <div class="nav-tab" id="tab-financeiro" onclick="navigate('financeiro')"><i data-lucide="trending-up"></i><span>Finanças</span></div>
    <div class="nav-tab" id="tab-biblia" onclick="navigate('biblia')"><i data-lucide="book-open"></i><span>Bíblia</span></div>
    <div class="nav-tab" onclick="toggleFab(event)"><i data-lucide="menu"></i><span>Menu</span></div>
</nav>

<div id="fab-overlay" style="position:fixed; inset:0; z-index:350; display:none;" onclick="this.style.display='none'">
    <div style="position:absolute; bottom:90px; right:20px; background:#fff; border-radius:20px; box-shadow:var(--shadow-elevated); width:200px; overflow:hidden; border:1px solid #eee;">
        <div style="padding:15px; display:flex; align-items:center; gap:10px; font-size:0.8rem; font-weight:700; color:var(--chocolate); border-bottom:1px solid #f9f9f9;" onclick="openModal('custom_area')"><i data-lucide="layout-grid" style="width:16px"></i> Nova Área</div>
        <div style="padding:15px; display:flex; align-items:center; gap:10px; font-size:0.8rem; font-weight:700; color:var(--chocolate); border-bottom:1px solid #f9f9f9;" onclick="openModal('visionboard')"><i data-lucide="image" style="width:16px"></i> Visionboard</div>
        <div style="padding:15px; display:flex; align-items:center; gap:10px; font-size:0.8rem; font-weight:700; color:var(--chocolate);" onclick="exportData()"><i data-lucide="download" style="width:16px"></i> Backup</div>
    </div>
</div>

<div id="modal-overlay">
    <div class="modal-content">
        <h3 id="mt" style="text-align:center; margin-bottom:20px; color:var(--chocolate)"></h3>
        <div id="mb"></div>
        <div style="display:flex; gap:10px; justify-content:flex-end; margin-top:25px;">
            <button class="btn-cancel" style="padding:12px 20px; border:none; background:#f0f0f0; border-radius:50px; font-weight:700; cursor:pointer;" onclick="closeModal()">Fechar</button>
            <button class="btn-primary" id="ms" style="width:auto; padding:12px 30px;">Salvar</button>
        </div>
    </div>
</div>

<div id="lightbox" onclick="this.style.display='none'" style="position:fixed; inset:0; background:rgba(0,0,0,0.9); z-index:2000; display:none; justify-content:center; align-items:center;"><img id="li" style="max-width:95%; max-height:90vh; border-radius:12px;"></div>

<script>
    // --- State & Storage ---
    let state = {
        path: ['root'],
        items: JSON.parse(localStorage.getItem('cm_p_v7')) || [],
        menstrual: JSON.parse(localStorage.getItem('cm_m_v7')) || { last: "", cycle: 28, flow: 5 },
        bible: { book: "Gênesis", chapter: 1 }
    };

    function sync() {
        localStorage.setItem('cm_p_v7', JSON.stringify(state.items));
        localStorage.setItem('cm_m_v7', JSON.stringify(state.menstrual));
        render();
    }

    function unlock() {
        if(document.getElementById('pin-input').value === "2405") {
            document.getElementById('lock-screen').style.transform = 'translateY(-100%)';
        } else {
            document.getElementById('pin-error').innerText = "ACESSO NEGADO";
            document.getElementById('pin-input').value = "";
        }
    }

    // --- Navigation ---
    const CATEGORIES = [
        { id: 'pessoal', name: 'Pessoal', icon: 'user' },
        { id: 'profissional', name: 'Profissional', icon: 'briefcase' },
        { id: 'lifestyle', name: 'Lifestyle', icon: 'sparkles' },
        { id: 'biblia', name: 'Bíblia', icon: 'book-open' },
        { id: 'financeiro', name: 'Financeiro', icon: 'trending-up' },
        { id: 'saude', name: 'Saúde', icon: 'heart' }
    ];

    function navigate(id) { state.path.push(id); render(); }
    function goBack(idx) { state.path = state.path.slice(0, idx + 1); render(); }

    // --- Renderers ---
    function render() {
        const cur = state.path[state.path.length - 1];
        const main = document.getElementById('main-content');
        const bread = document.getElementById('breadcrumbs');

        // Nav Tabs Active
        document.querySelectorAll('.nav-tab').forEach(t => t.classList.remove('active'));
        const activeTab = document.getElementById('tab-' + cur);
        if(activeTab) activeTab.classList.add('active');

        bread.innerHTML = state.path.map((id, i) => {
            const label = id === 'root' ? 'Início' : (CATEGORIES.find(c=>c.id===id)?.name || state.items.find(it=>it.id===id)?.name || id);
            return `<span class="breadcrumb-item" onclick="goBack(${i})">${i>0?'<i data-lucide="chevron-right" style="width:12px"></i>':''} ${label}</span>`;
        }).join('');

        if (cur === 'root') renderHome(main);
        else if (cur === 'saude') renderSaude(main);
        else if (cur === 'financeiro') renderFinanceiro(main);
        else if (cur === 'biblia') renderBiblia(main);
        else renderFolder(main, cur);

        if(window.lucide) lucide.createIcons();
    }

    function renderHome(el) {
        el.innerHTML = `<div style="background:var(--chocolate); padding:25px; border-radius:28px; color:#fff; margin-bottom:25px; border:2px solid var(--gold); position:relative; overflow:hidden;">
            <h1 style="font-size:1.6rem; margin-bottom:5px;">Olá, Caroline</h1>
            <p style="opacity:0.7; font-size:0.75rem; font-weight:600;">Seu organizador pessoal de elite</p>
        </div>
        <div class="section-header"><h2>Categorias</h2></div>
        <div class="grid-container">
            ${CATEGORIES.map(c => `<div class="card" style="display:flex; align-items:center; cursor:pointer;" onclick="navigate('${c.id}')">
                <div style="width:45px; height:45px; background:var(--off-white); border-radius:12px; display:flex; align-items:center; justify-content:center; color:var(--gold); margin-right:15px;"><i data-lucide="${c.icon}"></i></div>
                <b style="font-size:0.95rem; color:var(--chocolate)">${c.name}</b>
            </div>`).join('')}
            ${state.items.filter(i => i.type === 'custom_area' && i.parentId === 'root').map(i => `<div class="card" style="display:flex; align-items:center; cursor:pointer;" onclick="navigate('${i.id}')">
                <div style="width:45px; height:45px; background:var(--off-white); border-radius:12px; display:flex; align-items:center; justify-content:center; color:var(--gold); margin-right:15px;"><i data-lucide="star"></i></div>
                <b style="font-size:0.95rem; color:var(--chocolate); flex:1">${i.name}</b>
                <i data-lucide="trash-2" style="width:14px; opacity:0.2; color:var(--danger)" onclick="deleteItem('${i.id}', event)"></i>
            </div>`).join('')}
        </div>`;
    }

    function calculateWeightStats() {
        const w = state.items.find(i => i.type === 'health_weight');
        if(!w || !w.content.target) return null;
        const history = w.content.history || [];
        const current = history.length ? history.sort((a,b)=>new Date(b.date)-new Date(a.date))[0].weight : w.content.startWeight;
        const diff = current - w.content.target;
        const start = new Date(w.content.startDate);
        const end = new Date(start); end.setMonth(start.getMonth() + (parseInt(w.content.periodMonths) || 1));
        const monthsRem = Math.max(1, Math.ceil((end - new Date()) / (1000 * 60 * 60 * 24 * 30.41)));
        let h = parseFloat(w.content.height); if(h > 3) h /= 100;
        return { 
            mma: diff > 0 ? (diff / monthsRem).toFixed(2) : "0.00", 
            current, imc: h > 0 ? (current / (h * h)).toFixed(1) : "--", 
            water: (current * 0.035).toFixed(1) 
        };
    }

    function renderSaude(el) {
        const stats = calculateWeightStats();
        const weightItem = state.items.find(i => i.type === 'health_weight');
        const diet = state.items.find(i => i.type === 'health_food') || { content: {} };

        el.innerHTML = `
            <div class="weight-hero">
                <span class="meta-tag">Meta Mensal Restante</span>
                <div class="meta-val">${stats ? stats.mma : '--'} <small style="font-size:1rem; color:var(--gold)">kg</small></div>
                <div class="stat-sub-grid">
                    <div class="stat-box"><span class="label">Peso Atual</span><span class="value">${stats ? stats.current : '--'}kg</span></div>
                    <div class="stat-box"><span class="label">Seu IMC</span><span class="value">${stats ? stats.imc : '--'}</span></div>
                </div>
            </div>

            <div style="background:#fff; border:1px solid rgba(197, 160, 89, 0.3); border-radius:20px; padding:15px; display:flex; justify-content:space-between; align-items:center; margin-bottom:20px;">
                <div style="display:flex; align-items:center; gap:12px;">
                    <div style="color:var(--gold)"><i data-lucide="droplet"></i></div>
                    <b style="font-size:0.9rem;">Meta de Hidratação</b>
                </div>
                <b style="font-size:1.4rem; color:var(--gold)">${stats ? stats.water : '--'}L</b>
            </div>

            <div class="grid-container">
                <div class="card" style="display:block;">
                    <div class="section-header"><b>Plano Alimentar</b><i data-lucide="edit" style="width:14px; cursor:pointer; color:var(--gold)" onclick="openModal('health_food')"></i></div>
                    <div class="diet-block"><b>Café (${diet.content.bt||'--'})</b><div class="diet-text">${diet.content.b||'-'}</div></div>
                    <div class="diet-block"><b>Almoço (${diet.content.lt||'--'})</b><div class="diet-text">${diet.content.l||'-'}</div></div>
                    <div class="diet-block"><b>Jantar (${diet.content.dt||'--'})</b><div class="diet-text">${diet.content.d||'-'}</div></div>
                    <div style="background:var(--chocolate); color:#fff; padding:12px; border-radius:12px; text-align:center; font-size:0.75rem;">
                        JEJUM: ${diet.content.fs||'00:00'} ⮕ ${diet.content.fe||'00:00'}
                    </div>
                </div>

                <div class="card" style="display:block;">
                    <div class="section-header"><b>Ciclo Menstrual</b><i data-lucide="settings" style="width:14px; cursor:pointer" onclick="openModal('menstrual_config')"></i></div>
                    ${renderCalendarWidget()}
                </div>
            </div>
            
            <div class="card" style="margin-top:20px; display:block;">
                <div class="section-header"><b>Histórico de Peso</b><button class="btn-primary" style="width:auto; padding:5px 15px; font-size:0.7rem;" onclick="openModal('health_weight_register')">Pesar</button></div>
                <div style="max-height:150px; overflow-y:auto;">
                    ${(weightItem?.content.history || []).sort((a,b)=>new Date(b.date)-new Date(a.date)).map(h => `
                        <div style="display:flex; justify-content:space-between; padding:10px 0; border-bottom:1px solid #fafafa; font-size:0.85rem;">
                            <span>${new Date(h.date + 'T12:00:00').toLocaleDateString()}</span>
                            <div style="display:flex; gap:10px; align-items:center;">
                                <b>${h.weight}kg</b>
                                <i data-lucide="edit-2" style="width:12px; cursor:pointer; color:var(--gold)" onclick="editWeight('${h.id}')"></i>
                                <i data-lucide="trash-2" style="width:12px; cursor:pointer; color:var(--danger)" onclick="deleteWeight('${h.id}')"></i>
                            </div>
                        </div>
                    `).join('')}
                </div>
                ${weightItem ? `<button class="btn-cancel" style="width:100%; margin-top:10px; font-size:0.7rem;" onclick="openModal('health_weight_config')">Ajustar Metas</button>` : ''}
            </div>
        `;
    }

    function renderCalendarWidget() {
        const now = new Date();
        const last = new Date(state.menstrual.last + 'T12:00:00');
        const cycle = parseInt(state.menstrual.cycle);
        const dur = parseInt(state.menstrual.flow);
        
        let html = `<div class="cal-header"><div>D</div><div>S</div><div>T</div><div>Q</div><div>Q</div><div>S</div><div>S</div></div><div class="cal-grid">`;
        const startDay = new Date(now.getFullYear(), now.getMonth(), 1).getDay();
        const days = new Date(now.getFullYear(), now.getMonth() + 1, 0).getDate();

        for(let i=0; i<startDay; i++) html += `<div></div>`;
        for(let d=1; d<=days; d++) {
            const current = new Date(now.getFullYear(), now.getMonth(), d);
            const diff = Math.floor((current - last) / (86400000));
            const dayInCycle = ((diff % cycle) + cycle) % cycle;
            
            let cls = "cal-day";
            if(dayInCycle < dur) cls += " period";
            if(dayInCycle >= cycle - 16 && dayInCycle <= cycle - 11) cls += " fertile";
            if(d === now.getDate()) cls += " today";

            html += `<div class="${cls}">${d}</div>`;
        }
        return html + `</div>`;
    }

    function renderFinanceiro(el) {
        const income = state.items.filter(i => i.type === 'finance_in');
        const expense = state.items.filter(i => i.type === 'finance_out');
        const totalIn = income.reduce((a,b)=>a+parseFloat(b.content.value||0), 0);
        const totalOut = expense.reduce((a,b)=>a+parseFloat(b.content.value||0), 0);

        el.innerHTML = `
            <div class="welcome-card" style="padding:20px; display:grid; grid-template-columns:1fr 1fr; gap:15px; text-align:center;">
                <div><small style="opacity:0.7; font-size:0.6rem;">ENTRADAS</small><br><b style="font-size:1.2rem; color:var(--gold-light)">€ ${totalIn.toFixed(2)}</b></div>
                <div><small style="opacity:0.7; font-size:0.6rem;">SAÍDAS</small><br><b style="font-size:1.2rem; color:#fff">€ ${totalOut.toFixed(2)}</b></div>
            </div>
            <div class="grid-container">
                <div class="card" onclick="navigate('finance_in_folder')"><b>Receitas</b></div>
                <div class="card" onclick="navigate('finance_out_folder')"><b>Despesas</b></div>
                <div class="card" onclick="navigate('piggies')"><b>Porquinhos</b></div>
            </div>
        `;
    }

    async function renderBiblia(el) {
        el.innerHTML = `<div class="section-header"><h2>Bíblia Sagrada</h2></div>
        <div style="display:flex; gap:10px; margin-bottom:20px;">
            <select id="bib-book" class="form-control" style="flex:2;" onchange="state.bible.book=this.value; fetchBible();"></select>
            <input type="number" id="bib-cap" class="form-control" style="flex:1;" value="${state.bible.chapter}" onchange="state.bible.chapter=this.value; fetchBible();">
        </div>
        <div id="bib-text" class="card" style="display:block; min-height:300px; line-height:1.8; font-size:0.95rem; color:#444;">Carregando...</div>`;
        
        // Popular livros
        const books = ["Gênesis", "Êxodo", "Levítico", "Números", "Deuteronômio", "Josué", "Juízes", "Rute", "1 Samuel", "2 Samuel", "1 Reis", "2 Reis", "1 Crônicas", "2 Crônicas", "Esdras", "Neemias", "Ester", "Jó", "Salmos", "Provérbios", "Eclesiastes", "Cânticos", "Isaías", "Jeremias", "Lamentações", "Ezequiel", "Daniel", "Oseias", "Joel", "Amós", "Obadias", "Jonas", "Miqueias", "Naum", "Habacuque", "Sofonias", "Ageu", "Zacarias", "Malaquias", "Mateus", "Marcos", "Lucas", "João", "Atos", "Romanos", "1 Coríntios", "2 Coríntios", "Gálatas", "Efésios", "Filipenses", "Colossenses", "1 Tessalonicenses", "2 Tessalonicenses", "1 Timóteo", "2 Timóteo", "Tito", "Filemom", "Hebreus", "Tiago", "1 Pedro", "2 Pedro", "1 João", "2 João", "3 João", "Judas", "Apocalipse"];
        const sel = document.getElementById('bib-book');
        books.forEach(b => {
            const opt = document.createElement('option'); opt.value = b; opt.innerText = b;
            if(b === state.bible.book) opt.selected = true;
            sel.appendChild(opt);
        });
        fetchBible();
    }

    async function fetchBible() {
        const textEl = document.getElementById('bib-text');
        textEl.innerHTML = "Carregando capítulo...";
        try {
            const res = await fetch('https://raw.githubusercontent.com/thiagobodruk/bible/master/json/pt_nvi.json');
            const data = await res.json();
            const book = data.find(b => b.name === state.bible.book);
            const verses = book.chapters[state.bible.chapter - 1];
            textEl.innerHTML = verses.map((v, i) => `<p style="margin-bottom:12px;"><sup style="color:var(--gold); font-weight:800; margin-right:5px;">${i+1}</sup>${v}</p>`).join('');
        } catch(e) { textEl.innerHTML = "Erro ao carregar a Bíblia."; }
    }

    function renderFolder(el, pid) {
        const folder = state.items.find(i => i.id === pid);
        const items = state.items.filter(i => i.parentId === pid);
        if (folder?.type === 'visionboard') {
            el.innerHTML = `<div class="section-header"><h2>Mural</h2><button class="btn-primary" style="width:auto" onclick="openModal('vision_add', '${pid}')">Adicionar</button></div>
            <div class="mural-grid">${(folder.content.images || []).map((img, idx) => `<div class="mural-item"><img src="${img.data}" class="mural-img" onclick="showLightbox('${img.data}')"><div class="mural-cap">${img.caption}</div><button class="btn-mini" style="position:absolute; top:5px; right:5px; background:rgba(255,255,255,0.8)" onclick="deleteVisionImg('${pid}', ${idx})"><i data-lucide="x" style="width:14px"></i></button></div>`).join('')}</div>`;
            return;
        }
        el.innerHTML = `<div class="section-header"><h2>Conteúdo</h2></div><div class="grid-container">${items.map(i => `<div class="card" onclick="navigate('${i.id}')"><b>${i.name}</b></div>`).join('')}</div>`;
    }

    // --- Modals ---
    function openModal(type, extra = null) {
        const overlay = document.getElementById('modal-overlay');
        const body = document.getElementById('mb');
        const title = document.getElementById('mt');
        const save = document.getElementById('ms');
        overlay.style.display = 'flex';
        let html = '';

        if(type === 'health_food') {
            const d = state.items.find(i=>i.type === 'health_food') || {content:{}};
            title.innerText = "Dieta e Jejum";
            html = `<div class="form-group"><label>Café</label><input type="time" id="f-bt" class="form-control" value="${d.content.bt||'08:00'}"><textarea id="f-b" class="form-control">${d.content.b||''}</textarea></div>
                    <div class="form-group"><label>Almoço</label><input type="time" id="f-lt" class="form-control" value="${d.content.lt||'12:30'}"><textarea id="f-l" class="form-control">${d.content.l||''}</textarea></div>
                    <div class="form-group"><label>Jantar</label><input type="time" id="f-dt" class="form-control" value="${d.content.dt||'19:30'}"><textarea id="f-d" class="form-control">${d.content.d||''}</textarea></div>
                    <div class="form-group"><label>Jejum (Início/Fim)</label><div style="display:flex;gap:5px;"><input type="time" id="f-fs" class="form-control" value="${d.content.fs||'20:00'}"><input type="time" id="f-fe" class="form-control" value="${d.content.fe||'08:00'}"></div></div>`;
        }
        else if (type === 'health_weight_config') {
            const w = state.items.find(i=>i.type === 'health_weight') || {content:{}};
            title.innerText = "Configurar Metas";
            html = `<div class="form-group"><label>Peso Inicial (kg)</label><input type="number" id="f-start" class="form-control" value="${w.content.startWeight||''}"></div>
                    <div class="form-group"><label>Meta Final (kg)</label><input type="number" id="f-target" class="form-control" value="${w.content.target||''}"></div>
                    <div class="form-group"><label>Altura (ex: 1.70)</label><input type="number" id="f-height" class="form-control" value="${w.content.height||''}" step="0.01"></div>
                    <div class="form-group"><label>Prazo (Meses)</label><input type="number" id="f-months" class="form-control" value="${w.content.periodMonths||''}"></div>
                    <div class="form-group"><label>Data Início</label><input type="date" id="f-date" class="form-control" value="${w.content.startDate||''}"></div>`;
        }
        else if (type === 'health_weight_register') {
            title.innerText = "Novo Peso";
            html = `<div class="form-group"><label>Peso Hoje (kg)</label><input type="number" id="f-weight" class="form-control" step="0.1" autofocus></div>
                    <div class="form-group"><label>Data</label><input type="date" id="f-date" class="form-control" value="${new Date().toISOString().split('T')[0]}"></div>`;
        }
        else if (type === 'visionboard') {
            title.innerText = "Novo Visionboard";
            html = `<div class="form-group"><label>Título</label><input id="f-name" class="form-control"></div>`;
        }
        else if (type === 'vision_add') {
            title.innerText = "Nova Imagem";
            html = `<div class="form-group"><label>Foto</label><input type="file" id="f-img" class="form-control"></div>
                    <div class="form-group"><label>Legenda</label><textarea id="f-cap" class="form-control"></textarea></div>`;
        }
        else if (type === 'menstrual_config') {
            title.innerText = "Configuração Ciclo";
            html = `<div class="form-group"><label>Média Ciclo (Dias)</label><input type="number" id="f-c" class="form-control" value="${state.menstrual.cycle}"></div>
                    <div class="form-group"><label>Duração Fluxo (Dias)</label><input type="number" id="f-f" class="form-control" value="${state.menstrual.flow}"></div>
                    <div class="form-group"><label>Última Menstruação</label><input type="date" id="f-l" class="form-control" value="${state.menstrual.last}"></div>`;
        }
        else if (type === 'custom_area') {
            title.innerText = "Nova Área";
            html = `<div class="form-group"><label>Nome</label><input id="f-name" class="form-control"></div>`;
        }

        body.innerHTML = html;
        body.querySelectorAll('textarea').forEach(applyAutoResize);
        save.onclick = () => handleSave(type, extra);
    }

    async function handleSave(type, extra) {
        const v = id => document.getElementById(id).value;
        if(type === 'health_food') {
            let hf = state.items.find(i=>i.type === 'health_food');
            const data = { bt: v('f-bt'), b: v('f-b'), lt: v('f-lt'), l: v('f-l'), dt: v('f-dt'), d: v('f-d'), fs: v('f-fs'), fe: v('f-fe') };
            if(!hf) state.items.push({ id: 'diet', type: 'health_food', parentId: 'saude', name: 'Dieta', content: data });
            else hf.content = data;
        }
        else if (type === 'health_weight_config') {
            let hw = state.items.find(i=>i.type === 'health_weight');
            const data = { startWeight: parseFloat(v('f-start')), target: parseFloat(v('f-target')), height: parseFloat(v('f-height')), periodMonths: v('f-months'), startDate: v('f-date') };
            if(!hw) state.items.push({ id: 'hw', type: 'health_weight', parentId: 'saude', name: 'Peso', content: { ...data, history: [] } });
            else hw.content = { ...hw.content, ...data };
        }
        else if (type === 'health_weight_register') {
            const hw = state.items.find(i=>i.type === 'health_weight');
            if(!hw.content.history) hw.content.history = [];
            hw.content.history.push({ id: 'w'+Date.now(), date: v('f-date'), weight: parseFloat(v('f-weight')) });
        }
        else if (type === 'visionboard') {
            state.items.push({ id: 'vb'+Date.now(), parentId: state.path[state.path.length-1], type: 'visionboard', name: v('f-name'), content: { images: [] } });
        }
        else if (type === 'vision_add') {
            const file = document.getElementById('f-img').files[0];
            const reader = new FileReader();
            reader.onload = (e) => {
                const vb = state.items.find(i => i.id === extra);
                if(!vb.content.images) vb.content.images = [];
                vb.content.images.push({ data: e.target.result, caption: v('f-cap') });
                sync(); closeModal();
            };
            if(file) reader.readAsDataURL(file);
            return;
        }
        else if (type === 'menstrual_config') {
            state.menstrual = { cycle: v('f-c'), flow: v('f-f'), last: v('f-l') };
        }
        else if (type === 'custom_area') {
            state.items.push({ id: 'a'+Date.now(), parentId: 'root', type: 'custom_area', name: v('f-name') });
        }
        sync(); closeModal();
    }

    // --- Helpers ---
    function closeModal() { document.getElementById('modal-overlay').style.display = 'none'; }
    function showLightbox(src) { document.getElementById('li').src = src; document.getElementById('lightbox').style.display = 'flex'; }
    function toggleFab(e) { e.stopPropagation(); document.getElementById('fab-overlay').style.display = 'block'; }
    function deleteItem(id, e) { e.stopPropagation(); if(confirm("Apagar permanentemente?")) { state.items = state.items.filter(i=>i.id !== id); sync(); } }
    function deleteVisionImg(vid, idx) { if(confirm("Apagar imagem?")) { state.items.find(i=>i.id===vid).content.images.splice(idx,1); sync(); } }
    function editWeight(hid) { const hw = state.items.find(i=>i.type==='health_weight'); const h = hw.content.history.find(x=>x.id===hid); const nw = prompt("Peso (kg):", h.weight); if(nw){ h.weight=parseFloat(nw); sync(); } }
    function deleteWeight(hid) { if(confirm("Apagar?")) { const hw = state.items.find(i=>i.type==='health_weight'); hw.content.history = hw.content.history.filter(x=>x.id!==hid); sync(); } }
    function exportData() { const blob = new Blob([JSON.stringify(state)], {type: 'application/json'}); const a = document.createElement('a'); a.href = URL.createObjectURL(blob); a.download = 'organizador_caroline.json'; a.click(); }
    function importData() { const input = document.createElement('input'); input.type = 'file'; input.onchange = e => { const r = new FileReader(); r.onload = ev => { state = JSON.parse(ev.target.result); sync(); }; r.readAsText(e.target.files[0]); }; input.click(); }

    render();
</script>
</body>

    <style>

<script>
    // --- State Manager ---
    let state = {
        path: ['root'],
        items: JSON.parse(localStorage.getItem('cm_premium_v5')) || [],
        editingId: null,
        menstrual: JSON.parse(localStorage.getItem('cm_menstrual')) || {
            cycleDays: 28,
            periodDays: 5,
            lastPeriod: "",
            logs: {} // Formato: "YYYY-MM-DD": { sex: true, prot: true, flow: 'high' }

    };

    function applyAutoResize(el) {
        el.style.height = 'auto';
        el.style.height = el.scrollHeight + 'px';
    }

    document.addEventListener('input', (e) => {
        if(e.target.tagName.toLowerCase() === 'textarea') applyAutoResize(e.target);
    });

    function checkAccess() {
        const val = document.getElementById('lock-input').value;
        if(val === "2405") {
            document.getElementById('lock-screen').style.opacity = '0';
            setTimeout(() => document.getElementById('lock-screen').style.display = 'none', 500);
        } else {
            document.getElementById('lock-error').innerText = "SENHA INCORRETA";
            document.getElementById('lock-input').value = "";
        }
    }

    function saveState() {
        localStorage.setItem('cm_premium_v5', JSON.stringify(state.items));
        localStorage.setItem('cm_menstrual', JSON.stringify(state.menstrual));
        renderApp();
    }

    // --- Navigation ---
    const CATEGORIES = [
        { id: 'pessoal', name: 'Pessoal', icon: 'user' },
        { id: 'profissional', name: 'Profissional', icon: 'briefcase' },
        { id: 'financeiro', name: 'Financeiro', icon: 'trending-up' },
        { id: 'saude', name: 'Saúde', icon: 'heart' },
        { id: 'biblia', name: 'Bíblia', icon: 'book-open' }
    ];

    function navigate(id) { state.path.push(id); renderApp(); }
    function goBack(idx) { state.path = state.path.slice(0, idx + 1); renderApp(); }

    // --- Renderers ---
    function renderApp() {
        const currentId = state.path[state.path.length - 1];
        const main = document.getElementById('app-content');
        const bread = document.getElementById('breadcrumbs');
        
        bread.innerHTML = state.path.map((id, i) => {
            const label = id === 'root' ? 'Início' : (CATEGORIES.find(c=>c.id===id)?.name || state.items.find(it=>it.id===id)?.name || id);
            return `<span class="breadcrumb-item" onclick="goBack(${i})">${i>0?'<i data-lucide="chevron-right" style="width:12px;opacity:0.3"></i>':''} ${label}</span>`;
        }).join('');

        if (currentId === 'root') renderDashboard(main);
        else if (currentId === 'saude') renderHealth(main);
        else renderFolder(main, currentId);

        if(window.lucide) lucide.createIcons();
    }

    function renderDashboard(el) {
        el.innerHTML = `<h2 style="margin-bottom:20px; color:var(--chocolate)">Minhas Áreas</h2><div class="grid-container" id="dash-grid"></div>`;
        const grid = el.querySelector('#dash-grid');
        CATEGORIES.forEach(cat => {
            const card = document.createElement('div');
            card.className = 'card';
            card.style.cursor = 'pointer';
            card.innerHTML = `<i data-lucide="${cat.icon}" style="color:var(--gold); margin-right:15px;"></i><b style="font-size:1rem; color:var(--chocolate)">${cat.name}</b>`;
            card.onclick = () => navigate(cat.id);
            grid.appendChild(card);
        });
    }

    function renderHealth(el) {
        const wItem = state.items.find(i => i.type === 'health_weight') || { content: { history: [] } };
        const diet = state.items.find(i => i.type === 'health_food') || { content: {} };
        const stats = calculateWeight(wItem);

        el.innerHTML = `
            <div class="section-header"><h2>Saúde</h2></div>
            
            ${stats ? `
            <div class="weight-hero">
                <div class="meta-label">Meta de Perda Mensal</div>
                <div class="meta-value">${stats.mma} <span class="meta-unit">kg</span></div>
                <div class="stat-sub-grid">
                    <div class="stat-box"><span class="label">Peso Atual</span><span class="value">${stats.current}kg</span></div>
                    <div class="stat-box"><span class="label">IMC</span><span class="value">${stats.imc}</span></div>
                </div>
            </div>
            <div class="water-highlight">
                <div style="display:flex; align-items:center; gap:12px;">
                    <div style="color:var(--gold)"><i data-lucide="droplet"></i></div>
                    <div><b style="font-size:0.9rem;">Água Diária</b><br><small>Meta: ${stats.water}L</small></div>
                </div>
            </div>
            ` : `<div class="card" onclick="openModal('health_weight_config')">Configurar Monitor de Peso</div>`}

            <!-- Dieta -->
            <div class="card" style="margin: 20px 0; display:block;">
                <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:15px;">
                    <b>Plano Alimentar</b> <i data-lucide="edit-3" style="width:16px; cursor:pointer; color:var(--gold)" onclick="openModal('health_food')"></i>
                </div>
                <div style="display:grid; gap:10px; font-size:0.8rem;">
                    <div style="background:var(--off-white); padding:10px; border-radius:10px;"><b>Café (${diet.content.bt || '00:00'}):</b> ${diet.content.b || '-'}</div>
                    <div style="background:var(--off-white); padding:10px; border-radius:10px;"><b>Almoço (${diet.content.lt || '00:00'}):</b> ${diet.content.l || '-'}</div>
                    <div style="background:var(--off-white); padding:10px; border-radius:10px;"><b>Jantar (${diet.content.dt || '00:00'}):</b> ${diet.content.d || '-'}</div>
                    <div style="background:var(--chocolate); color:#fff; padding:10px; border-radius:10px; text-align:center;">Jejum: ${diet.content.fs || '00:00'} às ${diet.content.fe || '00:00'}</div>
                </div>
            </div>

            <!-- Calendário Menstrual -->
            <div class="card" style="display:block;">
                <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:15px;">
                    <b>Calendário Menstrual</b>
                    <button class="btn-mini" onclick="openModal('menstrual_config')"><i data-lucide="settings" style="width:14px"></i></button>
                </div>
                ${renderMenstrualCalendar()}
                <div class="cal-legend">
                    <span><span class="legend-dot" style="background:var(--danger)"></span> Período</span>
                    <span><span class="legend-dot" style="background:var(--gold)"></span> Fértil</span>
                </div>
            </div>
            
            <button class="btn-add" style="width:100%; margin-top:20px;" onclick="openModal('health_weight_register')">Registar Peso</button>
        `;
    }

    function renderMenstrualCalendar() {
        const now = new Date();
        const year = now.getFullYear();
        const month = now.getMonth();
        const daysInMonth = new Date(year, month + 1, 0).getDate();
        const firstDay = new Date(year, month, 1).getDay();

        // Lógica de cálculo simplificada
        const last = new Date(state.menstrual.lastPeriod + 'T12:00:00');
        const cycle = parseInt(state.menstrual.cycleDays);
        const dur = parseInt(state.menstrual.periodDays);

        let html = `<div class="cal-header"><div>D</div><div>S</div><div>T</div><div>Q</div><div>Q</div><div>S</div><div>S</div></div>`;
        html += `<div class="cal-grid">`;
        
        for(let i=0; i<firstDay; i++) html += `<div></div>`;

        for(let d=1; d<=daysInMonth; d++) {
            const currentLoopDate = new Date(year, month, d);
            const diffDays = Math.floor((currentLoopDate - last) / (1000 * 60 * 60 * 24));
            const dayInCycle = ((diffDays % cycle) + cycle) % cycle;

            let classes = "cal-day";
            if(d === now.getDate()) classes += " today";
            if(dayInCycle < dur) classes += " period";
            if(dayInCycle >= cycle - 16 && dayInCycle <= cycle - 11) classes += " fertile";

            html += `<div class="${classes}" onclick="openMenstrualDay('${year}-${month+1}-${d}')">${d}</div>`;
        }
        html += `</div>`;
        return html;
    }

    function openMenstrualDay(dateStr) {
        openModal('menstrual_day', dateStr);
    }

    function calculateWeight(w) {
        if(!w || !w.content || !w.content.target) return null;
        const current = w.content.history.length ? w.content.history.sort((a,b)=>new Date(b.date)-new Date(a.date))[0].weight : w.content.startWeight;
        const diffWeight = current - w.content.target;
        const end = new Date(w.content.startDate);
        end.setMonth(end.getMonth() + (parseInt(w.content.periodMonths) || 1));
        const monthsRem = Math.max(1, Math.ceil((end - new Date()) / (1000 * 60 * 60 * 24 * 30.41)));
        
        let h = parseFloat(w.content.height); if(h > 3) h = h/100;
        return { 
            mma: diffWeight > 0 ? (diffWeight / monthsRem).toFixed(2) : "0.00", 
            current, imc: h > 0 ? (current / (h * h)).toFixed(1) : "--", 
            water: (current * 0.035).toFixed(1) 
        };
    }

    function renderFolder(el, pid) {
        const folder = state.items.find(i => i.id === pid);
        const items = state.items.filter(i => i.parentId === pid);
        if (folder?.type === 'visionboard') {
            el.innerHTML = `<div class="section-header"><h2>${folder.name}</h2><button class="btn-add" onclick="openModal('vision_add', '${pid}')">Adicionar</button></div>
            <div class="vision-mural">${(folder.content.images || []).map((img, idx) => `
                <div class="vision-item">
                    <img src="${img.data}" class="vision-img" onclick="showLightbox('${img.data}')">
                    <div class="vision-caption-tag">${img.caption}</div>
                    <div class="vision-ctrl"><button class="btn-mini" onclick="deleteVisionImg('${pid}', ${idx})"><i data-lucide="trash-2" style="width:14px"></i></button></div>
                </div>`).join('')}</div>`;
            return;
        }
        el.innerHTML = `<div class="section-header"><h2>Conteúdo</h2></div><div class="grid-container" id="folder-grid"></div>`;
        items.forEach(i => {
            const card = document.createElement('div');
            card.className = 'card'; card.innerHTML = `<b>${i.name}</b>`;
            card.onclick = () => navigate(i.id);
            el.querySelector('#folder-grid').appendChild(card);
        });
    }

    // --- Modal Logic ---
    function openModal(type, extra = null) {
        state.editingId = extra;
        const modal = document.getElementById('modal-overlay');
        const body = document.getElementById('modal-body');
        const title = document.getElementById('modal-title');
        const saveBtn = document.getElementById('modal-save-btn');
        modal.style.display = 'flex';
        let html = '';

        if (type === 'health_food') {
            const d = state.items.find(i=>i.type === 'health_food') || {content:{}};
            title.innerText = "Plano de Dieta";
            html = `
                <div class="form-group"><label>Café</label><input type="time" id="f-bt" class="form-control" value="${d.content.bt||'08:00'}"><textarea id="f-b" class="form-control">${d.content.b||''}</textarea></div>
                <div class="form-group"><label>Almoço</label><input type="time" id="f-lt" class="form-control" value="${d.content.lt||'12:30'}"><textarea id="f-l" class="form-control">${d.content.l||''}</textarea></div>
                <div class="form-group"><label>Jantar</label><input type="time" id="f-dt" class="form-control" value="${d.content.dt||'19:30'}"><textarea id="f-d" class="form-control">${d.content.d||''}</textarea></div>
                <div class="form-group"><label>Jejum (Início/Fim)</label><div style="display:flex;gap:5px;"><input type="time" id="f-fs" class="form-control" value="${d.content.fs||'20:00'}"><input type="time" id="f-fe" class="form-control" value="${d.content.fe||'08:00'}"></div></div>
            `;
        }
        else if (type === 'menstrual_config') {
            title.innerText = "Configurar Ciclo";
            html = `
                <div class="form-group"><label>Duração Média Ciclo (dias)</label><input type="number" id="f-cycle" class="form-control" value="${state.menstrual.cycleDays}"></div>
                <div class="form-group"><label>Duração Fluxo (dias)</label><input type="number" id="f-period" class="form-control" value="${state.menstrual.periodDays}"></div>
                <div class="form-group"><label>Última Menstruação</label><input type="date" id="f-last" class="form-control" value="${state.menstrual.lastPeriod}"></div>
            `;
        }
        else if (type === 'vision_add') {
            title.innerText = "Nova Imagem";
            html = `<div class="form-group"><label>Foto</label><input type="file" id="f-img" class="form-control"></div>
                    <div class="form-group"><label>Legenda</label><textarea id="f-cap" class="form-control"></textarea></div>`;
        }
        else if (type === 'health_weight_config') {
            const w = state.items.find(i=>i.type === 'health_weight') || {content:{}};
            title.innerText = "Configurar Metas";
            html = `<div class="form-group"><label>Peso Inicial</label><input type="number" id="f-start" class="form-control" value="${w.content.startWeight||''}"></div>
                    <div class="form-group"><label>Meta Final</label><input type="number" id="f-target" class="form-control" value="${w.content.target||''}"></div>
                    <div class="form-group"><label>Altura</label><input type="number" id="f-height" class="form-control" value="${w.content.height||''}" step="0.01"></div>
                    <div class="form-group"><label>Prazo (Meses)</label><input type="number" id="f-months" class="form-control" value="${w.content.periodMonths||''}"></div>
                    <div class="form-group"><label>Início</label><input type="date" id="f-date" class="form-control" value="${w.content.startDate||''}"></div>`;
        }
        else if (type === 'health_weight_register') {
            title.innerText = "Registo de Peso";
            html = `<div class="form-group"><label>Peso Hoje (kg)</label><input type="number" id="f-weight" class="form-control" step="0.1"></div>
                    <div class="form-group"><label>Data</label><input type="date" id="f-date" class="form-control" value="${new Date().toISOString().split('T')[0]}"></div>`;
        }
        else if (type === 'custom_area') {
            title.innerText = "Nova Área";
            html = `<div class="form-group"><label>Nome</label><input id="f-name" class="form-control"></div>`;
        }

        body.innerHTML = html;
        body.querySelectorAll('textarea').forEach(applyAutoResize);
        saveBtn.onclick = () => handleModalSave(type, extra);
    }

    async function handleModalSave(type, extra) {
        const getV = id => document.getElementById(id).value;
        if (type === 'health_food') {
            let hf = state.items.find(i=>i.type === 'health_food');
            const data = { bt: getV('f-bt'), b: getV('f-b'), lt: getV('f-lt'), l: getV('f-l'), dt: getV('f-dt'), d: getV('f-d'), fs: getV('f-fs'), fe: getV('f-fe') };
            if(!hf) state.items.push({ id: 'diet', type: 'health_food', parentId: 'saude', name: 'Dieta', content: data });
            else hf.content = data;
        }
        else if (type === 'menstrual_config') {
            state.menstrual.cycleDays = getV('f-cycle');
            state.menstrual.periodDays = getV('f-period');
            state.menstrual.lastPeriod = getV('f-last');
        }
        else if (type === 'vision_add') {
            const f = document.getElementById('f-img').files[0];
            const reader = new FileReader();
            reader.onload = (e) => {
                const vb = state.items.find(i => i.id === extra);
                if(!vb.content.images) vb.content.images = [];
                vb.content.images.push({ data: e.target.result, caption: getV('f-cap') });
                saveState(); closeModal();
            };
            if(f) reader.readAsDataURL(f);
            return;
        }
        else if (type === 'health_weight_config') {
            let hw = state.items.find(i=>i.type === 'health_weight');
            const data = { startWeight: getV('f-start'), target: getV('f-target'), height: getV('f-height'), periodMonths: getV('f-months'), startDate: getV('f-date') };
            if(!hw) state.items.push({ id: 'hw', type: 'health_weight', parentId: 'saude', name: 'Peso', content: { ...data, history: [] } });
            else hw.content = { ...hw.content, ...data };
        }
        else if (type === 'health_weight_register') {
            const hw = state.items.find(i=>i.type === 'health_weight');
            hw.content.history.push({ id: 'w'+Date.now(), date: getV('f-date'), weight: getV('f-weight') });
        }
        else if (type === 'custom_area') {
            state.items.push({ id: 'area'+Date.now(), parentId: 'root', type: 'custom_area', name: getV('f-name') });
        }

        saveState(); closeModal();
    }

    function closeModal() { document.getElementById('modal-overlay').style.display = 'none'; }
    function showLightbox(src) { document.getElementById('lightbox-img').src = src; document.getElementById('lightbox').style.display = 'flex'; }
    function toggleFabMenu(e) { e.stopPropagation(); const m = document.getElementById('fab-menu'); m.style.display = m.style.display === 'block' ? 'none' : 'block'; }
    function deleteVisionImg(vid, idx) { if(confirm("Apagar?")) { state.items.find(i=>i.id===vid).content.images.splice(idx,1); saveState(); } }
    function deleteWeightEntry(id) { if(confirm("Apagar?")) { const hw = state.items.find(i=>i.type==='health_weight'); hw.content.history = hw.content.history.filter(h=>h.id!==id); saveState(); } }
    function deleteGlobalItem(id, e) { e.stopPropagation(); if(confirm("Apagar?")) { state.items = state.items.filter(i=>i.id!==id); saveState(); } }
    function exportData() { const blob = new Blob([JSON.stringify({items: state.items, menstrual: state.menstrual})], {type: 'application/json'}); const a = document.createElement('a'); a.href = URL.createObjectURL(blob); a.download = 'organizador_backup.json'; a.click(); }
    function importData() { const input = document.createElement('input'); input.type = 'file'; input.onchange = e => { const r = new FileReader(); r.onload = ev => { const d = JSON.parse(ev.target.result); state.items = d.items; state.menstrual = d.menstrual; saveState(); }; r.readAsText(e.target.files[0]); }; input.click(); }
    document.addEventListener('click', () => { document.getElementById('fab-menu').style.display = 'none'; });

    renderApp();
</script>
</body>
</html>
