<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Caroline Medeiros - Organizador Premium</title>
    
    <script src="https://unpkg.com/lucide@latest"></script>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700&family=Playfair+Display:ital,wght@0,600;0,700;1,600&display=swap" rel="stylesheet">
    
    <style>
        :root {
            --chocolate: #3E2723;
            --chocolate-light: #5D4037;
            --off-white: #FDFBF7;
            --gold: #C5A059;
            --gold-light: #E0C080;
            --text-main: #3E2723;
            --success: #558B2F;
            --danger: #C62828;
            --bg-card: #FFFFFF;
            --transition: all 0.3s cubic-bezier(0.25, 0.8, 0.25, 1);
            --shadow: 0 10px 30px -5px rgba(62, 39, 35, 0.1);
            --shadow-hover: 0 15px 35px -5px rgba(197, 160, 89, 0.2);
            
            /* Menstrual App Colors */
            --period-bg: #FFEBEE;
            --period-main: #E91E63;
            --fertile-bg: #FFF8E1;
            --fertile-main: #FFB300;
            --ovulation-main: #448AFF;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Montserrat', 'Segoe UI', sans-serif; }
        h1, h2, h3, .monogram { font-family: 'Playfair Display', 'Georgia', serif; }

        body { background-color: var(--off-white); color: var(--text-main); min-height: 100vh; display: flex; flex-direction: column; overflow-x: hidden; }

        /* --- Scrollbar --- */
        ::-webkit-scrollbar { width: 6px; height: 6px; }
        ::-webkit-scrollbar-track { background: transparent; }
        ::-webkit-scrollbar-thumb { background: rgba(62, 39, 35, 0.2); border-radius: 3px; }
        ::-webkit-scrollbar-thumb:hover { background: var(--gold); }

        /* --- Header --- */
        header { padding: 20px 20px 15px; text-align: center; background: rgba(255, 255, 255, 0.95); backdrop-filter: blur(10px); border-bottom: 1px solid rgba(197, 160, 89, 0.2); position: sticky; top: 0; z-index: 50; }
        .monogram { font-size: 2.2rem; letter-spacing: 2px; color: var(--chocolate); line-height: 1; }
        .brand-name { font-size: 0.7rem; text-transform: uppercase; letter-spacing: 3px; color: var(--gold); font-weight: 700; margin-top: 4px; }
        .date-time-display { font-size: 0.75rem; color: #8D6E63; margin-top: 8px; font-weight: 500; }

        /* --- Navigation --- */
        .navigation-bar { padding: 10px 5%; background: #fff; display: flex; align-items: center; gap: 10px; font-size: 0.9rem; border-bottom: 1px solid #f0f0f0; overflow-x: auto; white-space: nowrap; }
        .breadcrumb-item { cursor: pointer; color: var(--chocolate-light); font-weight: 600; display: flex; align-items: center; gap: 4px; padding: 4px 8px; border-radius: 6px; transition: var(--transition); }
        .breadcrumb-item:hover { background: #f5f5f5; color: var(--gold); }

        /* --- Main --- */
        main { flex: 1; padding: 25px 5%; max-width: 1200px; margin: 0 auto; width: 100%; position: relative; animation: fadeIn 0.4s ease-out; overflow: visible !important; }
        .section-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; flex-wrap: wrap; gap: 15px; position: relative; z-index: 20; }
        .section-header h2 { color: var(--chocolate); }

        /* --- Cards & Stacking Logic --- */
        .grid-container { display: grid; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); gap: 20px; overflow: visible !important; contain: none !important; }
        .card { background: var(--bg-card); padding: 25px; border-radius: 24px; border: 1px solid rgba(0,0,0,0.03); box-shadow: var(--shadow); cursor: pointer; transition: var(--transition); display: flex; align-items: center; gap: 15px; position: relative; overflow: visible !important; z-index: 1; }
        .card:hover { transform: translateY(-4px); box-shadow: var(--shadow-hover); border-color: rgba(197, 160, 89, 0.3); z-index: 10; }

        .card:has(.create-menu-dropdown.show) { z-index: 2147483647 !important; transform: none !important; }
        
        .card.selected { border: 2px solid var(--success); background-color: #F1F8E9; }
        .selection-check { position: absolute; top: 15px; right: 15px; color: var(--success); display: none; }
        .card.selected .selection-check { display: block; }

        /* --- Buttons --- */
        .btn-add { background: var(--chocolate); color: white; border: none; padding: 10px 24px; border-radius: 30px; cursor: pointer; font-size: 0.8rem; display: inline-flex; align-items: center; gap: 8px; font-weight: 600; box-shadow: 0 4px 12px rgba(62, 39, 35, 0.2); transition: 0.2s; }
        .btn-add:hover { background: var(--chocolate-light); transform: translateY(-1px); }
        .btn-cancel { background: #f5f5f5; color: #666; border: 1px solid #eee; padding: 10px 24px; border-radius: 30px; cursor: pointer; font-size: 0.8rem; font-weight: 600; transition: 0.2s; }
        
        .btn-check { width: 32px; height: 32px; border-radius: 50%; border: 2px solid #ddd; display: flex; align-items: center; justify-content: center; cursor: pointer; color: transparent; transition: 0.2s; }
        .btn-check.active { background: var(--success); border-color: var(--success); color: white; }

        /* --- Menstrual Calendar Styles --- */
        .cal-grid { display: grid; grid-template-columns: repeat(7, 1fr); gap: 2px; }
        .cal-day { aspect-ratio: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; font-size: 0.8rem; border-radius: 50%; position: relative; cursor: pointer; transition: 0.2s; }
        .cal-day:hover { background: #f9f9f9; }
        .cal-day.period { background-color: var(--period-main) !important; color: white !important; font-weight: bold; }
        .cal-day.predicted-period { background-color: var(--period-bg); border: 2px dashed var(--period-main); color: var(--period-main); }
        .cal-day.fertile { background-color: var(--fertile-bg); border-bottom: 2px solid var(--fertile-main); }
        .cal-day.ovulation { border: 2px solid var(--ovulation-main); font-weight: bold; }
        .cal-day.today { box-shadow: inset 0 0 0 2px var(--chocolate); }
        .symptom-dot { width: 4px; height: 4px; background: var(--gold); border-radius: 50%; position: absolute; bottom: 4px; }

        /* --- Weight Monitor Hero --- */
        .weight-hero { text-align: center; padding: 20px; background: linear-gradient(145deg, #ffffff, #fdfbf7); border-radius: 30px; border: 1px solid rgba(197, 160, 89, 0.2); margin-bottom: 15px; }
        .weight-hero-title { font-size: 0.75rem; text-transform: uppercase; letter-spacing: 2px; color: #888; margin-bottom: 5px; font-weight: 700; }
        .weight-hero-value { font-size: 3rem; font-weight: 800; color: var(--chocolate); font-family: 'Playfair Display', serif; }
        .weight-hero-unit { font-size: 1rem; color: var(--gold); }

        /* --- Floating Dashboard Button --- */
        .floating-star-btn { position: fixed; bottom: 30px; right: 30px; width: 60px; height: 60px; background: var(--gold); border-radius: 50%; box-shadow: 0 10px 30px rgba(197, 160, 89, 0.5); display: flex; align-items: center; justify-content: center; cursor: pointer; z-index: 1000; transition: transform 0.3s; }
        .floating-star-btn:hover { transform: scale(1.1) rotate(15deg); }

        /* --- Lock Screen --- */
        #lock-screen { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: #FDFBF7; z-index: 100000; display: flex; flex-direction: column; justify-content: center; align-items: center; transition: opacity 0.5s; }
        .lock-input { margin-top: 20px; padding: 10px 15px; font-size: 1.2rem; letter-spacing: 5px; text-align: center; border: 1px solid var(--gold); border-radius: 30px; outline: none; width: 200px; background: white; color: var(--chocolate); }

        /* --- Modals --- */
        #modal-overlay, #delete-modal-overlay, #file-preview-modal, #share-modal { position: fixed; top:0; left:0; width:100%; height:100%; background: rgba(62, 39, 35, 0.4); backdrop-filter: blur(4px); display: none; justify-content: center; align-items: center; z-index: 99999; opacity: 0; transition: opacity 0.3s; }
        #modal-overlay.open, #delete-modal-overlay.open, #file-preview-modal.open, #share-modal.open { opacity: 1; display: flex; }
        .modal { background: white; padding: 35px; border-radius: 24px; width: 90%; max-width: 480px; max-height: 90vh; overflow-y: auto; transform: scale(0.95); transition: transform 0.3s; }
        .modal.large { max-width: 600px; }
        #modal-overlay.open .modal { transform: scale(1); }
        
        .form-group { margin-bottom: 20px; }
        .form-group label { display: block; font-size: 0.8rem; margin-bottom: 8px; color: var(--chocolate); font-weight: 700; text-transform: uppercase; }
        .form-control { width: 100%; padding: 14px; border: 1px solid #eee; border-radius: 12px; font-size: 0.95rem; background: #fafafa; outline: none; }
        .form-control:focus { border-color: var(--gold); background: #fff; }

        /* --- Menus --- */
        .create-menu-container { position: relative; }
        .create-menu-dropdown { position: absolute; top: 110%; right: 0; background: white; border: 1px solid #f0f0f0; border-radius: 16px; box-shadow: 0 10px 40px rgba(0,0,0,0.2); width: 240px; display: none; z-index: 100; overflow: hidden; }
        .create-menu-dropdown.show { display: block; }
        .create-menu-item { padding: 12px 20px; cursor: pointer; display: flex; align-items: center; gap: 12px; font-size: 0.9rem; color: #555; }
        .create-menu-item:hover { background: #fdfaf5; color: var(--chocolate); }

        /* --- Visionboard --- */
        .vision-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 15px; margin-top: 15px; }
        .vision-item { display: flex; flex-direction: column; gap: 8px; cursor: pointer; }
        .vision-img { width: 100%; aspect-ratio: 3/4; object-fit: cover; border-radius: 16px; box-shadow: var(--shadow); }
        .vision-caption { font-size: 0.75rem; text-align: center; color: var(--chocolate); font-weight: 600; }

        @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
        #toast-container { position: fixed; top: 20px; right: 20px; z-index: 100000; display: flex; flex-direction: column; gap: 10px; }
        .toast { background: white; padding: 15px 25px; border-radius: 50px; box-shadow: 0 10px 30px rgba(0,0,0,0.15); display: flex; align-items: center; gap: 10px; font-size: 0.9rem; border-left: 4px solid #333; animation: fadeIn 0.3s; }
        .toast.success { border-color: var(--success); color: var(--success); }
        
        #batch-actions-bar { position: fixed; bottom: 30px; left: 50%; transform: translate(-50%, 150px); background: var(--chocolate); color: white; padding: 15px 30px; border-radius: 40px; display: flex; align-items: center; gap: 20px; z-index: 5000; box-shadow: 0 10px 30px rgba(0,0,0,0.3); transition: transform 0.3s; }
    </style>
</head>
<body>

<div id="lock-screen">
    <div class="monogram" style="font-size: 3rem; margin-bottom: 20px;">CM</div>
    <div style="font-family: 'Playfair Display', serif; color: var(--chocolate); margin-bottom: 10px;">Caroline Medeiros</div>
    <input type="password" id="lock-pass" class="lock-input" placeholder="Senha" maxlength="4" autocomplete="off" />
    <button class="btn-add" style="margin-top: 15px;" onclick="checkAccess()">Entrar</button>
    <div id="lock-msg" style="color: var(--danger); margin-top: 10px; height: 20px; font-size: 0.8rem;"></div>
</div>

<div id="loading-screen" style="position:fixed; top:0; left:0; width:100%; height:100%; background:var(--off-white); z-index:9999; display:flex; flex-direction:column; justify-content:center; align-items:center;">
    <div class="monogram" style="font-size: 2rem;">CM</div>
    <div class="brand-name" style="margin-top:10px; opacity:0.6">Carregando Sistema...</div>
</div>

<div id="toast-container"></div>

<header>
    <div class="monogram">CM</div>
    <div class="brand-name">Caroline Medeiros</div>
    <div class="date-time-display" id="clock-display">...</div>
</header>

<div class="navigation-bar" id="breadcrumb-container"></div>

<main id="main-content"></main>

<!-- Modals -->
<div id="modal-overlay">
    <div class="modal">
        <h3 id="modal-title" style="text-align:center; margin-bottom: 25px; color: var(--chocolate); font-family: 'Playfair Display', serif;">Adicionar</h3>
        <div id="modal-form"></div>
        <div id="modal-actions" style="margin-top: 30px; display: flex; gap: 12px; justify-content: flex-end;"></div>
    </div>
</div>

<div id="delete-modal-overlay">
    <div class="modal" style="text-align: center;">
        <h3 style="color: var(--danger); margin-bottom: 10px;">Exclusão</h3>
        <p id="delete-modal-text" style="margin-bottom: 25px; color: #666;">Tem certeza?</p>
        <div style="display: flex; gap: 10px; justify-content: center;">
            <button class="btn-cancel" onclick="closeDeleteModal()">Cancelar</button>
            <button class="btn-add" style="background:var(--danger)" onclick="confirmDelete()">Confirmar</button>
        </div>
    </div>
</div>

<div id="batch-actions-bar">
    <span id="selected-count" style="font-weight:600">0 selecionados</span>
    <button onclick="confirmBatchDelete()" style="background:rgba(255,255,255,0.2); border:none; color:white; padding:8px 16px; border-radius:20px; cursor:pointer;">Excluir</button>
    <button onclick="toggleSelectionMode()" style="background:white; border:none; color:var(--chocolate); padding:8px 16px; border-radius:20px; cursor:pointer; font-weight:bold">Cancelar</button>
</div>

<script>
    // --- Access Control ---
    const _0x5a1b = (s) => s.split('').reduce((a,b)=>{a=((a<<5)-a)+b.charCodeAt(0);return a&a},0);
    const _0x1c8a = 1509442; // Hash para "1234"

    window.checkAccess = () => {
        const inp = document.getElementById('lock-pass');
        const msg = document.getElementById('lock-msg');
        if (_0x5a1b(inp.value) === _0x1c8a) {
            document.getElementById('lock-screen').style.display = 'none';
            sessionStorage.setItem('cm_access', 'granted');
            initApp();
        } else {
            msg.innerText = "Senha incorreta";
            inp.value = '';
            setTimeout(() => msg.innerText = '', 2000);
        }
    };

    if (sessionStorage.getItem('cm_access') === 'granted') {
        document.getElementById('lock-screen').style.display = 'none';
        setTimeout(initApp, 100);
    }

    // --- State & Storage ---
    const STORAGE_KEY = 'cm_premium_data_v3';
    let state = {
        path: JSON.parse(sessionStorage.getItem('cm_path')) || ['root'],
        items: JSON.parse(localStorage.getItem(STORAGE_KEY)) || [],
        selectedMonth: new Date().getMonth(),
        selectedYear: new Date().getFullYear(),
        menstrualView: new Date(),
        selectionMode: false,
        selectedIds: [],
        editingId: null,
        bible: { book: 'Gênesis', chapter: 1, text: '', fullData: null }
    };

    function saveData() { localStorage.setItem(STORAGE_KEY, JSON.stringify(state.items)); }
    const generateId = () => 'id_' + Date.now() + Math.random().toString(36).substr(2, 9);

    async function initApp() {
        setInterval(() => {
            const now = new Date();
            document.getElementById('clock-display').innerText = now.toLocaleDateString('pt-BR', { weekday: 'long', day: 'numeric', month: 'long', hour: '2-digit', minute: '2-digit' });
        }, 1000);
        document.getElementById('loading-screen').style.display = 'none';
        render();
    }

    // --- Navigation ---
    window.navigate = (id) => { state.path.push(id); sessionStorage.setItem('cm_path', JSON.stringify(state.path)); render(); };
    window.goBack = (idx) => { 
        if(idx === undefined) state.path.pop();
        else state.path = state.path.slice(0, idx + 1);
        sessionStorage.setItem('cm_path', JSON.stringify(state.path));
        render();
    };

    // --- RENDER CORE ---
    window.render = () => {
        const main = document.getElementById('main-content');
        const bread = document.getElementById('breadcrumb-container');
        const currentId = state.path[state.path.length - 1];

        bread.innerHTML = state.path.map((id, i) => {
            const name = id === 'root' ? 'Início' : (ROOT_AREAS.find(a=>a.id===id)?.name || state.items.find(it=>it.id===id)?.name || id);
            return `<span class="breadcrumb-item" onclick="goBack(${i})">${name}</span>`;
        }).join('<i data-lucide="chevron-right" style="width:14px; opacity:0.3"></i>');

        main.innerHTML = '';
        if (currentId === 'root') renderDashboard(main);
        else if (currentId === 'saude') renderHealth(main);
        else if (currentId === 'financeiro') renderFinanceRoot(main);
        else if (currentId === 'biblia') renderBible(main);
        else renderGeneralFolder(main, currentId);

        if(window.lucide) window.lucide.createIcons();
    };

    const ROOT_AREAS = [
        { id: 'pessoal', name: 'Pessoal', icon: 'user' },
        { id: 'financeiro', name: 'Financeiro', icon: 'trending-up' },
        { id: 'saude', name: 'Saúde', icon: 'heart' },
        { id: 'biblia', name: 'Bíblia', icon: 'book-open' }
    ];

    function renderDashboard(el) {
        el.innerHTML = `<div class="section-header"><h2>Minhas Áreas</h2></div><div class="grid-container" id="dash-grid"></div>`;
        const grid = document.getElementById('dash-grid');
        ROOT_AREAS.forEach(a => {
            const card = document.createElement('div');
            card.className = 'card';
            card.innerHTML = `<i data-lucide="${a.icon}" style="color:var(--gold); width:28px;"></i><b>${a.name}</b>`;
            card.onclick = () => window.navigate(a.id);
            grid.appendChild(card);
        });
    }

    // --- HEALTH MODULE (NEW LOGIC) ---
    function renderHealth(el) {
        const weightItem = state.items.find(i => i.type === 'health_weight');
        const stats = calculateWeightStats(weightItem);
        const cycleInfo = calculateCycleInfo();

        el.innerHTML = `
            <div class="section-header"><h2>Saúde e Bem-estar</h2></div>
            
            <!-- PESO: FOCO NA META MENSAL -->
            <div class="card" style="display:block; margin-bottom:20px; padding:30px;">
                <div class="weight-hero">
                    <div class="weight-hero-title">Falta para a meta do mês</div>
                    <div class="weight-hero-value">${stats.monthlyRemaining}<span class="weight-hero-unit">kg</span></div>
                </div>
                <div style="display:grid; grid-template-columns:1fr 1fr; gap:15px; text-align:center;">
                    <div style="background:#f9f9f9; padding:15px; border-radius:20px;">
                        <small style="color:#999; text-transform:uppercase; font-size:0.6rem; font-weight:700;">Peso Atual</small>
                        <div style="font-weight:700; font-size:1.2rem;">${stats.current} kg</div>
                    </div>
                    <div style="background:#f9f9f9; padding:15px; border-radius:20px;">
                        <small style="color:#999; text-transform:uppercase; font-size:0.6rem; font-weight:700;">Meta Total</small>
                        <div style="font-weight:700; font-size:1.2rem;">${stats.target} kg</div>
                    </div>
                </div>
                <button class="btn-add" style="width:100%; margin-top:20px; justify-content:center;" onclick="openModal('weight_register')">REGISTRAR PESO</button>
                <button class="btn-cancel" style="width:100%; margin-top:10px; border:none;" onclick="openModal('weight_config')">CONFIGURAR METAS</button>
            </div>

            <!-- CICLO: ESTILO APP FAMOSO -->
            <div class="card" style="display:block; padding:30px;">
                <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:20px;">
                    <div>
                        <h3 style="color:var(--period-main); font-family:sans-serif; font-weight:800; font-size:1.4rem;">${cycleInfo.statusTitle}</h3>
                        <p style="color:#888; font-size:0.8rem;">${cycleInfo.statusSubtitle}</p>
                    </div>
                    <div style="width:50px; height:50px; background:var(--period-bg); border-radius:50%; display:flex; align-items:center; justify-content:center; color:var(--period-main)">
                        <i data-lucide="droplets"></i>
                    </div>
                </div>

                <div style="display:flex; gap:10px; align-items:center; justify-content:center; margin-bottom:20px;">
                    <button class="btn-cancel" style="padding:5px 10px;" onclick="changeCalMonth(-1)"><i data-lucide="chevron-left" style="width:14px"></i></button>
                    <span style="font-weight:700; text-transform:capitalize;">${state.menstrualView.toLocaleDateString('pt-BR', {month:'long', year:'numeric'})}</span>
                    <button class="btn-cancel" style="padding:5px 10px;" onclick="changeCalMonth(1)"><i data-lucide="chevron-right" style="width:14px"></i></button>
                </div>

                <div class="cal-grid">
                    ${renderCalendarDays()}
                </div>
                <button class="btn-add" style="width:100%; margin-top:20px; justify-content:center; background:var(--period-main)" onclick="openModal('menstrual_log')">ANOTAR SINTOMAS</button>
            </div>
        `;
    }

    function calculateWeightStats(item) {
        if (!item) return { current: '0', target: '0', monthlyRemaining: '0' };
        const c = item.content;
        const current = parseFloat(c.current) || 0;
        const target = parseFloat(c.target) || 0;
        const start = parseFloat(c.startWeight) || 0;
        const remainingToLose = Math.max(0, current - target);
        const monthlyRemaining = (remainingToLose / (parseInt(c.periodMonths) || 1)).toFixed(2);
        return { current, target, monthlyRemaining };
    }

    function calculateCycleInfo() {
        const profile = state.items.find(i => i.type === 'menstrual_profile')?.content || { cycleDuration: 28, flowDuration: 5 };
        const logs = state.items.filter(i => i.type === 'menstrual_cycle').sort((a,b) => new Date(b.content.date) - new Date(a.content.date));
        if (logs.length === 0) return { statusTitle: "Bem-vinda", statusSubtitle: "Registre sua última menstruação" };
        const lastStart = new Date(logs[0].content.date);
        const today = new Date();
        today.setHours(0,0,0,0);
        const diffDays = Math.floor((today - lastStart) / (1000 * 60 * 60 * 24));
        if (diffDays < profile.flowDuration && diffDays >= 0) return { statusTitle: "Menstruação", statusSubtitle: `Dia ${diffDays + 1} do fluxo` };
        const nextPeriod = new Date(lastStart);
        nextPeriod.setDate(lastStart.getDate() + parseInt(profile.cycleDuration));
        const daysToNext = Math.ceil((nextPeriod - today) / (1000 * 60 * 60 * 24));
        if (daysToNext <= 0) return { statusTitle: "Atrasada", statusSubtitle: `${Math.abs(daysToNext)} dias de atraso` };
        return { statusTitle: `Faltam ${daysToNext} dias`, statusSubtitle: "Para a próxima menstruação" };
    }

    function renderCalendarDays() {
        const year = state.menstrualView.getFullYear();
        const month = state.menstrualView.getMonth();
        const firstDay = new Date(year, month, 1).getDay();
        const daysInMonth = new Date(year, month + 1, 0).getDate();
        const profile = state.items.find(i => i.type === 'menstrual_profile')?.content || { cycleDuration: 28, flowDuration: 5 };
        const logs = state.items.filter(i => i.type === 'menstrual_cycle');
        let html = '';
        ['D','S','T','Q','Q','S','S'].forEach(d => html += `<div style="text-align:center; font-size:0.6rem; font-weight:bold; color:#ccc;">${d}</div>`);
        for (let i = 0; i < firstDay; i++) html += '<div></div>';
        for (let d = 1; d <= daysInMonth; d++) {
            const date = new Date(year, month, d);
            const dateStr = date.toISOString().split('T')[0];
            const isToday = dateStr === new Date().toISOString().split('T')[0];
            let classes = 'cal-day';
            if (isToday) classes += ' today';
            const hasLog = logs.find(l => l.content.date === dateStr);
            if (hasLog && hasLog.content.isPeriod) classes += ' period';
            const lastLog = logs.sort((a,b) => new Date(b.content.date) - new Date(a.content.date))[0];
            if (lastLog) {
                const lastDate = new Date(lastLog.content.date);
                const diff = Math.floor((date - lastDate) / (1000 * 60 * 60 * 24));
                const cyclePos = diff % profile.cycleDuration;
                if (cyclePos >= 0 && cyclePos < profile.flowDuration && !hasLog) classes += ' predicted-period';
                if (cyclePos >= 11 && cyclePos <= 16) classes += ' fertile';
                if (cyclePos === 14) classes += ' ovulation';
            }
            html += `<div class="${classes}" onclick="openModal('menstrual_log', '${dateStr}')">${d}${hasLog && hasLog.content.symptoms ? '<div class="symptom-dot"></div>' : ''}</div>`;
        }
        return html;
    }

    function changeCalMonth(v) { state.menstrualView.setMonth(state.menstrualView.getMonth() + v); render(); }

    // --- MODALS ---
    function openModal(type, extra = null) {
        const overlay = document.getElementById('modal-overlay');
        const form = document.getElementById('modal-form');
        const actions = document.getElementById('modal-actions');
        state.editingId = extra; 
        overlay.classList.add('open');
        let html = '';
        let actionHtml = `<button class="btn-cancel" onclick="closeModal()">Cancelar</button>`;

        if (type === 'weight_config') {
            const w = state.items.find(i => i.type === 'health_weight')?.content || {};
            html = `
                <div class="form-group"><label>Peso Inicial (kg)</label><input type="number" id="w-start" class="form-control" value="${w.startWeight || ''}"></div>
                <div class="form-group"><label>Meta Final (kg)</label><input type="number" id="w-target" class="form-control" value="${w.target || ''}"></div>
                <div class="form-group"><label>Prazo (meses)</label><input type="number" id="w-months" class="form-control" value="${w.periodMonths || '12'}"></div>
            `;
            actionHtml += `<button class="btn-add" onclick="saveItem('weight_config')">Salvar</button>`;
        } else if (type === 'weight_register') {
            html = `<div class="form-group"><label>Peso de Hoje (kg)</label><input type="number" step="0.1" id="w-current" class="form-control"></div>`;
            actionHtml += `<button class="btn-add" onclick="saveItem('weight_register')">Registrar</button>`;
        } else if (type === 'menstrual_log') {
            const date = extra || new Date().toISOString().split('T')[0];
            const log = state.items.find(i => i.type === 'menstrual_cycle' && i.content.date === date)?.content || {};
            html = `
                <div class="form-group"><label>Data</label><input type="date" id="m-date" class="form-control" value="${date}"></div>
                <div class="form-group" style="display:flex; gap:10px; align-items:center;">
                    <input type="checkbox" id="m-period" ${log.isPeriod ? 'checked' : ''}> <label style="margin:0;">Estou menstruada</label>
                </div>
                <div class="form-group"><label>Sintomas / Notas</label><textarea id="m-notes" class="form-control">${log.symptoms || ''}</textarea></div>
            `;
            actionHtml += `<button class="btn-add" onclick="saveItem('menstrual_log')">Salvar</button>`;
        } else if (type === 'folder') {
            html = `<div class="form-group"><label>Nome da Pasta</label><input id="f-name" class="form-control"></div>`;
            actionHtml += `<button class="btn-add" onclick="saveItem('folder')">Criar</button>`;
        }

        form.innerHTML = html;
        actions.innerHTML = actionHtml;
        if(window.lucide) window.lucide.createIcons();
    }

    function closeModal() { document.getElementById('modal-overlay').classList.remove('open'); }

    function saveItem(type) {
        if (type === 'weight_config') {
            const content = {
                startWeight: document.getElementById('w-start').value,
                target: document.getElementById('w-target').value,
                periodMonths: document.getElementById('w-months').value,
                current: document.getElementById('w-start').value
            };
            const ex = state.items.find(i => i.type === 'health_weight');
            if (ex) ex.content = content;
            else state.items.push({ id: 'w1', type: 'health_weight', content });
        } else if (type === 'weight_register') {
            const val = document.getElementById('w-current').value;
            const item = state.items.find(i => i.type === 'health_weight');
            if (item) item.content.current = val;
        } else if (type === 'menstrual_log') {
            const date = document.getElementById('m-date').value;
            const logData = { date, isPeriod: document.getElementById('m-period').checked, symptoms: document.getElementById('m-notes').value };
            const idx = state.items.findIndex(i => i.type === 'menstrual_cycle' && i.content.date === date);
            if (idx > -1) state.items[idx].content = logData;
            else state.items.push({ id: 'm'+Date.now(), type: 'menstrual_cycle', content: logData });
        } else if (type === 'folder') {
            state.items.push({ id: generateId(), type: 'folder', name: document.getElementById('f-name').value, parentId: state.path[state.path.length-1] });
        }
        saveData(); closeModal(); render();
    }

    // --- OTHER MODULES (FINANCE, BIBLE) ---
    function renderFinanceRoot(el) {
        el.innerHTML = `<h3>Financeiro</h3><p style="opacity:0.6; margin-top:10px">Seção em desenvolvimento para integração...</p>`;
    }

    function renderBible(el) {
        el.innerHTML = `<h3>Bíblia Sagrada</h3><p style="opacity:0.6; margin-top:10px">Seção em desenvolvimento...</p>`;
    }

    function renderGeneralFolder(el, pid) {
        const items = state.items.filter(i => i.parentId === pid);
        el.innerHTML = `<div class="section-header"><h2>Conteúdo</h2><button class="btn-add" onclick="openModal('folder')">Nova Pasta</button></div><div class="grid-container"></div>`;
        const grid = el.querySelector('.grid-container');
        items.forEach(i => {
            const card = document.createElement('div');
            card.className = 'card';
            card.innerHTML = `<i data-lucide="folder" style="color:var(--gold)"></i><b>${i.name}</b>`;
            card.onclick = () => window.navigate(i.id);
            grid.appendChild(card);
        });
    }

    document.getElementById('lock-pass').addEventListener('keypress', (e) => { if(e.key === 'Enter') checkAccess(); });
</script>
</body>
</html>
