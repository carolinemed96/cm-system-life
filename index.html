<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Caroline Medeiros - Organizador Premium</title>
    
    <script src="https://unpkg.com/lucide@latest"></script>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700&family=Playfair+Display:ital,wght@0,600;0,700;1,600&display=swap" rel="stylesheet">
    
    <style>
        :root {
            --chocolate: #3E2723;
            --chocolate-light: #5D4037;
            --off-white: #FDFBF7;
            --gold: #C5A059;
            --gold-light: #E0C080;
            --text-main: #3E2723;
            --success: #558B2F;
            --danger: #C62828;
            --bg-card: #FFFFFF;
            --transition: all 0.3s cubic-bezier(0.25, 0.8, 0.25, 1);
            --shadow: 0 10px 30px -5px rgba(62, 39, 35, 0.1);
            --shadow-hover: 0 15px 35px -5px rgba(197, 160, 89, 0.2);
            
            /* Menstrual App Colors */
            --period-bg: #FFEBEE;
            --period-main: #E91E63;
            --fertile-bg: #FFF8E1;
            --fertile-main: #FFB300;
            --ovulation-main: #448AFF;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Montserrat', 'Segoe UI', sans-serif; }
        h1, h2, h3, .monogram { font-family: 'Playfair Display', 'Georgia', serif; }

        body { background-color: var(--off-white); color: var(--text-main); min-height: 100vh; display: flex; flex-direction: column; overflow-x: hidden; }

        /* --- Scrollbar --- */
        ::-webkit-scrollbar { width: 6px; height: 6px; }
        ::-webkit-scrollbar-track { background: transparent; }
        ::-webkit-scrollbar-thumb { background: rgba(62, 39, 35, 0.2); border-radius: 3px; }
        ::-webkit-scrollbar-thumb:hover { background: var(--gold); }

        /* --- Header --- */
        header { padding: 20px 20px 15px; text-align: center; background: rgba(255, 255, 255, 0.95); backdrop-filter: blur(10px); border-bottom: 1px solid rgba(197, 160, 89, 0.2); position: sticky; top: 0; z-index: 50; }
        .monogram { font-size: 2.2rem; letter-spacing: 2px; color: var(--chocolate); line-height: 1; }
        .brand-name { font-size: 0.7rem; text-transform: uppercase; letter-spacing: 3px; color: var(--gold); font-weight: 700; margin-top: 4px; }
        .date-time-display { font-size: 0.75rem; color: #8D6E63; margin-top: 8px; font-weight: 500; }

        /* --- Navigation --- */
        .navigation-bar { padding: 10px 5%; background: #fff; display: flex; align-items: center; gap: 10px; font-size: 0.9rem; border-bottom: 1px solid #f0f0f0; overflow-x: auto; white-space: nowrap; }
        .breadcrumb-item { cursor: pointer; color: var(--chocolate-light); font-weight: 600; display: flex; align-items: center; gap: 4px; padding: 4px 8px; border-radius: 6px; transition: var(--transition); }
        .breadcrumb-item:hover { background: #f5f5f5; color: var(--gold); }

        /* --- Main --- */
        main { flex: 1; padding: 25px 5%; max-width: 1200px; margin: 0 auto; width: 100%; position: relative; animation: fadeIn 0.4s ease-out; }
        .section-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; flex-wrap: wrap; gap: 15px; }

        /* --- Cards --- */
        .grid-container { display: grid; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); gap: 20px; }
        .card { background: var(--bg-card); padding: 25px; border-radius: 24px; box-shadow: var(--shadow); cursor: pointer; transition: var(--transition); display: flex; align-items: center; gap: 15px; position: relative; border: 1px solid transparent; }
        .card:hover { transform: translateY(-4px); box-shadow: var(--shadow-hover); border-color: rgba(197, 160, 89, 0.3); }
        .card.selected { border: 2px solid var(--success); background-color: #F1F8E9; }

        /* --- Buttons --- */
        .btn-add { background: var(--chocolate); color: white; border: none; padding: 10px 24px; border-radius: 30px; cursor: pointer; font-size: 0.8rem; display: inline-flex; align-items: center; gap: 8px; font-weight: 600; transition: 0.2s; }
        .btn-add:hover { background: var(--chocolate-light); transform: translateY(-1px); }
        .btn-cancel { background: #f5f5f5; color: #666; border: 1px solid #eee; padding: 10px 24px; border-radius: 30px; cursor: pointer; font-size: 0.8rem; font-weight: 600; transition: 0.2s; }

        /* --- Menstrual Calendar Specifics --- */
        .cal-grid { display: grid; grid-template-columns: repeat(7, 1fr); gap: 2px; }
        .cal-day { aspect-ratio: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; font-size: 0.8rem; border-radius: 50%; position: relative; cursor: pointer; }
        .cal-day.period { background-color: var(--period-main) !important; color: white !important; font-weight: bold; }
        .cal-day.predicted-period { background-color: var(--period-bg); border: 2px dashed var(--period-main); color: var(--period-main); }
        .cal-day.fertile { background-color: var(--fertile-bg); border-bottom: 2px solid var(--fertile-main); }
        .cal-day.ovulation { border: 2px solid var(--ovulation-main); font-weight: bold; }
        .cal-day.today { box-shadow: inset 0 0 0 2px var(--chocolate); }
        
        .symptom-dot { width: 4px; height: 4px; background: var(--gold); border-radius: 50%; position: absolute; bottom: 4px; }

        /* --- Weight Monitor Hero --- */
        .weight-hero { text-align: center; padding: 20px; background: linear-gradient(145deg, #ffffff, #fdfbf7); border-radius: 30px; border: 1px solid rgba(197, 160, 89, 0.2); margin-bottom: 15px; }
        .weight-hero-title { font-size: 0.75rem; text-transform: uppercase; letter-spacing: 2px; color: #888; margin-bottom: 5px; font-weight: 700; }
        .weight-hero-value { font-size: 3rem; font-weight: 800; color: var(--chocolate); font-family: 'Playfair Display', serif; }
        .weight-hero-unit { font-size: 1rem; color: var(--gold); }

        /* --- Floating UI --- */
        .floating-star-btn { position: fixed; bottom: 30px; right: 30px; width: 60px; height: 60px; background: var(--gold); border-radius: 50%; display: flex; align-items: center; justify-content: center; cursor: pointer; z-index: 1000; box-shadow: 0 10px 20px rgba(197,160,89,0.3); }
        
        #modal-overlay { position: fixed; top:0; left:0; width:100%; height:100%; background: rgba(0,0,0,0.5); backdrop-filter: blur(4px); display: none; justify-content: center; align-items: center; z-index: 9999; }
        .modal { background: white; padding: 30px; border-radius: 24px; width: 90%; max-width: 450px; }
        .form-group { margin-bottom: 15px; }
        .form-group label { display: block; font-size: 0.8rem; font-weight: 700; margin-bottom: 5px; color: var(--chocolate); }
        .form-control { width: 100%; padding: 12px; border-radius: 12px; border: 1px solid #eee; outline: none; }
        
        @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }

        .create-menu-dropdown { position: absolute; bottom: 70px; right: 0; background: white; border-radius: 16px; box-shadow: 0 10px 30px rgba(0,0,0,0.1); display: none; width: 200px; overflow: hidden; }
        .create-menu-dropdown.show { display: block; }
        .create-menu-item { padding: 12px 20px; cursor: pointer; display: flex; align-items: center; gap: 10px; font-size: 0.9rem; }
        .create-menu-item:hover { background: #fdfaf5; }
    </style>
</head>
<body>

<div id="lock-screen" style="position:fixed; top:0; left:0; width:100%; height:100%; background:var(--off-white); z-index:10000; display:flex; flex-direction:column; justify-content:center; align-items:center;">
    <div class="monogram" style="font-size: 3rem; margin-bottom: 20px;">CM</div>
    <input type="password" id="lock-pass" style="padding:15px; border-radius:30px; border:1px solid var(--gold); text-align:center; letter-spacing:5px;" placeholder="SENHA" maxlength="4">
    <button class="btn-add" style="margin-top:20px;" onclick="checkAccess()">ENTRAR</button>
</div>

<header>
    <div class="monogram">CM</div>
    <div class="brand-name">Caroline Medeiros</div>
    <div class="date-time-display" id="clock-display">...</div>
</header>

<div class="navigation-bar" id="breadcrumb-container"></div>

<main id="main-content"></main>

<div id="modal-overlay">
    <div class="modal">
        <h3 id="modal-title" style="margin-bottom:20px;">Adicionar</h3>
        <div id="modal-form"></div>
        <div id="modal-actions" style="margin-top:25px; display:flex; gap:10px; justify-content:flex-end;"></div>
    </div>
</div>

<div id="toast-container" style="position:fixed; top:20px; right:20px; z-index:11000;"></div>

<script>
    // --- State & Config ---
    const STORAGE_KEY = 'cm_premium_data_v2';
    const _0x1c8a = 1509442; // Hash for "1234"
    const _hash = (s) => s.split('').reduce((a,b)=>{a=((a<<5)-a)+b.charCodeAt(0);return a&a},0);

    let state = {
        path: ['root'],
        items: JSON.parse(localStorage.getItem(STORAGE_KEY)) || [],
        menstrualView: new Date()
    };

    function checkAccess() {
        const inp = document.getElementById('lock-pass');
        if (_hash(inp.value) === _0x1c8a) {
            document.getElementById('lock-screen').style.display = 'none';
            initApp();
        } else {
            alert("Senha incorreta");
            inp.value = '';
        }
    }

    function saveData() {
        localStorage.setItem(STORAGE_KEY, JSON.stringify(state.items));
    }

    function initApp() {
        setInterval(() => {
            const now = new Date();
            document.getElementById('clock-display').innerText = now.toLocaleDateString('pt-BR', { weekday: 'long', day: 'numeric', month: 'long', hour: '2-digit', minute: '2-digit' });
        }, 1000);
        render();
    }

    // --- Core Logic ---
    window.navigate = (id) => { state.path.push(id); render(); };
    window.goBack = (idx) => { state.path = state.path.slice(0, idx + 1); render(); };

    function render() {
        const main = document.getElementById('main-content');
        const bread = document.getElementById('breadcrumb-container');
        const currentId = state.path[state.path.length - 1];

        bread.innerHTML = state.path.map((id, i) => {
            const name = id === 'root' ? 'Início' : (state.items.find(it => it.id === id)?.name || id);
            return `<span class="breadcrumb-item" onclick="goBack(${i})">${name}</span>`;
        }).join('<i data-lucide="chevron-right" style="width:14px; opacity:0.3"></i>');

        main.innerHTML = '';

        if (currentId === 'root') renderDashboard(main);
        else if (currentId === 'saude') renderHealth(main);
        else if (currentId === 'financeiro') renderFinance(main);
        else renderGeneralFolder(main, currentId);

        if(window.lucide) window.lucide.createIcons();
    }

    const ROOT_AREAS = [
        { id: 'saude', name: 'Saúde & Bem-estar', icon: 'heart', color: '#E91E63' },
        { id: 'financeiro', name: 'Financeiro', icon: 'trending-up', color: '#4CAF50' },
        { id: 'pessoal', name: 'Pessoal', icon: 'user', color: '#C5A059' }
    ];

    function renderDashboard(el) {
        el.innerHTML = `<div class="section-header"><h2>Minhas Áreas</h2></div><div class="grid-container" id="dash-grid"></div>`;
        const grid = document.getElementById('dash-grid');
        ROOT_AREAS.forEach(a => {
            const card = document.createElement('div');
            card.className = 'card';
            card.innerHTML = `<i data-lucide="${a.icon}" style="color:${a.color}; width:28px;"></i><b>${a.name}</b>`;
            card.onclick = () => window.navigate(a.id);
            grid.appendChild(card);
        });
    }

    // --- HEALTH MODULE (UPDATED) ---
    function renderHealth(el) {
        const weightItem = state.items.find(i => i.type === 'health_weight');
        const stats = calculateWeightStats(weightItem);
        const cycleInfo = calculateCycleInfo();

        el.innerHTML = `
            <div class="section-header"><h2>Saúde</h2></div>
            
            <!-- PESO: FOCO NA META MENSAL -->
            <div class="card" style="display:block; margin-bottom:20px; padding:30px;">
                <div class="weight-hero">
                    <div class="weight-hero-title">Falta para a meta do mês</div>
                    <div class="weight-hero-value">${stats.monthlyRemaining}<span class="weight-hero-unit">kg</span></div>
                </div>
                <div style="display:grid; grid-template-columns:1fr 1fr; gap:15px; text-align:center;">
                    <div style="background:#f9f9f9; padding:15px; border-radius:20px;">
                        <small style="color:#999; text-transform:uppercase; font-size:0.6rem; font-weight:700;">Peso Atual</small>
                        <div style="font-weight:700; font-size:1.2rem;">${stats.current} kg</div>
                    </div>
                    <div style="background:#f9f9f9; padding:15px; border-radius:20px;">
                        <small style="color:#999; text-transform:uppercase; font-size:0.6rem; font-weight:700;">Meta Total</small>
                        <div style="font-weight:700; font-size:1.2rem;">${stats.target} kg</div>
                    </div>
                </div>
                <button class="btn-add" style="width:100%; margin-top:20px; justify-content:center;" onclick="openModal('weight_register')">REGISTRAR PESO</button>
                <button class="btn-cancel" style="width:100%; margin-top:10px; border:none;" onclick="openModal('weight_config')">CONFIGURAR METAS</button>
            </div>

            <!-- CICLO: ESTILO APP FAMOSO -->
            <div class="card" style="display:block; padding:30px;">
                <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:20px;">
                    <div>
                        <h3 style="color:var(--period-main); font-family:sans-serif; font-weight:800; font-size:1.4rem;">${cycleInfo.statusTitle}</h3>
                        <p style="color:#888; font-size:0.8rem;">${cycleInfo.statusSubtitle}</p>
                    </div>
                    <div style="width:50px; height:50px; background:var(--period-bg); border-radius:50%; display:flex; align-items:center; justify-content:center; color:var(--period-main)">
                        <i data-lucide="droplets"></i>
                    </div>
                </div>

                <div style="display:flex; gap:10px; align-items:center; justify-content:center; margin-bottom:20px;">
                    <button class="btn-cancel" style="padding:5px 10px;" onclick="changeCalMonth(-1)"><i data-lucide="chevron-left" style="width:14px"></i></button>
                    <span style="font-weight:700; text-transform:capitalize;">${state.menstrualView.toLocaleDateString('pt-BR', {month:'long', year:'numeric'})}</span>
                    <button class="btn-cancel" style="padding:5px 10px;" onclick="changeCalMonth(1)"><i data-lucide="chevron-right" style="width:14px"></i></button>
                </div>

                <div class="cal-grid">
                    ${renderCalendarDays()}
                </div>

                <div style="margin-top:20px; display:flex; gap:15px; font-size:0.7rem; justify-content:center; color:#888;">
                    <span><span style="display:inline-block; width:8px; height:8px; background:var(--period-main); border-radius:50%;"></span> Menstruação</span>
                    <span><span style="display:inline-block; width:8px; height:8px; border:1px solid var(--fertile-main); border-radius:50%;"></span> Período Fértil</span>
                </div>

                <button class="btn-add" style="width:100%; margin-top:20px; justify-content:center; background:var(--period-main)" onclick="openModal('menstrual_log')">ANOTAR SINTOMAS</button>
            </div>
        `;
    }

    function calculateWeightStats(item) {
        if (!item) return { current: '0', target: '0', monthlyRemaining: '0' };
        const c = item.content;
        const current = parseFloat(c.current) || 0;
        const target = parseFloat(c.target) || 0;
        const start = parseFloat(c.startWeight) || 0;
        
        // Meta mensal: Perda total necessária / meses de prazo
        const totalToLose = Math.max(0, start - target);
        const monthlyGoal = totalToLose / (parseInt(c.periodMonths) || 1);
        
        // Quanto já perdeu no total
        const totalLost = Math.max(0, start - current);
        
        // Simulação simples: Meta do mês atual baseada no quanto falta
        const remainingToLose = Math.max(0, current - target);
        const monthlyRemaining = (remainingToLose / (parseInt(c.periodMonths) || 1)).toFixed(2);

        return { current, target, monthlyRemaining };
    }

    function calculateCycleInfo() {
        const profile = state.items.find(i => i.type === 'menstrual_profile')?.content || { cycleDuration: 28, flowDuration: 5 };
        const logs = state.items.filter(i => i.type === 'menstrual_cycle').sort((a,b) => new Date(b.content.date) - new Date(a.content.date));
        
        if (logs.length === 0) return { statusTitle: "Bem-vinda", statusSubtitle: "Registre sua última menstruação" };

        const lastStart = new Date(logs[0].content.date);
        const today = new Date();
        const diffDays = Math.floor((today - lastStart) / (1000 * 60 * 60 * 24));

        if (diffDays < profile.flowDuration) return { statusTitle: "Menstruação", statusSubtitle: `Dia ${diffDays + 1} do ciclo` };
        
        const nextPeriod = new Date(lastStart);
        nextPeriod.setDate(lastStart.getDate() + parseInt(profile.cycleDuration));
        const daysToNext = Math.ceil((nextPeriod - today) / (1000 * 60 * 60 * 24));

        if (daysToNext <= 0) return { statusTitle: "Atrasada", statusSubtitle: `${Math.abs(daysToNext)} dias de atraso` };
        
        return { statusTitle: `Faltam ${daysToNext} dias`, statusSubtitle: "Para a próxima menstruação" };
    }

    function renderCalendarDays() {
        const year = state.menstrualView.getFullYear();
        const month = state.menstrualView.getMonth();
        const firstDay = new Date(year, month, 1).getDay();
        const daysInMonth = new Date(year, month + 1, 0).getDate();
        
        const profile = state.items.find(i => i.type === 'menstrual_profile')?.content || { cycleDuration: 28, flowDuration: 5 };
        const logs = state.items.filter(i => i.type === 'menstrual_cycle');

        let html = '';
        const weekDays = ['D', 'S', 'T', 'Q', 'Q', 'S', 'S'];
        weekDays.forEach(d => html += `<div style="text-align:center; font-size:0.6rem; font-weight:bold; color:#ccc; margin-bottom:5px;">${d}</div>`);

        for (let i = 0; i < firstDay; i++) html += '<div></div>';

        for (let d = 1; d <= daysInMonth; d++) {
            const date = new Date(year, month, d);
            const dateStr = date.toISOString().split('T')[0];
            const isToday = dateStr === new Date().toISOString().split('T')[0];
            
            // Lógica de Cores
            let classes = 'cal-day';
            if (isToday) classes += ' today';
            
            // Verificar se há log manual
            const hasLog = logs.find(l => l.content.date === dateStr);
            if (hasLog && hasLog.content.isPeriod) classes += ' period';
            
            // Predição (Baseada no último log)
            const lastLog = logs.sort((a,b) => new Date(b.content.date) - new Date(a.content.date))[0];
            if (lastLog) {
                const lastDate = new Date(lastLog.content.date);
                const diff = Math.floor((date - lastDate) / (1000 * 60 * 60 * 24));
                const cyclePos = diff % profile.cycleDuration;
                
                if (cyclePos >= 0 && cyclePos < profile.flowDuration && !hasLog) classes += ' predicted-period';
                if (cyclePos >= 11 && cyclePos <= 16) classes += ' fertile';
                if (cyclePos === 14) classes += ' ovulation';
            }

            html += `<div class="${classes}" onclick="openModal('menstrual_log', '${dateStr}')">${d}${hasLog && hasLog.content.symptoms ? '<div class="symptom-dot"></div>' : ''}</div>`;
        }
        return html;
    }

    function changeCalMonth(val) {
        state.menstrualView.setMonth(state.menstrualView.getMonth() + val);
        render();
    }

    // --- MODALS ---
    function openModal(type, extra = null) {
        const overlay = document.getElementById('modal-overlay');
        const form = document.getElementById('modal-form');
        const actions = document.getElementById('modal-actions');
        
        overlay.style.display = 'flex';
        let html = '';
        let actionHtml = `<button class="btn-cancel" onclick="closeModal()">Cancelar</button>`;

        if (type === 'weight_config') {
            const w = state.items.find(i => i.type === 'health_weight')?.content || {};
            html = `
                <div class="form-group"><label>Peso Inicial (kg)</label><input type="number" id="w-start" class="form-control" value="${w.startWeight || ''}"></div>
                <div class="form-group"><label>Meta Final (kg)</label><input type="number" id="w-target" class="form-control" value="${w.target || ''}"></div>
                <div class="form-group"><label>Prazo (meses)</label><input type="number" id="w-months" class="form-control" value="${w.periodMonths || '12'}"></div>
            `;
            actionHtml += `<button class="btn-add" onclick="saveWeightConfig()">Salvar</button>`;
        } else if (type === 'weight_register') {
            html = `<div class="form-group"><label>Peso de Hoje (kg)</label><input type="number" step="0.1" id="w-current" class="form-control"></div>`;
            actionHtml += `<button class="btn-add" onclick="saveWeightEntry()">Registrar</button>`;
        } else if (type === 'menstrual_log') {
            const date = extra || new Date().toISOString().split('T')[0];
            const log = state.items.find(i => i.type === 'menstrual_cycle' && i.content.date === date)?.content || {};
            html = `
                <div class="form-group"><label>Data</label><input type="date" id="m-date" class="form-control" value="${date}"></div>
                <div class="form-group" style="display:flex; gap:10px; align-items:center;">
                    <input type="checkbox" id="m-period" ${log.isPeriod ? 'checked' : ''}> <label style="margin:0;">Estou menstruada</label>
                </div>
                <div class="form-group"><label>Sintomas / Notas</label><textarea id="m-notes" class="form-control">${log.symptoms || ''}</textarea></div>
            `;
            actionHtml += `<button class="btn-add" onclick="saveMenstrualLog()">Salvar</button>`;
        }

        form.innerHTML = html;
        actions.innerHTML = actionHtml;
    }

    function closeModal() { document.getElementById('modal-overlay').style.display = 'none'; }

    function saveWeightConfig() {
        const data = {
            startWeight: document.getElementById('w-start').value,
            target: document.getElementById('w-target').value,
            periodMonths: document.getElementById('w-months').value,
            current: document.getElementById('w-start').value // Começa com o inicial
        };
        const idx = state.items.findIndex(i => i.type === 'health_weight');
        if (idx > -1) state.items[idx].content = data;
        else state.items.push({ id: 'w1', type: 'health_weight', name: 'Controle de Peso', content: data });
        saveData(); closeModal(); render();
    }

    function saveWeightEntry() {
        const val = document.getElementById('w-current').value;
        const item = state.items.find(i => i.type === 'health_weight');
        if (item) {
            item.content.current = val;
            saveData(); closeModal(); render();
        }
    }

    function saveMenstrualLog() {
        const date = document.getElementById('m-date').value;
        const isPeriod = document.getElementById('m-period').checked;
        const symptoms = document.getElementById('m-notes').value;
        
        const idx = state.items.findIndex(i => i.type === 'menstrual_cycle' && i.content.date === date);
        const logData = { date, isPeriod, symptoms };
        
        if (idx > -1) state.items[idx].content = logData;
        else state.items.push({ id: 'm' + Date.now(), type: 'menstrual_cycle', content: logData });
        
        // Se for início de menstruação, atualizar perfil
        if (isPeriod) {
            const profile = state.items.find(i => i.type === 'menstrual_profile');
            if (profile) profile.content.lastDate = date;
            else state.items.push({id: 'mp', type: 'menstrual_profile', content: {cycleDuration: 28, flowDuration: 5, lastDate: date}});
        }

        saveData(); closeModal(); render();
    }

    document.getElementById('lock-pass').addEventListener('keypress', (e) => { if(e.key === 'Enter') checkAccess(); });

</script>
